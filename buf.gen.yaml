# The Go code for the protos is generated by Bazel (proto/blitz/v1's
# go_proto_library), never committed. This generates the desktop page's
# TypeScript in apps/desktop/web/src/gen, until Bazel does that too;
# protoc-gen-es is pinned in apps/desktop/web's lockfile (run `pnpm
# install` there first).
version: v2
plugins:
  - local: apps/desktop/web/node_modules/.bin/protoc-gen-es
    out: apps/desktop/web/src/gen
    opt: target=ts

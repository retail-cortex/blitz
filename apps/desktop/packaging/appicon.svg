<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Blitz's app icon: the brand's bolt on the app's blue. appicon.png is
       rendered from it (inkscape appicon.svg -w 1024 -h 1024 -o appicon.png). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6de0"/>
      <stop offset="0.55" stop-color="#0b57d0"/>
      <stop offset="1" stop-color="#062e6f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#8ab4f8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8ab4f8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde293"/>
      <stop offset="0.45" stop-color="#fbbc04"/>
      <stop offset="1" stop-color="#f29900"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="blur"/>
      <feFlood flood-color="#000" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="boltShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.47"/>
      <feOffset dy="0.4" result="blur"/>
      <feFlood flood-color="#041e49" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <!-- The tile: macOS's icon grid (824 of 1024, 185 corner radius). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <g clip-path="url(#tileClip)">
    <circle cx="512" cy="500" r="330" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <!-- The brand's bolt (docs/static/brand.svg), centred. -->
  <g transform="translate(206 206) scale(25.5)" filter="url(#boltShadow)">
    <path fill="url(#bolt)" d="M11 15H6L13 1V9H18L11 23V15Z"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
</svg>

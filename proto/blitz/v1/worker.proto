syntax = "proto3";

package blitz.v1;

import "blitz/v1/turn.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/retail-cortex/blitz/proto/blitz/v1;blitzv1";

// WorkerService manages workers: scheduled workflows a workspace defines in
// .agents/workers/<name>/WORKER.md or workers/<name>/WORKER.md (ROADMAP
// item 24). The service finds them by
// scanning trusted workspaces; a worker runs only once enabled against its
// content hash, and editing it disables it again. Actions outside a worker's
// permissions are refused and recorded, never left waiting.
service WorkerService {
  // Returns a workspace's workers, or every registered workspace's.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  // Writes a new worker's WORKER.md (in the first of workers.paths,
  // .agents/workers by default) from a form, once it would load as valid;
  // otherwise writes nothing and says why (WORKER_INVALID; WORKER_EXISTS
  // for a name the workspace has). It starts disabled.
  rpc CreateWorker(CreateWorkerRequest) returns (CreateWorkerResponse);
  // Returns a worker's WORKER.md as written (not as the policy caps it),
  // for editing, with its current hash; it needn't be valid (UNKNOWN_WORKER).
  rpc GetWorkerSpec(GetWorkerSpecRequest) returns (GetWorkerSpecResponse);
  // Rewrites a worker's WORKER.md from a form, if it still has the hash the
  // caller edited (HASH_MISMATCH) and the result would load as valid;
  // otherwise writes nothing and says why. Its name can't change. An
  // enabled worker is suspended (changed) until it's enabled again.
  rpc UpdateWorker(UpdateWorkerRequest) returns (UpdateWorkerResponse);
  // Enables a worker at the content hash the caller reviewed
  // (HASH_MISMATCH if the file changed since).
  rpc EnableWorker(EnableWorkerRequest) returns (EnableWorkerResponse);
  // Disables a worker.
  rpc DisableWorker(DisableWorkerRequest) returns (DisableWorkerResponse);
  // Deletes a worker: its directory and whether it was enabled; its past
  // runs stay. Refused while it runs (RUN_IN_PROGRESS); UNKNOWN_WORKER.
  rpc DeleteWorker(DeleteWorkerRequest) returns (DeleteWorkerResponse);
  // Starts a run now, outside the schedule (WORKER_DISABLED, RUN_IN_PROGRESS).
  rpc RunWorker(RunWorkerRequest) returns (RunWorkerResponse);
  // Returns a worker's runs, newest first.
  rpc ListWorkerRuns(ListWorkerRunsRequest) returns (ListWorkerRunsResponse);
  // Returns one run.
  rpc GetWorkerRun(GetWorkerRunRequest) returns (GetWorkerRunResponse);
  // Restores the files a run changed as they were before it, refusing
  // (UNDO_CONFLICT) when one changed since, unless force (NOTHING_TO_UNDO).
  rpc UndoWorkerRun(UndoWorkerRunRequest) returns (UndoWorkerRunResponse);
  // Streams a run's events: those already produced, then live ones until
  // it finishes.
  rpc WatchWorkerRun(WatchWorkerRunRequest) returns (stream WatchWorkerRunResponse);
}

// WorkerState is whether a worker may run.
enum WorkerState {
  WORKER_STATE_UNSPECIFIED = 0;
  // Found but never enabled.
  WORKER_STATE_NEW = 1;
  WORKER_STATE_ENABLED = 2;
  WORKER_STATE_DISABLED = 3;
  // Enabled at an older hash; the file has changed since.
  WORKER_STATE_CHANGED = 4;
  // WORKER.md can't be used; problems says why.
  WORKER_STATE_INVALID = 5;
}

// WorkerLimits bound one run.
message WorkerLimits {
  int32 max_turns = 1;
  double max_cost_usd = 2;
  google.protobuf.Duration timeout = 3;
}

// Worker describes a worker.
message Worker {
  string workspace = 1;
  string name = 2;
  string description = 3;
  // WORKER.md, absolute.
  string path = 4;
  // Of WORKER.md and the worker's other files.
  string hash = 5;
  WorkerState state = 6;
  // As written ("Daily at 6 AM"), and as understood.
  string schedule = 7;
  string cron = 8;
  string timezone = 9;
  google.protobuf.Timestamp next_run = 10;
  string agent = 11;
  string model = 12;
  // What the worker may do without asking, as its frontmatter asks,
  // after the host policy's cap.
  repeated string permissions = 13;
  WorkerLimits limits = 14;
  // Why the worker is invalid, or what the policy removed.
  repeated string problems = 15;
  // Its latest recorded run (unset: none yet).
  WorkerRun last_run = 16;
}

// Request message for WorkerService.ListWorkers.
message ListWorkersRequest {
  // Empty for every registered workspace.
  string workspace = 1;
}

// Response message for WorkerService.ListWorkers.
message ListWorkersResponse {
  repeated Worker workers = 1;
}

// Request message for WorkerService.CreateWorker: WORKER.md's
// frontmatter fields and the workflow. Empty fields are left out.
message CreateWorkerRequest {
  string workspace = 1;
  // Lowercase letters, digits, - and _: the worker's directory.
  string name = 2;
  string description = 3;
  // A cron expression, a descriptor, or plain text ("Weekdays at 9:30").
  string schedule = 4;
  // An IANA time zone; "" is the service machine's.
  string timezone = 5;
  string agent = 6;
  string model = 7;
  // "kind:pattern", kind shell, write, delete, web or mcp.
  repeated string permissions = 8;
  int32 max_turns = 9;
  double max_cost_usd = 10;
  // A duration like "20m".
  string timeout = 11;
  // "", "none" or "once".
  string catch_up = 12;
  // The workflow: WORKER.md's body.
  string prompt = 13;
}

// WorkerDefinition is a WORKER.md as written: its frontmatter fields and
// the workflow. Empty fields are left out of the file.
message WorkerDefinition {
  // The worker's directory; fixed once created.
  string name = 1;
  string description = 2;
  // A cron expression, a descriptor, or plain text ("Weekdays at 9:30").
  string schedule = 3;
  // An IANA time zone; "" is the service machine's.
  string timezone = 4;
  string agent = 5;
  string model = 6;
  // "kind:pattern", kind shell, write, delete, web or mcp.
  repeated string permissions = 7;
  int32 max_turns = 8;
  double max_cost_usd = 9;
  // A duration like "20m".
  string timeout = 10;
  // "", "none" or "once".
  string catch_up = 11;
  // The workflow: WORKER.md's body.
  string prompt = 12;
}

// Request message for WorkerService.GetWorkerSpec.
message GetWorkerSpecRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkerService.GetWorkerSpec.
message GetWorkerSpecResponse {
  WorkerDefinition worker = 1;
  // The hash UpdateWorker must be given.
  string hash = 2;
}

// Request message for WorkerService.UpdateWorker.
message UpdateWorkerRequest {
  string workspace = 1;
  // The hash GetWorkerSpec returned: the content being replaced.
  string hash = 2;
  WorkerDefinition worker = 3;
}

// Response message for WorkerService.UpdateWorker.
message UpdateWorkerResponse {
  // The worker as saved; unset when problems stopped it.
  Worker worker = 1;
  // Why it wasn't saved (nothing was written).
  repeated string problems = 2;
}

// Response message for WorkerService.CreateWorker.
message CreateWorkerResponse {
  // The new worker; unset when problems stopped it.
  Worker worker = 1;
  // Why the worker wasn't created (nothing was written).
  repeated string problems = 2;
}

// Request message for WorkerService.EnableWorker.
message EnableWorkerRequest {
  string workspace = 1;
  string name = 2;
  // The hash the caller reviewed.
  string hash = 3;
}

// Response message for WorkerService.EnableWorker.
message EnableWorkerResponse {
  Worker worker = 1;
}

// Request message for WorkerService.DisableWorker.
message DisableWorkerRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkerService.DisableWorker.
message DisableWorkerResponse {
  Worker worker = 1;
}

// Request message for WorkerService.DeleteWorker.
message DeleteWorkerRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkerService.DeleteWorker.
message DeleteWorkerResponse {}

// RunStatus is where a run stands.
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_RUNNING = 1;
  RUN_STATUS_SUCCEEDED = 2;
  RUN_STATUS_FAILED = 3;
  // Stopped at a limit (turns, cost, time).
  RUN_STATUS_LIMITED = 4;
  // Not started: the previous run was still going (overlap: skip).
  RUN_STATUS_SKIPPED = 5;
}

// Refusal is an action a run wasn't permitted.
message Refusal {
  string tool = 1;
  ActionKind kind = 2;
  string detail = 3;
  google.protobuf.Timestamp time = 4;
}

// WorkerRun is one run of a worker.
message WorkerRun {
  string id = 1;
  string workspace = 2;
  string worker = 3;
  // The hash the run used.
  string hash = 4;
  RunStatus status = 5;
  // Scheduled, or started by RunWorker.
  bool manual = 6;
  google.protobuf.Timestamp started = 7;
  google.protobuf.Duration duration = 8;
  Usage usage = 9;
  // The session holding the run's conversation.
  string session_id = 10;
  repeated Refusal refusals = 11;
  // Why the run failed or stopped.
  ErrorInfo error = 12;
  // The files the run changed (UndoWorkerRun restores them).
  repeated string files = 13;
}

// Request message for WorkerService.UndoWorkerRun.
message UndoWorkerRunRequest {
  string workspace = 1;
  string run_id = 2;
  bool force = 3;
}

// Response message for WorkerService.UndoWorkerRun.
message UndoWorkerRunResponse {
  repeated string restored = 1;
}

// Request message for WorkerService.RunWorker.
message RunWorkerRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkerService.RunWorker.
message RunWorkerResponse {
  WorkerRun run = 1;
}

// Request message for WorkerService.ListWorkerRuns.
message ListWorkerRunsRequest {
  string workspace = 1;
  string name = 2;
  // At most this many (0: a default).
  int32 limit = 3;
}

// Response message for WorkerService.ListWorkerRuns.
message ListWorkerRunsResponse {
  repeated WorkerRun runs = 1;
}

// Request message for WorkerService.GetWorkerRun.
message GetWorkerRunRequest {
  string run_id = 1;
}

// Response message for WorkerService.GetWorkerRun.
message GetWorkerRunResponse {
  WorkerRun run = 1;
}

// Request message for WorkerService.WatchWorkerRun.
message WatchWorkerRunRequest {
  string run_id = 1;
}

// Response message for WorkerService.WatchWorkerRun.
message WatchWorkerRunResponse {
  TurnEvent event = 1;
}

syntax = "proto3";

package blitz.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/retail-cortex/blitz/proto/blitz/v1;blitzv1";

// FileService is the workspace's files for the user: the desktop app's
// explorer and editor. Paths are relative to the workspace, with "/"
// separators; nothing outside the workspace, and never .git. The agent's
// path rules bind the agent, not the user: blocked and read-only paths are
// reported, not refused. The agent's next turn is told of the user's
// changes.
//
// Every request names its workspace by absolute directory. Errors carry an
// ErrorInfo detail; a write over a changed file is FILE_CHANGED.
service FileService {
  // A folder's entries, folders first.
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
  // A file for the editor.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  // An image, PDF or sound file's bytes, to show or play it.
  rpc ReadPreview(ReadPreviewRequest) returns (ReadPreviewResponse);
  // Writes a file if it still has the version read (FILE_CHANGED if not).
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  // Writes bytes (a PDF the editor exported) as WriteFile writes text.
  rpc WriteBinaryFile(WriteBinaryFileRequest) returns (WriteBinaryFileResponse);
  // Uploads a file in chunks (a file dropped from the computer): the first
  // call (upload_id "") starts it, each adds data, and the one with done
  // puts it at path. Unfinished uploads are dropped after ten minutes idle.
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
  // Creates a folder, and any missing folders above it; it must not exist.
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);
  // Moves a file or folder; the destination must not exist.
  rpc RenameFile(RenameFileRequest) returns (RenameFileResponse);
  // Deletes a file, or a folder with everything in it.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  // Runs a git action on a file or folder of the workspace: stage it,
  // unstage it, discard its changes (back to the last commit), or add it to
  // the workspace's .gitignore or take it out again. Git runs with the
  // repository's filter drivers and fsmonitor switched off.
  // NOT_A_REPOSITORY outside one; IGNORED_ELSEWHERE when another rule
  // still ignores what's taken out (pattern and source in the metadata).
  rpc GitFileAction(GitFileActionRequest) returns (GitFileActionResponse);
  // The commits that changed a file (following renames), a folder or the
  // whole workspace (path ""), newest first, a page at a time, with their
  // parents for a graph (View revisions). NOT_A_REPOSITORY outside one.
  rpc GetFileHistory(GetFileHistoryRequest) returns (GetFileHistoryResponse);
  // A unified diff for a file or folder: from a revision to now, what a
  // revision changed, or between two revisions (BAD_REVISION for one that
  // isn't a commit of the history).
  rpc GetFileRevisionDiff(GetFileRevisionDiffRequest) returns (GetFileRevisionDiffResponse);
  // Puts a file back as it was in a revision, if it still has the version
  // given (FILE_CHANGED if not); or a folder's files changed or deleted
  // since, keeping those added since (preview: only says which). The
  // index is left alone.
  rpc RestoreFileRevision(RestoreFileRevisionRequest) returns (RestoreFileRevisionResponse);
  // Markdown written as a Word document (.docx), its images read beside
  // the file it belongs to; the caller writes it (Export as Word, /export).
  rpc RenderDocx(RenderDocxRequest) returns (RenderDocxResponse);
  // Files whose path matches a query, best first (Go to file).
  rpc FindFiles(FindFilesRequest) returns (FindFilesResponse);
  // Files' current versions, to notice changes made elsewhere.
  rpc StatFiles(StatFilesRequest) returns (StatFilesResponse);
  // A page of a CSV or TSV file's rows, searched, filtered by column and
  // sorted, streamed so a file of any size can be read (NOT_A_TABLE,
  // BAD_FILTER, BAD_PATH, FILE_NOT_FOUND).
  rpc ReadTable(ReadTableRequest) returns (ReadTableResponse);
}

// What a folder entry is.
enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_FILE = 1;
  FILE_KIND_FOLDER = 2;
  FILE_KIND_SYMLINK = 3;
}

// One entry of a folder, as ListDir returns it.
message FileEntry {
  string name = 1;
  string path = 2;
  FileKind kind = 3;
  int64 size = 4;
  google.protobuf.Timestamp modified = 5;
  // modified, added, deleted, renamed, untracked, conflicted; "changed"
  // for a folder with changes under it; "" when clean or not in git.
  string git = 6;
  // Why it's hidden by default: "blocked", "ignored", "dot", "agent" (an
  // agent instruction file such as AGENTS.md), or "".
  string hidden = 7;
  // The agent's rule for it: "blocked", "read_only", or "".
  string agent_rule = 8;
  // How much of a file's change is staged: "all", "some" (staged, then
  // changed again), or "" (none, or a folder).
  string staged = 9;
  // Git ignores it, whatever hidden says (a dotfile git ignores is hidden
  // as "dot").
  bool ignored = 10;
}

// Request message for FileService.ListDir.
message ListDirRequest {
  string workspace = 1;
  // "" for the workspace itself.
  string path = 2;
  bool show_hidden = 3;
}

// Response message for FileService.ListDir.
message ListDirResponse {
  repeated FileEntry entries = 1;
  // More than 5,000 entries; the rest are left out.
  bool truncated = 2;
  // The workspace is in a git repository.
  bool repo = 3;
}

// Request message for FileService.ReadFile.
message ReadFileRequest {
  string workspace = 1;
  string path = 2;
}

// Response message for FileService.ReadFile.
message ReadFileResponse {
  string path = 1;
  // "" for binary and too-large files.
  string text = 2;
  // The content's SHA-256, for WriteFile.
  string version = 3;
  int64 size = 4;
  bool binary = 5;
  bool too_large = 6;
  string agent_rule = 7;
}

// Request message for FileService.ReadPreview.
message ReadPreviewRequest {
  string workspace = 1;
  string path = 2;
}

// Response message for FileService.ReadPreview.
message ReadPreviewResponse {
  string path = 1;
  // image/png, image/jpeg, image/gif, image/webp, image/svg+xml, image/bmp,
  // image/x-icon, application/pdf, audio/wav, audio/mpeg, audio/mp4,
  // audio/aac, audio/ogg or audio/flac.
  string mime = 2;
  bytes data = 3;
}

// Request message for FileService.WriteFile.
message WriteFileRequest {
  string workspace = 1;
  string path = 2;
  string text = 3;
  // The version read; "" when the file must not exist yet.
  string version = 4;
}

// Response message for FileService.WriteFile.
message WriteFileResponse {
  string version = 1;
}

// Request message for FileService.WriteBinaryFile.
message WriteBinaryFileRequest {
  string workspace = 1;
  string path = 2;
  bytes data = 3;
  // The version read; "" when the file must not exist yet.
  string version = 4;
}

// Response message for FileService.WriteBinaryFile.
message WriteBinaryFileResponse {
  string version = 1;
}

// Request message for FileService.UploadFile.
message UploadFileRequest {
  string workspace = 1;
  // Where the file goes, relative to the workspace.
  string path = 2;
  // The id the first call returned; "" on the first call.
  string upload_id = 3;
  // The next chunk (at most 16 MiB).
  bytes data = 4;
  // The last chunk: the file is put at path.
  bool done = 5;
  // A file already at path is replaced; otherwise it's an error.
  bool replace = 6;
}

// Response message for FileService.UploadFile.
message UploadFileResponse {
  string upload_id = 1;
  // The file's version, once done.
  string version = 2;
}

// Request message for FileService.CreateFolder.
message CreateFolderRequest {
  string workspace = 1;
  string path = 2;
}

// Response message for FileService.CreateFolder.
message CreateFolderResponse {}

// Request message for FileService.RenameFile.
message RenameFileRequest {
  string workspace = 1;
  string from = 2;
  string to = 3;
}

// Response message for FileService.RenameFile.
message RenameFileResponse {}

// Request message for FileService.DeleteFile.
message DeleteFileRequest {
  string workspace = 1;
  string path = 2;
}

// Response message for FileService.DeleteFile.
message DeleteFileResponse {}

// GitAction is what GitFileAction does.
enum GitAction {
  GIT_ACTION_UNSPECIFIED = 0;
  // git add: the file, or everything changed under the folder.
  GIT_ACTION_STAGE = 1;
  // git restore --staged: out of the index, the working copy kept.
  GIT_ACTION_UNSTAGE = 2;
  // git restore --staged --worktree --source=HEAD: back to the last commit.
  GIT_ACTION_DISCARD = 3;
  // A line for it ("/path", "/folder/") in the workspace's .gitignore.
  GIT_ACTION_IGNORE = 4;
  // That line taken out of the workspace's .gitignore again.
  GIT_ACTION_UNIGNORE = 5;
}

// Request message for FileService.GitFileAction.
message GitFileActionRequest {
  string workspace = 1;
  // Workspace-relative, with "/".
  string path = 2;
  GitAction action = 3;
}

// Response message for FileService.GitFileAction.
message GitFileActionResponse {}

// One commit in a history.
message FileRevision {
  // The full hash, and abbreviated.
  string commit = 1;
  string short = 2;
  string author = 3;
  google.protobuf.Timestamp when = 4;
  // The commit message's first line.
  string subject = 5;
  // A file's path at that commit, from the repository's root; "" in a
  // folder's history.
  string path = 6;
  // Its parents (full hashes), as the history is simplified to the path.
  repeated string parents = 7;
  string email = 8;
  // The lines it added and removed in the file or folder, in how many files.
  int32 added = 9;
  int32 removed = 10;
  int32 files = 11;
}

// Request message for FileService.GetFileHistory.
message GetFileHistoryRequest {
  string workspace = 1;
  // Workspace-relative, with "/": a file, a folder, or "" for the workspace.
  string path = 2;
  // At most this many (0: 100; never more than 500).
  int32 limit = 3;
  // After this many of the newest.
  int32 skip = 4;
}

// Response message for FileService.GetFileHistory.
message GetFileHistoryResponse {
  repeated FileRevision revisions = 1;
  // Older revisions follow.
  bool more = 2;
}

// What a revision is compared with.
enum RevisionDiff {
  // Not said: as REVISION_DIFF_NOW.
  REVISION_DIFF_UNSPECIFIED = 0;
  // The working copy: how it differs from the revision.
  REVISION_DIFF_NOW = 1;
  // Its parent: what the revision changed.
  REVISION_DIFF_PARENT = 2;
  // Another revision (other_commit).
  REVISION_DIFF_OTHER = 3;
}

// Request message for FileService.GetFileRevisionDiff.
message GetFileRevisionDiffRequest {
  string workspace = 1;
  // A file, a folder, or "" for the workspace.
  string path = 2;
  // A commit hash.
  string commit = 3;
  RevisionDiff against = 4;
  // The later revision, for REVISION_DIFF_OTHER.
  string other_commit = 5;
}

// Response message for FileService.GetFileRevisionDiff.
message GetFileRevisionDiffResponse {
  // Unified diff; "" when the same.
  string diff = 1;
  // Cut short at 2 MB, at a line.
  bool truncated = 2;
}

// Request message for FileService.RestoreFileRevision.
message RestoreFileRevisionRequest {
  string workspace = 1;
  // A file, a folder, or "" for the workspace.
  string path = 2;
  string commit = 3;
  // A file's version as the caller last saw it ("" when it doesn't
  // exist).
  string version = 4;
  // For a folder: only say which files it would put back.
  bool preview = 5;
}

// A file a folder's restore puts back.
message RestoredFile {
  // Workspace-relative, with "/".
  string path = 1;
  // It was deleted since, and comes back.
  bool recreated = 2;
}

// Response message for FileService.RestoreFileRevision.
message RestoreFileRevisionResponse {
  // A file's new version.
  string version = 1;
  // A folder's files it put back (or would, with preview).
  repeated RestoredFile files = 2;
}

// Request message for FileService.RenderDocx.
message RenderDocxRequest {
  string workspace = 1;
  // The Markdown file it's from, for its images ("" for none).
  string path = 2;
  string markdown = 3;
  // Its ```mermaid diagrams, drawn by the caller (the service can't run
  // Mermaid); one not here stays as its code.
  repeated DocxDiagram diagrams = 4;
}

// A diagram drawn as a picture, for RenderDocx.
message DocxDiagram {
  // The ```mermaid block's text: its lines, without the fences.
  string source = 1;
  // A PNG of it.
  bytes png = 2;
  // Its size in CSS pixels (the PNG may have more, for sharpness).
  int32 width = 3;
  int32 height = 4;
}

// Response message for FileService.RenderDocx.
message RenderDocxResponse {
  bytes data = 1;
}

// Request message for FileService.FindFiles.
message FindFilesRequest {
  string workspace = 1;
  string query = 2;
  // At most this many (default 50).
  int32 limit = 3;
  // Also the folders the files are in, with a trailing slash (for @
  // mentions).
  bool folders = 4;
}

// Response message for FileService.FindFiles.
message FindFilesResponse {
  repeated string paths = 1;
}

// Request message for FileService.StatFiles.
message StatFilesRequest {
  string workspace = 1;
  repeated string paths = 2;
}

// Response message for FileService.StatFiles.
message StatFilesResponse {
  // Path to version; "" for a file that's gone.
  map<string, string> versions = 1;
}

// Request message for FileService.ReadTable.
message ReadTableRequest {
  string workspace = 1;
  string path = 2;
  // Rows with this in a cell, ignoring case ("": all).
  string search = 3;
  // Each column's filter: a comparison (">5", "<=0", "=north", "!=x"), a
  // range ("10..20"), "empty", "!empty", else text the cell contains.
  repeated ColumnFilter filters = 4;
  // The column to sort by, 1-based; 0: file order.
  int32 sort_column = 5;
  bool descending = 6;
  int32 offset = 7;
  // 0: 100.
  int32 limit = 8;
}

// ColumnFilter is a filter on one column (0-based).
message ColumnFilter {
  int32 column = 1;
  string expr = 2;
}

// TableColumn is a table's column, as its first rows show it.
message TableColumn {
  string name = 1;
  // number, date, text or empty.
  string kind = 2;
  // Empty cells in the rows profiled.
  int32 empty = 3;
  // A number column's range in the rows profiled.
  double min = 4;
  double max = 5;
  // What it holds, as a model described it (search.enrich), if it has.
  string intent = 6;
}

// TableRow is a row of a table, numbered from 1 (the header not counted).
message TableRow {
  int32 number = 1;
  repeated string cells = 2;
}

// Response message for FileService.ReadTable.
message ReadTableResponse {
  repeated TableColumn columns = 1;
  repeated TableRow rows = 2;
  // Rows that matched, and rows in all.
  int32 matched = 3;
  int32 total = 4;
  // False when a sort was asked for but too many rows matched (more than
  // 200,000): the rows are in file order; filter first.
  bool sorted = 5;
  // The file is Latin-1 (Windows-1252), decoded.
  bool latin1 = 6;
}

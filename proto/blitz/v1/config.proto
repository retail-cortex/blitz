}

// Request message for ConfigService.GetOrgSync.
message GetOrgSyncRequest {
  string workspace = 1;
}

// A file with both versions kept: the shared one and this person's copy.
message OrgSyncPair {
  string shared = 1;
  string mine = 2;
}

// Response message for ConfigService.GetOrgSync.
message GetOrgSyncResponse {
  string state = 1;
  repeated OrgSyncPair pairs = 2;
  // Why it's offline or refused, in Git's words ("" otherwise).
  string error = 3;
}

// Request message for ConfigService.TakeServiceRun.
message TakeServiceRunRequest {
  // The organization workspace's folder.
  string workspace = 1;
  string job_id = 2;
  string run_id = 3;
}

// Response message for ConfigService.TakeServiceRun.
message TakeServiceRunResponse {
  ServiceRun run = 1;
}

// Request message for ConfigService.SaveOrgSync.
message SaveOrgSyncRequest {
  string workspace = 1;
}

// Response message for ConfigService.SaveOrgSync: the sync's state after,
// as GetOrgSync says it.
message SaveOrgSyncResponse {
  string state = 1;
  repeated OrgSyncPair pairs = 2;
  // Why it's offline or refused, in Git's words ("" otherwise).
  string error = 3;
}

// A job the organization's service runs.
message ServiceJob {
  string id = 1;
  // Its resource name (urn:blitz:jobs:<id>).
  string urn = 2;
  string name = 3;
  string schedule = 4;
  bool enabled = 5;
  // Its next time, when it has one and is on.
  google.protobuf.Timestamp next_run = 6;
  // Its workspace's handle, and where it's cloned on this computer.
  string workspace = 7;
  string dir = 8;
}

// One of a service job's runs.
message ServiceRun {
  string id = 1;
  // Its resource name (urn:blitz:runs:<id>).
  string urn = 2;
  // schedule, catch_up or now.
  string trigger = 3;
  // queued, running, succeeded, failed, skipped or stopped.
  string status = 4;
  // Why it failed, stopped or was skipped.
  string note = 5;
  // Its last message.
  string output = 6;
  double cost_usd = 7;
  google.protobuf.Timestamp created = 8;
  google.protobuf.Timestamp ended = 9;
  // The branch its changes went to ("" for none).
  string branch = 10;
  // The name of the files it left (urn:blitz:artifacts:…).
  string artifacts = 11;
  // A paused run's request (status paused), and how it was answered
  // (approve or deny, with a note).
  ServiceRequest pending = 12;
  string answer = 13;
  string answer_note = 14;
  // Whether its changes are on main too, and why not when they're on its
  // branch only.
  bool merged = 15;
  string merge_note = 16;
}

// What a paused run asks for: a tool, the kind of thing it does, and what
// exactly.
message ServiceRequest {
  string tool = 1;
  string kind = 2;
  string detail = 3;
}

// Request message for ConfigService.GetServiceJob.
message GetServiceJobRequest {
  // The workspace's folder: an organization workspace's clone.
  string workspace = 1;
  string name = 2;
  // Its WORKER.md's path, to say when it's where the service doesn't look.
  string path = 3;
}

// Response message for ConfigService.GetServiceJob.
message GetServiceJobResponse {
  bool found = 1;
  ServiceJob job = 2;
  // Its latest runs, newest first.
  repeated ServiceRun runs = 3;
  // Why it isn't found: "outside" (its WORKER.md isn't in
  // .agents/workers/<name>/, where the service looks), "not_pushed" (its
  // changes aren't on main: PushServiceJob), "saving" (sync is putting
  // them there; sync_state says how it stands, detail why it failed), "not_service" (on main,
  // but the service doesn't run it: detail says why), or "not_read" (the
  // service hasn't read it yet).
  string reason = 4;
  string detail = 5;
  // The workspace's sync state, for "saving" (GetOrgSync's).
  string sync_state = 6;
}

// Request message for ConfigService.PushServiceJob.
message PushServiceJobRequest {
  // The workspace's folder: an organization workspace's clone.
  string workspace = 1;
  string name = 2;
}

// Response message for ConfigService.PushServiceJob: the job as the
// service has it after reading main.
message PushServiceJobResponse {
  GetServiceJobResponse job = 1;
}

// Request message for ConfigService.RunServiceJob.
message RunServiceJobRequest {
  string job_id = 1;
}

// Response message for ConfigService.RunServiceJob.
message RunServiceJobResponse {
  ServiceRun run = 1;
}

// Request message for ConfigService.SetServiceJobEnabled.
message SetServiceJobEnabledRequest {
  string job_id = 1;
  bool enabled = 2;
}

// Response message for ConfigService.SetServiceJobEnabled.
message SetServiceJobEnabledResponse {}

// One file a service job's run left.
message ServiceRunFile {
  // Its resource name (urn:blitz:artifacts:…/<path>).
  string urn = 1;
  // Its path in the run's files (out/report.csv, events.jsonl).
  string path = 2;
  int64 size = 3;
  string media_type = 4;
}

// Request message for ConfigService.ListServiceRunFiles.
message ListServiceRunFilesRequest {
  // The run's files' name (ServiceRun.artifacts).
  string artifacts = 1;
}

// Response message for ConfigService.ListServiceRunFiles.
message ListServiceRunFilesResponse {
  repeated ServiceRunFile files = 1;
}

// Request message for ConfigService.SaveServiceRunFile.
message SaveServiceRunFileRequest {
  // The file's name (ServiceRunFile.urn).
  string urn = 1;
}

// Response message for ConfigService.SaveServiceRunFile.
message SaveServiceRunFileResponse {
  // Where it was saved.
  string path = 1;
}

// A run going now on the organization's service.
message GoingServiceRun {
  ServiceRun run = 1;
  string job_id = 2;
  string job_name = 3;
  // Its workspace's handle, and where it's cloned on this computer.
  string workspace = 4;
  string dir = 5;
}

// One run's change: queued, started, ended, or its branch pushed.
message ServiceRunChange {
  string run_id = 1;
  string job_id = 2;
  // Its workspace's handle, and where it's cloned on this computer.
  string workspace = 3;
  string dir = 4;
  string status = 5;
}

// Request message for ConfigService.WatchServiceRuns.
message WatchServiceRunsRequest {}

// Response message for ConfigService.WatchServiceRuns.
message WatchServiceRunsResponse {
  // Every run going now.
  repeated GoingServiceRun runs = 1;
  // The change that sent it (none in the first).
  ServiceRunChange change = 2;
  // Always true: the page server's keepalives are empty messages.
  bool listed = 3;
}

// Request message for ConfigService.ShareWithOrganization.
message ShareWithOrganizationRequest {
  // The folder.
  string workspace = 1;
  // The workspace's name ("" for the folder's).
  string name = 2;
  // Its handle ("" to make one from the name).
  string handle = 3;
  bool personal = 4;
}

// Response message for ConfigService.ShareWithOrganization.
message ShareWithOrganizationResponse {
  OrgWorkspace workspace = 1;
  // What the person should know: changes saved first, large files.
  repeated string notes = 2;
}

// Request message for ConfigService.ListServiceApprovals.
message ListServiceApprovalsRequest {}

// Response message for ConfigService.ListServiceApprovals.
message ListServiceApprovalsResponse {
  repeated GoingServiceRun runs = 1;
}

// Request message for ConfigService.AnswerServiceRun.
message AnswerServiceRunRequest {
  string run_id = 1;
  bool approve = 2;
  string note = 3;
}

// Response message for ConfigService.AnswerServiceRun.
message AnswerServiceRunResponse {
  ServiceRun run = 1;
}

// Request message for ConfigService.ListServiceJobs.
message ListServiceJobsRequest {}

// Response message for ConfigService.ListServiceJobs.
message ListServiceJobsResponse {
  repeated ServiceJob jobs = 1;
}

// What was used of one of the organization's models (or of every model,
// for a limit on them all).
message OrgUsed {
  // The model's ID ("" for every model together).
  string model = 1;
  int64 requests = 2;
  int64 input_tokens = 3;
  int64 cached_input_tokens = 4;
  int64 output_tokens = 5;
  double cost_usd = 6;
}

// A budget (dollars) or quota (tokens) that applies to the person.
message OrgLimit {
  // person, group or org: whose it is.
  string scope_kind = 1;
  // day or month.
  string period = 2;
  // usd or tokens.
  string unit = 3;
  // The model it limits ("" for every model together).
  string model = 4;
  double amount_usd = 5;
  int64 tokens = 6;
  int64 input_tokens = 7;
  int64 output_tokens = 8;
  OrgUsed used = 9;
  google.protobuf.Timestamp resets = 10;
}

// A model's requests and tokens a minute: everyone's, and each person's.
message OrgRateLimit {
  string model = 1;
  int32 person_rpm = 2;
  int32 person_tpm = 3;
  int32 rpm = 4;
  int32 tpm = 5;
}

// Request message for ConfigService.GetOrgUsage.
message GetOrgUsageRequest {}

// Response message for ConfigService.GetOrgUsage.
message GetOrgUsageResponse {
  repeated OrgUsed today = 1;
  repeated OrgUsed month = 2;
  repeated OrgLimit limits = 3;
  repeated OrgRateLimit rate_limits = 4;
  // Whether the organization's full prompt logs keep any of the person's
  // requests.
  bool prompt_logs = 5;
}

// An item in a workspace that can be published to the catalog.
message PublishableItem {
  // agent, skill, rule, guardrail, command or connector.
  string kind = 1;
  string name = 2;
  // Its path in the catalog (and in the workspace's .agents folder).
  string path = 3;
  // What the catalog would refuse ("" none).
  repeated string problems = 4;
  // How it applies now: locked or default, and its groups.
  string lock = 5;
  repeated string groups = 6;
}

// Request message for ConfigService.ListPublishable.
message ListPublishableRequest {
  string workspace = 1;
}

// Response message for ConfigService.ListPublishable.
message ListPublishableResponse {
  repeated PublishableItem items = 1;
}

// An item to publish, and how it's to apply.
message PublishItem {
  string kind = 1;
  string name = 2;
  // locked or default ("" is default).
  string lock = 3;
  // Who it's for; everyone when none.
  repeated string groups = 4;
}

// A change to the catalog, waiting for an Admin (its author too) or answered.
message CatalogReview {
  string id = 1;
  string title = 2;
  string by_email = 3;
  repeated string paths = 4;
  repeated string problems = 5;
  // open, approved or rejected.
  string state = 6;
  string note = 7;
  // The version it went out in, once approved (0 before).
  int32 version = 8;
  google.protobuf.Timestamp created = 9;
}

// Request message for ConfigService.PublishToOrganization.
message PublishToOrganizationRequest {
  string workspace = 1;
  repeated PublishItem items = 2;
  string title = 3;
}

// Response message for ConfigService.PublishToOrganization.
message PublishToOrganizationResponse {
  CatalogReview review = 1;
}

// Request message for ConfigService.ListCatalogReviews.
message ListCatalogReviewsRequest {
  // open, approved, rejected, or "" for all.
  string state = 1;
}

// Response message for ConfigService.ListCatalogReviews.
message ListCatalogReviewsResponse {
  repeated CatalogReview reviews = 1;
}

// One of the organization's catalog items.
message OrgItem {
  // agent, skill, rule, guardrail, command, mcp or connector.
  string kind = 1;
  string name = 2;
  // Its path in the catalog.
  string path = 3;
  // locked or default.
  string lock = 4;
  repeated string groups = 5;
  // The workspace has its own of this name (a default gives way to it).
  bool overridden = 6;
}

// Request message for ConfigService.ListOrgItems.
message ListOrgItemsRequest {
  string workspace = 1;
  // One kind ("" for every one).
  string kind = 2;
}

// Response message for ConfigService.ListOrgItems.
message ListOrgItemsResponse {
  repeated OrgItem items = 1;
  // The catalog's version ("" before the first).
  int32 version = 2;
}

// Request message for ConfigService.CopyOrgItem.
message CopyOrgItemRequest {
  string workspace = 1;
  string kind = 2;
  string name = 3;
}

// Response message for ConfigService.CopyOrgItem.
message CopyOrgItemResponse {
  // The files written, in the workspace.
  repeated string paths = 1;
}

// How the person hears of their jobs' runs on the organization's service.
message OrgNotices {
  // By email (when the service sends email: email_available).
  bool email = 1;
  // An https address the notices are POSTed to ("": none).
  string webhook = 2;
  // Every run's end, not only failures and runs waiting for an answer.
  bool every_run = 3;
  bool email_available = 4;
}

// Request message for ConfigService.GetOrgNotices.
message GetOrgNoticesRequest {}

// Response message for ConfigService.GetOrgNotices.
message GetOrgNoticesResponse {
  OrgNotices notices = 1;
}

// Request message for ConfigService.SetOrgNotices.
message SetOrgNoticesRequest {
  OrgNotices notices = 1;
}

// Response message for ConfigService.SetOrgNotices.
message SetOrgNoticesResponse {
  OrgNotices notices = 1;
}

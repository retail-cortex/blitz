// MCPServerConfig is an MCP server's settings ([[mcp.servers]]): exactly
// one of command (stdio) and url (streamable HTTP).
message MCPServerConfig {
  string name = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string url = 5;
  map<string, string> headers = 6;
  // Configured, but never started.
  bool disabled = 7;
  // Only these of its tools; empty for all.
  repeated string tools = 8;
  // Its tools run without asking.
  bool auto_approve = 9;
  // A stdio server runs in the OS sandbox unless this is false.
  optional bool sandbox = 10;
  // Names its tools prefix__tool.
  string prefix = 11;
  // The agents offered its tools; empty for the main agent, * for all.
  repeated string agents = 12;
  // Bounds one tool call; 0 for the default (300).
  int32 timeout_seconds = 13;
  // In a listing: where it's configured (global, workspace or project).
  string scope = 14;
  // In a workspace's listing: a global server turned off in that
  // workspace alone (disabled is its own file's setting).
  bool off_here = 15;
}


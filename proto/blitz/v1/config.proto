  string name = 1;
  string url = 2;
  // Its token is in the keychain.
  bool has_token = 3;
}

// A skill a registry offers.
message RegistrySkill {
  string registry = 1;
  string name = 2;
  string description = 3;
  string version = 4;
  // Its id in the Castor registry, when it has one.
  string castor_id = 5;
}

// A skill installed from a registry.
message InstalledSkill {
  string name = 1;
  string registry = 2;
  string version = 3;
  // Its folder.
  string dir = 4;
  google.protobuf.Timestamp installed = 5;
  // Its scripts, when it has some that weren't reviewed with this content
  // (a new install, an update): what to show before TrustSkillScripts.
  SkillReview review = 6;
}

// What a skill's scripts are, for the user to review before trusting
// them (spec_013_skills SK-108).
message SkillReview {
  // The skill's folder and content hash, for TrustSkillScripts.
  string dir = 1;
  string hash = 2;
  repeated ReviewScript scripts = 3;
}

// One script under review.
message ReviewScript {
  string name = 1;
  string language = 2;
  // Its path in the skill, or "inline".
  string source = 3;
  // The packages it installs.
  repeated string deps = 4;
}


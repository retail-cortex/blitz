syntax = "proto3";

package blitz.v1;

import "blitz/v1/workspace.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/retail-cortex/blitz/proto/blitz/v1;blitzv1";

// ConfigService reads and changes the settings: the global file
// (~/.blitz/.env.toml) and each workspace's own (kept under ~/.blitz, never
// in the workspace). API keys are kept in the OS keychain; the files refer
// to them. After a change, open workspaces reload their provider settings
// and rebuild their model; other settings apply when a workspace next opens.
// Every request names its scope: workspace is an absolute directory, or ""
// for the global settings.
service ConfigService {
  // The browser profiles (spec_049_browser_profiles): each with the sites
  // the agents browse with it without asking, and the one the workspace
  // named browses with (none: a throwaway profile each time).
  rpc ListBrowserProfiles(ListBrowserProfilesRequest) returns (ListBrowserProfilesResponse);
  // Makes an empty profile (lowercase letters, digits, - and _).
  rpc CreateBrowserProfile(CreateBrowserProfileRequest) returns (CreateBrowserProfileResponse);
  // Removes a profile, its sign-ins, and the workspaces' choice of it.
  rpc DeleteBrowserProfile(DeleteBrowserProfileRequest) returns (DeleteBrowserProfileResponse);
  // Signs a profile out of everything (its data removed, the profile kept).
  rpc ClearBrowserProfile(ClearBrowserProfileRequest) returns (ClearBrowserProfileResponse);
  // The sites a profile browses without asking.
  rpc SetBrowserProfileDomains(SetBrowserProfileDomainsRequest) returns (SetBrowserProfileDomainsResponse);
  // Which profile a workspace browses with ("": none).
  rpc SetWorkspaceBrowserProfile(SetWorkspaceBrowserProfileRequest) returns (SetWorkspaceBrowserProfileResponse);
  // Opens the system's Chrome (Chromium, Edge, Brave) on the profile, on
  // the service's machine, to sign in by hand for the browsing done
  // without the desktop app (jobs, the CLI). NO_BROWSER without one.
  rpc OpenBrowserProfile(OpenBrowserProfileRequest) returns (OpenBrowserProfileResponse);
  // What a scope sets: providers and where their keys come from (never the
  // keys themselves).
  rpc DescribeConfig(DescribeConfigRequest) returns (DescribeConfigResponse);
  // The models each configured provider offers, from its API (kept for a
  // few minutes), so forms can suggest and check model names.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  // Tries an API key before it's saved: lists the provider's models with
  // it, so a form can say the key works (or why not) as it's pasted.
  // Nothing is written and the key isn't kept.
  rpc CheckApiKey(CheckApiKeyRequest) returns (CheckApiKeyResponse);
  // Returns the providers' sign-ins (one provider's, or all four:
  // google, anthropic, aws, azure): whether the vendor's tool is installed
  // and whether its credentials work now. Signing in adds to API keys.
  rpc GetSignIn(GetSignInRequest) returns (GetSignInResponse);
  // Runs a provider's sign-in with its vendor's tool (gcloud, ant, aws,
  // az) on the service's machine, streaming what the tool prints (the
  // sign-in page's URL, a device code), then retries the open workspaces'
  // models (NO_TOOL, SIGN_IN_RUNNING, SIGN_IN_FAILED, UNKNOWN_PROVIDER,
  // INVALID_PROFILE).
  rpc SignIn(SignInRequest) returns (stream SignInResponse);
  // Signs out of a provider with its vendor's tool.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  // Stores a provider's API key in the keychain and refers to it.
  rpc SetApiKey(SetApiKeyRequest) returns (SetApiKeyResponse);
  // Moves a provider's API key written in the scope's file (as plain text
  // or obfuscated) into the keychain.
  rpc SecureApiKey(SecureApiKeyRequest) returns (SecureApiKeyResponse);
  // Removes a provider's API key (a workspace then uses the global one).
  rpc RemoveApiKey(RemoveApiKeyRequest) returns (RemoveApiKeyResponse);
  // Saves a scope's provider, default model and, optionally, the
  // provider's API key as one change: all checked before anything is
  // written, and the open workspaces reload once.
  rpc SetProvider(SetProviderRequest) returns (SetProviderResponse);
  // Sets one of the forms' settings ("" removes it).
  rpc SetConfigValue(SetConfigValueRequest) returns (SetConfigValueResponse);
  // A scope's permission rules: its own file's, the global ones a
  // workspace adds to, and the built-in read-only rules.
  rpc DescribePermissions(DescribePermissionsRequest) returns (DescribePermissionsResponse);
  // Adds an allow, ask or deny rule to a scope's file, if it's valid.
  rpc AddPermission(AddPermissionRequest) returns (AddPermissionResponse);
  // Removes a rule from a scope's file (any effect).
  rpc RemovePermission(RemovePermissionRequest) returns (RemovePermissionResponse);
  // Checks a rule without saving it: its canonical form and how it
  // matches, or why it's invalid; with a sample, whether it applies to it.
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  // Turns the built-in read-only rules on or off in a scope, or leaves a
  // workspace to the global setting.
  rpc SetReadOnlyDefaults(SetReadOnlyDefaultsRequest) returns (SetReadOnlyDefaultsResponse);
  // Returns a scope's settings file as text.
  rpc GetConfigFile(GetConfigFileRequest) returns (GetConfigFileResponse);
  // Replaces a scope's settings file, if it's valid.
  rpc SaveConfigFile(SaveConfigFileRequest) returns (SaveConfigFileResponse);
  // Checks a settings file's text without saving it: TOML errors, values
  // of the wrong type and invalid permission rules, which stop it being
  // saved; unknown settings and API keys written as plain text, which
  // don't. Each at its line.
  rpc CheckConfigFile(CheckConfigFileRequest) returns (CheckConfigFileResponse);
  // Every setting a settings file can have, with its type, default and
  // description (from the settings' doc comments).
  rpc GetSettingsReference(GetSettingsReferenceRequest) returns (GetSettingsReferenceResponse);
  // The interface language the user's settings name ([ui] locale; empty
  // when they don't), and their own catalogs ([ui] locales_dir): the
  // desktop app's System language follows them.
  rpc GetInterfaceLanguage(GetInterfaceLanguageRequest) returns (GetInterfaceLanguageResponse);
  // The skill registries the user added, and the skills installed from
  // them (spec_013_skills SK-90..SK-96).
  rpc ListSkillRegistries(ListSkillRegistriesRequest) returns (ListSkillRegistriesResponse);
  // Checks a registry's index and remembers it, its token in the keychain
  // (REGISTRY_FAILED when the index can't be read).
  rpc AddSkillRegistry(AddSkillRegistryRequest) returns (AddSkillRegistryResponse);
  // Forgets a registry and its token; its skills stay (NO_REGISTRY).
  rpc RemoveSkillRegistry(RemoveSkillRegistryRequest) returns (RemoveSkillRegistryResponse);
  // The registries' skills that match a query, and why any registry
  // couldn't be read.
  rpc SearchRegistrySkills(SearchRegistrySkillsRequest) returns (SearchRegistrySkillsResponse);
  // Installs a skill for the user or in a workspace, its archive checked
  // against the hash the registry gives (NOT_OFFERED, AMBIGUOUS,
  // HASH_MISMATCH, SKILL_EXISTS, REGISTRY_FAILED). Open sessions see it
  // at once.
  rpc InstallRegistrySkill(InstallRegistrySkillRequest) returns (InstallRegistrySkillResponse);
  // Updates installed skills whose registry offers another archive.
  rpc UpdateRegistrySkills(UpdateRegistrySkillsRequest) returns (UpdateRegistrySkillsResponse);
  // Removes a skill installed from a registry (NOT_INSTALLED).
  rpc UninstallRegistrySkill(UninstallRegistrySkillRequest) returns (UninstallRegistrySkillResponse);
  // Returns the names of the user's secrets in a scope (global, or a
  // workspace's own), never their values.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // Stores a secret's value in the system's keychain.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  // Removes a secret.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // Returns the skills Blitz ships with.
  rpc ListBuiltinSkills(ListBuiltinSkillsRequest) returns (ListBuiltinSkillsResponse);
  // Records that the user reviewed and trusted the scripts of the skill
  // in a folder, with the content hash they were shown (HASH_MISMATCH if
  // it changed since): its scripts then run without asking first, until
  // its content changes (spec_013_skills SK-108).
  rpc TrustSkillScripts(TrustSkillScriptsRequest) returns (TrustSkillScriptsResponse);
  // Returns what a skill's scripts are, for review, when they need it
  // (nothing when they don't).
  rpc GetSkillReview(GetSkillReviewRequest) returns (GetSkillReviewResponse);
  // Returns the MCP servers of the global settings, with the file they're
  // in; with a workspace, every server it runs, each with its scope (the
  // global ones, its own, its trusted project's).
  rpc ListMCPServerConfigs(ListMCPServerConfigsRequest) returns (ListMCPServerConfigsResponse);
  // Adds an MCP server to the global settings, or to a workspace's own,
  // or replaces one (name) there: open workspaces apply it at once.
  rpc SaveMCPServer(SaveMCPServerRequest) returns (SaveMCPServerResponse);
  // Removes an MCP server from the global settings, or a workspace's own
  // (NOT_FOUND: a workspace never removes a global one).
  rpc RemoveMCPServer(RemoveMCPServerRequest) returns (RemoveMCPServerResponse);
  // Turns an MCP server on or off: in its scope's file, or, for a global
  // one asked about with a workspace, in that workspace alone (NOT_FOUND).
  rpc SetMCPServerEnabled(SetMCPServerEnabledRequest) returns (SetMCPServerEnabledResponse);
  // Moves a workspace's own MCP server to the global settings, for every
  // workspace (NOT_FOUND; ALREADY_EXISTS when a global one has its name).
  rpc MakeMCPServerGlobal(MakeMCPServerGlobalRequest) returns (MakeMCPServerGlobalResponse);

  // Returns the global connectors (spec_047_connectors CON-18): the
  // categories and kinds of the built-in and global descriptors, and the
  // global connections. A workspace's Studio lists them but never
  // changes them.
  rpc ListGlobalConnectors(ListGlobalConnectorsRequest) returns (ListGlobalConnectorsResponse);
  // Writes a global connection, keeping the secret values given as
  // global secrets; problems, with nothing written, when it can't be
  // saved. Open workspaces serve it again (CONNECTOR_NOT_FOUND for a
  // previous name that isn't there).
  rpc SaveGlobalConnector(SaveGlobalConnectorRequest) returns (SaveGlobalConnectorResponse);
  // Deletes a global connection and its secrets (CONNECTOR_NOT_FOUND).
  rpc DeleteGlobalConnector(DeleteGlobalConnectorRequest) returns (DeleteGlobalConnectorResponse);
  // Connects to a global connection as written, unsaved, and lists its
  // tools.
  rpc TestGlobalConnector(TestGlobalConnectorRequest) returns (TestGlobalConnectorResponse);
  // Runs one of a global connection's tools as written, unsaved.
  rpc TryGlobalConnectorTool(TryGlobalConnectorToolRequest) returns (TryGlobalConnectorToolResponse);
  // Reads a global connection's tables and their columns, as written.
  rpc ReadGlobalConnectorSchema(ReadGlobalConnectorSchemaRequest) returns (ReadGlobalConnectorSchemaResponse);
  // Drafts one of a global connection's queries from what the user is
  // looking for, with the built-in sql-query skill. Nothing is saved.
  rpc DraftGlobalConnectorQuery(DraftGlobalConnectorQueryRequest) returns (DraftGlobalConnectorQueryResponse);

  // The organization's service this computer connects to, and who is
  // signed in to it (spec_053_enterprise EN-10 to EN-14); with check, it
  // asks the service too, to say whether it's reached.
  rpc GetEnterprise(GetEnterpriseRequest) returns (GetEnterpriseResponse);
  // Connects to the organization's service at an address, after checking
  // it's one, or disconnects with "", signing out first (INVALID_ADDRESS,
  // UNREACHABLE).
  rpc ConnectEnterprise(ConnectEnterpriseRequest) returns (ConnectEnterpriseResponse);
  // Signs in to the organization's service with its identity provider:
  // through a browser on this computer, or with a code entered in one
  // anywhere (device). Streams the address to open, and the code, then
  // the state once signed in (NOT_CONNECTED, SIGN_IN_FAILED).
  rpc EnterpriseSignIn(EnterpriseSignInRequest) returns (stream EnterpriseSignInResponse);
  // Signs out of the organization's service, here and there.
  rpc EnterpriseSignOut(EnterpriseSignOutRequest) returns (EnterpriseSignOutResponse);
  // How the organization's Blitz looks (spec_053_enterprise EN-50 to
  // EN-54): the copy kept on this computer, checked against the service's
  // signature, or with refresh asked of the service first (no sign-in
  // needed). Empty when there's none: Blitz's own look.
  rpc GetBranding(GetBrandingRequest) returns (GetBrandingResponse);
  // The organization's terms in force and whether they're accepted
  // (EN-53; NOT_CONNECTED).
  rpc GetTerms(GetTermsRequest) returns (GetTermsResponse);
  // Records that the person accepted a version of the terms (CONFLICT when
  // it isn't the one in force).
  rpc AcceptTerms(AcceptTermsRequest) returns (AcceptTermsResponse);
  // The organization's workspaces the person has a role in, and where each
  // is cloned on this computer (EN-60; NOT_CONNECTED, NOT_SIGNED_IN).
  rpc ListOrgWorkspaces(ListOrgWorkspacesRequest) returns (ListOrgWorkspacesResponse);
  // Makes a workspace of the organization's, the person its owner.
  rpc CreateOrgWorkspace(CreateOrgWorkspaceRequest) returns (CreateOrgWorkspaceResponse);
  // Clones an organization workspace through its service the first time
  // (with Blitz's credential helper in the clone's own Git settings), and
  // answers its folder to open (CLONE_FAILED).
  rpc OpenOrgWorkspace(OpenOrgWorkspaceRequest) returns (OpenOrgWorkspaceResponse);
  // Git's credential for a host (EN-61): the access token, renewed when
  // due, for the organization's service; nothing for another host or when
  // signed out.
  rpc GitCredential(GitCredentialRequest) returns (GitCredentialResponse);
  // An organization workspace's sync on this computer (EN-64): its state
  // (saved, saving, offline, signed_out, conflicts, refused; "" when it
  // isn't one kept in step), why it failed, and the files with both
  // versions kept.
  rpc GetOrgSync(GetOrgSyncRequest) returns (GetOrgSyncResponse);
  // Saves an organization workspace's changes and sends what waits at
  // once (EN-64): Save now, rather than after the quiet spell or the next
  // minute's try; the sync's state after (NOT_SYNCED when no sync keeps it
  // in step, GIT_BUSY while a turn runs in it).
  rpc SaveOrgSync(SaveOrgSyncRequest) returns (SaveOrgSyncResponse);
  // Adds a service run's changes, on its own branch, to its workspace's
  // main (blitz-enterprise JB-10), then brings main into the folder at
  // workspace: Add to my workspace. CONFLICTS when they change the same
  // lines as main; NO_CHANGES for a run that left none.
  rpc TakeServiceRun(TakeServiceRunRequest) returns (TakeServiceRunResponse);
  // A job in an organization workspace as the organization's service runs
  // it (EN-42; NOT_CONNECTED, NOT_SIGNED_IN, NOT_ORG_WORKSPACE): found is
  // false until the service has read it from main.
  rpc GetServiceJob(GetServiceJobRequest) returns (GetServiceJobResponse);
  // Commits a job's folder and pushes the workspace to its main on the
  // service, then has the service read it (for a workspace not kept in
  // step; PUSH_FAILED with Git's reason, NOT_ORG_WORKSPACE).
  rpc PushServiceJob(PushServiceJobRequest) returns (PushServiceJobResponse);
  // Starts a run of a service job now (a Runner of its workspace).
  rpc RunServiceJob(RunServiceJobRequest) returns (RunServiceJobResponse);
  // Switches a service job on or off (an Editor of its workspace).
  rpc SetServiceJobEnabled(SetServiceJobEnabledRequest) returns (SetServiceJobEnabledResponse);
  // The files a service job's run left (spec_055_urns): its out/ folder's
  // and its log.
  rpc ListServiceRunFiles(ListServiceRunFilesRequest) returns (ListServiceRunFilesResponse);
  // Saves one of a run's files in the Downloads folder, answering where.
  rpc SaveServiceRunFile(SaveServiceRunFileRequest) returns (SaveServiceRunFileResponse);
  // The runs going now on the organization's service in the person's
  // workspaces, first as they are, then again with each run's change as it
  // comes (EN-42: the Processes view, and Studio's service jobs).
  rpc WatchServiceRuns(WatchServiceRunsRequest) returns (stream WatchServiceRunsResponse);
  // Shares a folder on this computer with the organization where it is
  // (EN-66): makes the workspace (a team's, or the person's own), checks
  // that the folder and its history hold no secrets (FAILED_PRECONDITION
  // SECRETS_FOUND, naming them), pushes it, and keeps it in step there.
  // ALREADY_SHARED for a folder that's the organization's already.
  rpc ShareWithOrganization(ShareWithOrganizationRequest) returns (ShareWithOrganizationResponse);
  // The service's runs paused for the person's answer (EN-43): of jobs
  // they own, or in workspaces they're an Owner of.
  rpc ListServiceApprovals(ListServiceApprovalsRequest) returns (ListServiceApprovalsResponse);
  // Every job the organization's service runs in the person's workspaces
  // (EN-42), with each one's workspace; the runs of one with
  // GetServiceJob.
  rpc ListServiceJobs(ListServiceJobsRequest) returns (ListServiceJobsResponse);
  // The person's own use of the organization's models (EN-24): today's and
  // this month's by model, each budget and quota that applies with what's
  // left, the rate limits, and whether full prompt logs keep their
  // requests.
  rpc GetOrgUsage(GetOrgUsageRequest) returns (GetOrgUsageResponse);
  // How the person hears of their jobs' runs on the organization's
  // service (the enterprise spec's JB-31).
  rpc GetOrgNotices(GetOrgNoticesRequest) returns (GetOrgNoticesResponse);
  // Keeps how the person hears of their jobs' runs (JB-31).
  rpc SetOrgNotices(SetOrgNoticesRequest) returns (SetOrgNoticesResponse);
  // The workspace's items that can be published to the organization's
  // catalog (EN-36): its .agents folder's agents, skills, rules,
  // guardrails, commands and connectors, each with how it applies now and
  // what the catalog would refuse.
  rpc ListPublishable(ListPublishableRequest) returns (ListPublishableResponse);
  // Publishes items to the organization's catalog as a review another
  // Admin approves (EN-36; an Admin's; FAILED_PRECONDITION PROBLEMS when
  // the catalog would refuse one).
  rpc PublishToOrganization(PublishToOrganizationRequest) returns (PublishToOrganizationResponse);
  // The catalog's reviews, the newest first (an Admin's).
  rpc ListCatalogReviews(ListCatalogReviewsRequest) returns (ListCatalogReviewsResponse);
  // The organization's catalog items this person gets (EN-34): each with
  // its lock and groups, and whether the workspace has its own of that
  // name (which a default gives way to).
  rpc ListOrgItems(ListOrgItemsRequest) returns (ListOrgItemsResponse);
  // Copies one of the organization's default items into the workspace's
  // .agents folder, to change there (EN-34; FAILED_PRECONDITION LOCKED for
  // a locked one, ALREADY_EXISTS when the workspace has its own).
  rpc CopyOrgItem(CopyOrgItemRequest) returns (CopyOrgItemResponse);
  // Approves or denies what a paused run asks for, with a note; the run
  // goes on (FAILED_PRECONDITION ANSWERED when it isn't waiting any more).
  rpc AnswerServiceRun(AnswerServiceRunRequest) returns (AnswerServiceRunResponse);
}

// Request message for ConfigService.GetInterfaceLanguage.
message GetInterfaceLanguageRequest {}

// Response message for ConfigService.GetInterfaceLanguage.
message GetInterfaceLanguageResponse {
  // A language tag, or empty when the settings don't set one.
  string locale = 1;
  // The user's catalogs, each a catalog file's JSON (checked, as the
  // terminal loads them).
  repeated string catalogs = 2;
}

// KeySource says where a provider's API key comes from.
enum KeySource {
  KEY_SOURCE_UNSPECIFIED = 0;
  KEY_SOURCE_NONE = 1;
  // The OS keychain (the file holds a reference).
  KEY_SOURCE_KEYCHAIN = 2;
  // Written in the file as plain text.
  KEY_SOURCE_PLAIN = 3;
  // modenv's xor: value: obfuscated, not encrypted.
  KEY_SOURCE_OBFUSCATED = 4;
  // An environment variable of the service.
  KEY_SOURCE_ENVIRONMENT = 5;
  // A workspace using the global key.
  KEY_SOURCE_INHERITED = 6;
}

// One provider's settings in a scope, and where its API key comes from
// (never the key).
message ProviderConfig {
  // gemini, anthropic or openai.
  string name = 1;
  KeySource key_source = 2;
  // The file refers to a keychain secret that isn't there.
  bool key_missing = 3;
  // As set in this scope ("" when not).
  string base_url = 4;
  string model = 5;
  // How it signs in, as set in this scope: "" (an API key, or a workspace
  // following the global setting), adc (Gemini) or oauth (Anthropic).
  string auth = 6;
  // adc: the Google Cloud project and location ("" when not set here).
  string project_id = 7;
  string location = 8;
  // oauth: the `ant auth login` profile ("" for ant's active one).
  string profile = 9;
}

// How a provider signs in.
message ProviderAuth {
  // api_key ("" too), adc (Gemini through Vertex AI with Application
  // Default Credentials) or oauth (Anthropic, an `ant auth login` profile).
  string method = 1;
  // adc: the Google Cloud project and location ("" uses the service's
  // GOOGLE_CLOUD_PROJECT and GOOGLE_CLOUD_LOCATION, or "global").
  string project_id = 2;
  string location = 3;
  // oauth: the profile ("" uses ant's active one).
  string profile = 4;
}

// One of the api provider's headers.
message ApiHeader {
  // The header's name, as sent.
  string name = 1;
  // DescribeConfig gives a value only when it is exactly {{TOKEN_SCRIPT}}:
  // others stay in the settings file, since a header can hold a credential.
  // In SetProvider, "" keeps the value the scope's file has.
  string value = 2;
  // DescribeConfig: whether the header has a value in the file.
  bool has_value = 3;
}

// The api provider's settings: a gateway that speaks OpenAI's Responses
// API, signed with these headers (spec_015_models §3.4).
message ApiProviderSettings {
  // Requests go to <base_url>/responses.
  string base_url = 1;
  repeated ApiHeader headers = 2;
  // Prints the token {{TOKEN_SCRIPT}} stands for in a header or base_url.
  string token_script = 3;
  // shell ("" too), python or typescript.
  string token_script_language = 4;
}

// Request message for ConfigService.DescribeConfig.
message DescribeConfigRequest {
  string workspace = 1;
}

// Response message for ConfigService.DescribeConfig.
message DescribeConfigResponse {
  // The scope's settings file (it may not exist yet).
  string path = 1;
  // llm.provider and blitz.default_model as set in this scope.
  string provider = 2;
  string default_model = 3;
  repeated ProviderConfig providers = 4;
  // Where keys are kept ("macOS Keychain", "Secret Service", a file).
  string secret_store = 5;
  // The api provider's settings as this scope sets them, header values
  // withheld (ApiHeader.value).
  ApiProviderSettings api = 6;
  // Each provider's own model (llm.<provider>.model; Claude on Vertex AI
  // is anthropic's) as this scope sets it, by provider: what the form shows
  // for a provider, and what Use keeps.
  map<string, string> models = 7;
}

// After a change: the file written, and why the scope's workspace (for a
// workspace scope, if it's open) still can't build its model ("" if it can).
message ConfigChange {
  string path = 1;
  string model_error = 2;
}

// Request message for ConfigService.SetApiKey.
message SetApiKeyRequest {
  string workspace = 1;
  string provider = 2;
  string key = 3;
}

// Response message for ConfigService.SetApiKey.
message SetApiKeyResponse {
  ConfigChange change = 1;
}

// Request message for ConfigService.SecureApiKey.
message SecureApiKeyRequest {
  string workspace = 1;
  string provider = 2;
}

// Response message for ConfigService.SecureApiKey.
message SecureApiKeyResponse {
  ConfigChange change = 1;
}

// Request message for ConfigService.RemoveApiKey.
message RemoveApiKeyRequest {
  string workspace = 1;
  string provider = 2;
}

// Response message for ConfigService.RemoveApiKey.
message RemoveApiKeyResponse {
  ConfigChange change = 1;
}

// Request message for ConfigService.SetConfigValue.
message SetConfigValueRequest {
  string workspace = 1;
  // llm.provider, blitz.default_model, llm.<provider>.model or .base_url,
  // llm.gemini.project_id or .location.
  string key = 2;
  string value = 3;
}

// Response message for ConfigService.SetConfigValue.
message SetConfigValueResponse {
  ConfigChange change = 1;
}

// Request message for ConfigService.SetProvider.
message SetProviderRequest {
  string workspace = 1;
  // llm.provider: gemini, anthropic, openai, ollama, bedrock, azure,
  // vertex-anthropic or api ("" removes it).
  string provider = 2;
  // blitz.default_model ("" removes it).
  string default_model = 3;
  // A new API key for the provider, kept in the keychain ("" keeps the
  // current one).
  string key = 4;
  // How the provider signs in (unset leaves it as it is).
  ProviderAuth auth = 5;
  // The api provider's settings, with provider api only (unset leaves them
  // as they are); its headers become the ones given.
  ApiProviderSettings api = 6;
}

// Response message for ConfigService.SetProvider.
message SetProviderResponse {
  ConfigChange change = 1;
}

// Request message for ConfigService.GetConfigFile.
message GetConfigFileRequest {
  string workspace = 1;
}

// Response message for ConfigService.GetConfigFile.
message GetConfigFileResponse {
  string path = 1;
  // "" when the file doesn't exist yet.
  string text = 2;
}

// Request message for ConfigService.SaveConfigFile.
message SaveConfigFileRequest {
  string workspace = 1;
  string text = 2;
}

// Response message for ConfigService.SaveConfigFile.
message SaveConfigFileResponse {
  ConfigChange change = 1;
  // Unknown settings (likely typos) and keys written as plain text.
  repeated string warnings = 2;
}

// Request message for ConfigService.CheckConfigFile.
message CheckConfigFileRequest {
  // The settings file's text.
  string text = 1;
}

// Something wrong with a settings file.
message ConfigProblem {
  // The line (from 1), or 0 for the file as a whole.
  int32 line = 1;
  // The column (from 1), when known.
  int32 column = 2;
  // An error stops the file being saved; a warning doesn't.
  bool error = 3;
  string message = 4;
}

// Response message for ConfigService.CheckConfigFile.
message CheckConfigFileResponse {
  // By line, errors first on a line; none when the file is fine.
  repeated ConfigProblem problems = 1;
}

// Request message for ConfigService.GetSettingsReference.
message GetSettingsReferenceRequest {}

// One entry of the settings reference.
message SettingInfo {
  // The table ("llm") or setting ("llm.provider"). <name> stands for any
  // name ("model_settings.<model>.temperature"); [] marks an array of
  // tables ("hooks.pre_tool[].command").
  string key = 1;
  // table, array of tables, string, integer, number, boolean or list of
  // strings.
  string type = 2;
  // The value when unset, as TOML ("" when there's none to show).
  string default = 3;
  // What it does.
  string doc = 4;
}

// Request message for ConfigService.ListModels.
message ListModelsRequest {
  // The workspace whose settings name the providers; "" for the user's.
  string workspace = 1;
  // Only these providers (gemini, anthropic, openai, …), configured or
  // not; none for every configured one.
  repeated string providers = 2;
}

// Request message for ConfigService.CheckApiKey.
message CheckApiKeyRequest {
  // The workspace whose other settings (base URL, retries) apply; "" for
  // the user's.
  string workspace = 1;
  // gemini, anthropic or openai.
  string provider = 2;
  // The key to try.
  string key = 3;
}

// Response message for ConfigService.CheckApiKey.
message CheckApiKeyResponse {
  // The provider took the key.
  bool works = 1;
  // Why not, when it didn't ("" when it did).
  string error = 2;
  // The models the key reaches, sorted.
  repeated string models = 3;
}

// A listed model with the price Blitz knows for it.
message ListedModel {
  string id = 1;
  // Dollars per million tokens; has_price false when Blitz knows none.
  bool has_price = 2;
  double input_per_mtok = 3;
  double output_per_mtok = 4;
  // What people call it, when the provider says (the organization's
  // models); "" to show the ID.
  string display_name = 5;
  // The organization's default model.
  bool is_default = 6;
  // What the organization says its model can do (EN-21); unset when it
  // says nothing, and for every other provider's models.
  ModelCapabilities capabilities = 7;
}

// What a model can do.
message ModelCapabilities {
  bool tools = 1;
  bool images = 2;
  bool thinking = 3;
  // Its context window in tokens; 0 when unknown.
  int32 context = 4;
}

// Request message for ConfigService.GetSignIn.
message GetSignInRequest {
  // The workspace whose settings name the profiles; "" for the user's.
  string workspace = 1;
  // google, anthropic, aws or azure; "" for all four.
  string provider = 2;
  // A profile over the configured one (anthropic, aws).
  string profile = 3;
}

// A provider's sign-in.
message SignInStatus {
  string provider = 1;
  // The vendor's program, whether it's installed, and where to get it.
  string tool = 2;
  bool tool_found = 3;
  string install = 4;
  // Its credentials work now, and what they are (account, profile, file).
  bool signed_in = 5;
  string detail = 6;
}

// Response message for ConfigService.GetSignIn.
message GetSignInResponse {
  repeated SignInStatus statuses = 1;
}

// Request message for ConfigService.SignIn.
message SignInRequest {
  string workspace = 1;
  string provider = 2;
  string profile = 3;
}

// Response message for ConfigService.SignIn: a line the tool printed, or
// the end.
message SignInResponse {
  string line = 1;
  // The sign-in page, and a device code, when the line has them.
  string url = 2;
  string code = 3;
  // The sign-in finished; status is the provider's after it.
  bool done = 4;
  SignInStatus status = 5;
}

// Request message for ConfigService.SignOut.
message SignOutRequest {
  string workspace = 1;
  string provider = 2;
  string profile = 3;
}

// Response message for ConfigService.SignOut.
message SignOutResponse {
  SignInStatus status = 1;
}

// ProviderModels are one provider's models.
message ProviderModels {
  string provider = 1;
  // Model IDs as the provider names them ("gemini-3.8-flash"), sorted.
  repeated string ids = 2;
  // Why they couldn't be listed ("" when they were).
  string error = 3;
  // What the list is when it isn't the provider's own (Bedrock, Azure:
  // the configured model only).
  string note = 4;
  // The models with their prices, in the order of ids.
  repeated ListedModel models = 5;
}


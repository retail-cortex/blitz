syntax = "proto3";

package blitz.v1;

option go_package = "github.com/retail-cortex/blitz/proto/blitz/v1;blitzv1";

// ConfigService reads and changes the settings: the global file
// (~/.blitz/.env.toml) and each workspace's own (kept under ~/.blitz, never
// in the workspace). API keys are kept in the OS keychain; the files refer
// to them. After a change, open workspaces reload their provider settings
// and rebuild their model; other settings apply when a workspace next opens.
// Every request names its scope: workspace is an absolute directory, or ""
// for the global settings.
service ConfigService {
  // What a scope sets: providers and where their keys come from (never the
  // keys themselves).
  rpc DescribeConfig(DescribeConfigRequest) returns (DescribeConfigResponse);
  // The models each configured provider offers, from its API (kept for a
  // few minutes), so forms can suggest and check model names.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  // Stores a provider's API key in the keychain and refers to it.
  rpc SetApiKey(SetApiKeyRequest) returns (SetApiKeyResponse);
  // Moves a provider's API key written in the scope's file (as plain text
  // or obfuscated) into the keychain.
  rpc SecureApiKey(SecureApiKeyRequest) returns (SecureApiKeyResponse);
  // Removes a provider's API key (a workspace then uses the global one).
  rpc RemoveApiKey(RemoveApiKeyRequest) returns (RemoveApiKeyResponse);
  // Saves a scope's provider, default model and, optionally, the
  // provider's API key as one change: all checked before anything is
  // written, and the open workspaces reload once.
  rpc SetProvider(SetProviderRequest) returns (SetProviderResponse);
  // Sets one of the forms' settings ("" removes it).
  rpc SetConfigValue(SetConfigValueRequest) returns (SetConfigValueResponse);
  // A scope's permission rules: its own file's, the global ones a
  // workspace adds to, and the built-in read-only rules.
  rpc DescribePermissions(DescribePermissionsRequest) returns (DescribePermissionsResponse);
  // Adds an allow, ask or deny rule to a scope's file, if it's valid.
  rpc AddPermission(AddPermissionRequest) returns (AddPermissionResponse);
  // Removes a rule from a scope's file (any effect).
  rpc RemovePermission(RemovePermissionRequest) returns (RemovePermissionResponse);
  // Checks a rule without saving it: its canonical form and how it
  // matches, or why it's invalid; with a sample, whether it applies to it.
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  // Turns the built-in read-only rules on or off in a scope, or leaves a
  // workspace to the global setting.
  rpc SetReadOnlyDefaults(SetReadOnlyDefaultsRequest) returns (SetReadOnlyDefaultsResponse);
  // Returns a scope's settings file as text.
  rpc GetConfigFile(GetConfigFileRequest) returns (GetConfigFileResponse);
  // Replaces a scope's settings file, if it's valid.
  rpc SaveConfigFile(SaveConfigFileRequest) returns (SaveConfigFileResponse);
  // Checks a settings file's text without saving it: TOML errors, values
  // of the wrong type and invalid permission rules, which stop it being
  // saved; unknown settings and API keys written as plain text, which
  // don't. Each at its line.
  rpc CheckConfigFile(CheckConfigFileRequest) returns (CheckConfigFileResponse);
  // Every setting a settings file can have, with its type, default and
  // description (from the settings' doc comments).
  rpc GetSettingsReference(GetSettingsReferenceRequest) returns (GetSettingsReferenceResponse);
  // The interface language the user's settings name ([ui] locale; empty
  // when they don't), and their own catalogs ([ui] locales_dir): the
  // desktop app's System language follows them.
  rpc GetInterfaceLanguage(GetInterfaceLanguageRequest) returns (GetInterfaceLanguageResponse);
}

// Request message for ConfigService.GetInterfaceLanguage.
message GetInterfaceLanguageRequest {}

// Response message for ConfigService.GetInterfaceLanguage.
message GetInterfaceLanguageResponse {
  // A language tag, or empty when the settings don't set one.
  string locale = 1;
  // The user's catalogs, each a catalog file's JSON (checked, as the
  // terminal loads them).
  repeated string catalogs = 2;
}

// KeySource says where a provider's API key comes from.
enum KeySource {
  KEY_SOURCE_UNSPECIFIED = 0;
  KEY_SOURCE_NONE = 1;
  // The OS keychain (the file holds a reference).
  KEY_SOURCE_KEYCHAIN = 2;
  // Written in the file as plain text.
  KEY_SOURCE_PLAIN = 3;
  // modenv's xor: value: obfuscated, not encrypted.
  KEY_SOURCE_OBFUSCATED = 4;
  // An environment variable of the service.
  KEY_SOURCE_ENVIRONMENT = 5;
  // A workspace using the global key.
  KEY_SOURCE_INHERITED = 6;
}

// One provider's settings in a scope, and where its API key comes from
// (never the key).
message ProviderConfig {
  // gemini, anthropic or openai.
  string name = 1;
  KeySource key_source = 2;
  // The file refers to a keychain secret that isn't there.
  bool key_missing = 3;
  // As set in this scope ("" when not).
  string base_url = 4;
  string model = 5;
  // How it signs in, as set in this scope: "" (an API key, or a workspace
  // following the global setting), adc (Gemini) or oauth (Anthropic).
  string auth = 6;
  // adc: the Google Cloud project and location ("" when not set here).
  string project_id = 7;
  string location = 8;
  // oauth: the `ant auth login` profile ("" for ant's active one).
  string profile = 9;
}

// How a provider signs in.
message ProviderAuth {
  // api_key ("" too), adc (Gemini through Vertex AI with Application
  // Default Credentials) or oauth (Anthropic, an `ant auth login` profile).
  string method = 1;
  // adc: the Google Cloud project and location ("" uses the service's
  // GOOGLE_CLOUD_PROJECT and GOOGLE_CLOUD_LOCATION, or "global").
  string project_id = 2;
  string location = 3;
  // oauth: the profile ("" uses ant's active one).
  string profile = 4;
}

// Request message for ConfigService.DescribeConfig.
message DescribeConfigRequest {
  string workspace = 1;
}

// Response message for ConfigService.DescribeConfig.
message DescribeConfigResponse {
  // The scope's settings file (it may not exist yet).
  string path = 1;
  // llm.provider and blitz.default_model as set in this scope.
  string provider = 2;
  string default_model = 3;
  repeated ProviderConfig providers = 4;
  // Where keys are kept ("macOS Keychain", "Secret Service", a file).
  string secret_store = 5;
}

// After a change: the file written, and why the scope's workspace (for a
// workspace scope, if it's open) still can't build its model ("" if it can).
message ConfigChange {
  string path = 1;
  string model_error = 2;
}

// Request message for ConfigService.SetApiKey.
message SetApiKeyRequest {
  string workspace = 1;
  string provider = 2;
  string key = 3;
}

// Response message for ConfigService.SetApiKey.
message SetApiKeyResponse {
  ConfigChange change = 1;
}

// Request message for ConfigService.SecureApiKey.
message SecureApiKeyRequest {
  string workspace = 1;
  string provider = 2;
}

// Response message for ConfigService.SecureApiKey.
message SecureApiKeyResponse {
  ConfigChange change = 1;
}

// Request message for ConfigService.RemoveApiKey.
message RemoveApiKeyRequest {
  string workspace = 1;
  string provider = 2;
}

// Response message for ConfigService.RemoveApiKey.
message RemoveApiKeyResponse {
  ConfigChange change = 1;
}

// Request message for ConfigService.SetConfigValue.
message SetConfigValueRequest {
  string workspace = 1;
  // llm.provider, blitz.default_model, llm.<provider>.model or .base_url,
  // llm.gemini.project_id or .location.
  string key = 2;
  string value = 3;
}

// Response message for ConfigService.SetConfigValue.
message SetConfigValueResponse {
  ConfigChange change = 1;
}

// Request message for ConfigService.SetProvider.
message SetProviderRequest {
  string workspace = 1;
  // llm.provider: gemini, anthropic, openai or ollama ("" removes it).
  string provider = 2;
  // blitz.default_model ("" removes it).
  string default_model = 3;
  // A new API key for the provider, kept in the keychain ("" keeps the
  // current one).
  string key = 4;
  // How the provider signs in (unset leaves it as it is).
  ProviderAuth auth = 5;
}

// Response message for ConfigService.SetProvider.
message SetProviderResponse {
  ConfigChange change = 1;
}

// Request message for ConfigService.GetConfigFile.
message GetConfigFileRequest {
  string workspace = 1;
}

// Response message for ConfigService.GetConfigFile.
message GetConfigFileResponse {
  string path = 1;
  // "" when the file doesn't exist yet.
  string text = 2;
}

// Request message for ConfigService.SaveConfigFile.
message SaveConfigFileRequest {
  string workspace = 1;
  string text = 2;
}

// Response message for ConfigService.SaveConfigFile.
message SaveConfigFileResponse {
  ConfigChange change = 1;
  // Unknown settings (likely typos) and keys written as plain text.
  repeated string warnings = 2;
}

// Request message for ConfigService.CheckConfigFile.
message CheckConfigFileRequest {
  // The settings file's text.
  string text = 1;
}

// Something wrong with a settings file.
message ConfigProblem {
  // The line (from 1), or 0 for the file as a whole.
  int32 line = 1;
  // The column (from 1), when known.
  int32 column = 2;
  // An error stops the file being saved; a warning doesn't.
  bool error = 3;
  string message = 4;
}

// Response message for ConfigService.CheckConfigFile.
message CheckConfigFileResponse {
  // By line, errors first on a line; none when the file is fine.
  repeated ConfigProblem problems = 1;
}

// Request message for ConfigService.GetSettingsReference.
message GetSettingsReferenceRequest {}

// One entry of the settings reference.
message SettingInfo {
  // The table ("llm") or setting ("llm.provider"). <name> stands for any
  // name ("model_settings.<model>.temperature"); [] marks an array of
  // tables ("hooks.pre_tool[].command").
  string key = 1;
  // table, array of tables, string, integer, number, boolean or list of
  // strings.
  string type = 2;
  // The value when unset, as TOML ("" when there's none to show).
  string default = 3;
  // What it does.
  string doc = 4;
}

// Request message for ConfigService.ListModels.
message ListModelsRequest {
  // The workspace whose settings name the providers; "" for the user's.
  string workspace = 1;
}

// ProviderModels are one provider's models.
message ProviderModels {
  string provider = 1;
  // Model IDs as the provider names them ("gemini-3.8-flash"), sorted.
  repeated string ids = 2;
  // Why they couldn't be listed ("" when they were).
  string error = 3;
  // What the list is when it isn't the provider's own (Bedrock, Azure:
  // the configured model only).
  string note = 4;
}

// Response message for ConfigService.ListModels.
message ListModelsResponse {
  repeated ProviderModels providers = 1;
  // The provider a name without "provider/" belongs to.
  string default_provider = 2;
}

// Response message for ConfigService.GetSettingsReference.
message GetSettingsReferenceResponse {
  repeated SettingInfo settings = 1;
}

// A rule in a settings file's [permissions].
message PermissionEntry {
  // allow, ask or deny.
  string effect = 1;
  // As written in the file.
  string rule = 2;
}

// Request message for ConfigService.DescribePermissions.
message DescribePermissionsRequest {
  string workspace = 1;
}

// Response message for ConfigService.DescribePermissions.
message DescribePermissionsResponse {
  // The scope's settings file (it may not exist yet).
  string path = 1;
  // The rules the scope's own file sets.
  repeated PermissionEntry rules = 2;
  // For a workspace: the global rules, which apply there too.
  repeated PermissionEntry inherited = 3;
  // read_only_defaults as the scope's file sets it: "on", "off" or ""
  // (not set: on globally, the global setting in a workspace).
  string read_only_defaults = 4;
  // Whether the built-in rules apply in the scope.
  bool read_only_defaults_on = 5;
  // The built-in rules: commands allowed without asking, and (described
  // for people) the options with which they ask even so.
  repeated string read_only_commands = 6;
  repeated string read_only_guards = 7;
}

// Request message for ConfigService.AddPermission.
message AddPermissionRequest {
  string workspace = 1;
  string effect = 2;
  string rule = 3;
}

// Response message for ConfigService.AddPermission.
message AddPermissionResponse {
  ConfigChange change = 1;
  // The rule in canonical form, as saved.
  string rule = 2;
}

// Request message for ConfigService.RemovePermission.
message RemovePermissionRequest {
  string workspace = 1;
  string rule = 2;
}

// Response message for ConfigService.RemovePermission.
message RemovePermissionResponse {
  ConfigChange change = 1;
  // How many rules were removed.
  int32 removed = 2;
}

// Request message for ConfigService.CheckPermission.
message CheckPermissionRequest {
  string effect = 1;
  string rule = 2;
  // A command (shell rules), path or name to try the rule on ("" for none).
  string sample = 3;
}

// Response message for ConfigService.CheckPermission.
message CheckPermissionResponse {
  // Why the rule is invalid ("" when it's valid).
  string error = 1;
  // The rule in canonical form, its kind and pattern.
  string rule = 2;
  string kind = 3;
  string pattern = 4;
  // How the pattern matches: prefix (a command with any arguments), glob
  // (* and ?), regex (re:), path or name.
  string form = 5;
  // Whether the sample was tried, and whether the rule applies to it (an
  // allow rule to every command in it, an ask or deny rule to any).
  bool tested = 6;
  bool matches = 7;
  // A file the sample command writes through a redirection: a matching
  // allow rule still asks.
  string redirect = 8;
}

// Request message for ConfigService.SetReadOnlyDefaults.
message SetReadOnlyDefaultsRequest {
  string workspace = 1;
  // "on", "off", or "" to remove the setting (a workspace then follows
  // the global one).
  string value = 2;
}

// Response message for ConfigService.SetReadOnlyDefaults.
message SetReadOnlyDefaultsResponse {
  ConfigChange change = 1;
}

syntax = "proto3";

package blitz.v1;

import "blitz/v1/turn.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/retail-cortex/blitz/proto/blitz/v1;blitzv1";

// SessionService runs conversations in a workspace: saved sessions, turns,
// steering, and the answers the agent waits for.
//
// Every request names its workspace by absolute directory; the service opens
// it on first use. Errors carry an ErrorInfo detail.
service SessionService {
  // Returns the workspace's sessions (or with all, every saved session),
  // newest first, without their messages.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Returns the session prompts go to, with its messages.
  rpc GetActiveSession(GetActiveSessionRequest) returns (GetActiveSessionResponse);
  // Starts a new session for the active agent and makes it active. It is
  // named after its first prompt.
  rpc NewSession(NewSessionRequest) returns (NewSessionResponse);
  // Opens the session to use at startup: the one resume names (an ID, or a
  // snapshot to start a new session from), the latest in the workspace, or
  // a new one. Fails with RESUME_FAILED when there is nothing to resume.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  // Makes a session active: by ID, or a new session copied from the
  // snapshot a name refers to (branched).
  rpc LoadSession(LoadSessionRequest) returns (LoadSessionResponse);
  // Saves a copy of the active session under a name (SNAPSHOT_NAME_TAKEN
  // unless force).
  rpc SaveSnapshot(SaveSnapshotRequest) returns (SaveSnapshotResponse);
  // Sets the active session's title.
  rpc RenameSession(RenameSessionRequest) returns (RenameSessionResponse);
  // Deletes a saved session or snapshot, by ID (another workspace's too):
  // its transcript and history. The workspace's active session, or one a
  // background run uses, is refused (SESSION_OPEN); an unknown ID is
  // SESSION_NOT_FOUND.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  // Starts a copy of the active session up to and including a prompt turn,
  // in the transcript and the event log, and makes it active (/fork).
  rpc ForkSession(ForkSessionRequest) returns (ForkSessionResponse);
  // Returns a session as Markdown, secrets masked (/export).
  rpc ExportSession(ExportSessionRequest) returns (ExportSessionResponse);
  // Carries a session into this workspace from the one it was in, and
  // makes it active there (/cd).
  rpc MoveSession(MoveSessionRequest) returns (MoveSessionResponse);

  // Runs one turn in a session and streams its events, ending with
  // TurnFinished. Cancelling the call interrupts the turn. While it runs,
  // answer approval requests and questions with Approve and Answer, and
  // send steer messages with Steer.
  rpc RunTurn(RunTurnRequest) returns (stream RunTurnResponse);
  // Queues a message for the agent while a turn runs; it reads it with its
  // next tool result. Fails with PROMPT_BLOCKED if a hook refuses it.
  rpc Steer(SteerRequest) returns (SteerResponse);
  // Answers an approval request from a running turn.
  rpc Approve(ApproveRequest) returns (ApproveResponse);
  // Answers a question from a running turn.
  rpc Answer(AnswerRequest) returns (AnswerResponse);

  // Returns the active session's usage and context size.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);
  // Summarises the active session's older turns to shrink the model's
  // context (NOTHING_TO_COMPACT when it is too short).
  rpc Compact(CompactRequest) returns (CompactResponse);
  // Gives the active session a goal: after each turn a model judges it,
  // and the agent is sent on until it holds (/goal).
  rpc SetGoal(SetGoalRequest) returns (SetGoalResponse);
  // Returns the active session's goal (NO_GOAL).
  rpc GetGoal(GetGoalRequest) returns (GetGoalResponse);
  // Removes the active session's goal (NO_GOAL).
  rpc ClearGoal(ClearGoalRequest) returns (ClearGoalResponse);
  // Looks for terms in the active session's transcript and returns the
  // prompt that asks the agent about the matches (run it as a turn).
  rpc SearchSession(SearchSessionRequest) returns (SearchSessionResponse);
  // Lists the active session's prompts, which it can be rewound to.
  rpc ListRewindPoints(ListRewindPointsRequest) returns (ListRewindPointsResponse);
  // Takes the active session back to one of its prompts: files,
  // conversation or both, or summarizes either side of it (SESSION_BUSY,
  // NOT_REWIND_POINT, CANT_REWIND_CONVERSATION, UNDO_CONFLICT unless force).
  rpc Rewind(RewindRequest) returns (RewindResponse);

  // Background runs (blitz --bg, agents, attach, logs, stop): turns the
  // service runs in sessions of their own, with no client attached. Their
  // approval requests and questions wait until a client watching the run
  // answers them with Approve and Answer.
  //
  // Starts a turn in a new session of the workspace, without making it the
  // active one, and returns at once.
  rpc StartBackground(StartBackgroundRequest) returns (StartBackgroundResponse);
  // Returns the service's background runs in every workspace, newest
  // first: those running or waiting, and the latest that ended.
  rpc ListBackground(ListBackgroundRequest) returns (ListBackgroundResponse);
  // Streams a background run's events so far (the requests still waiting
  // among them) and, with follow, those to come, ending with TurnFinished
  // once it has ended (UNKNOWN_RUN).
  rpc WatchBackground(WatchBackgroundRequest) returns (stream WatchBackgroundResponse);
  // Stops a background run (UNKNOWN_RUN).
  rpc StopBackground(StopBackgroundRequest) returns (StopBackgroundResponse);
}

// SessionInfo describes a saved session.
message SessionInfo {
  string id = 1;
  // Empty until the first prompt names it.
  string title = 2;
  string agent = 3;
  // The workspace directory it belongs to (empty for old sessions).
  string workspace = 4;
  // The snapshot name, for a snapshot.
  string snapshot = 5;
  // The session this one was copied from.
  string from = 6;
  int32 message_count = 7;
  google.protobuf.Timestamp created = 8;
  google.protobuf.Timestamp updated = 9;
  // Filled in only where noted.
  repeated Message messages = 10;
  // The workspace /cd moved the session from, and how many messages it
  // had then: earlier prompts were there (empty and 0 if never moved).
  string moved_from = 11;
  int32 moved_at = 12;
  // What started it: "worker" (a worker's run), "background" (a detached
  // run, blitz --bg), or "" for a chat.
  string origin = 13;
}

// Message is one message in a transcript.
message Message {
  // "user" or "model".
  string role = 1;
  string text = 2;
  google.protobuf.Timestamp time = 3;
  // For user messages: "" for a prompt (a rewind point), "steer", "hook"
  // (a stop hook's request) or "plan" (an approved plan's go-ahead).
  string kind = 4;
}

// Request message for SessionService.ListSessions.
message ListSessionsRequest {
  string workspace = 1;
  // Every saved session, not only this workspace's.
  bool all = 2;
}

// Response message for SessionService.ListSessions.
message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

// Request message for SessionService.GetActiveSession.
message GetActiveSessionRequest {
  string workspace = 1;
}

// Response message for SessionService.GetActiveSession.
message GetActiveSessionResponse {
  // Unset when no session is active.
  SessionInfo session = 1;
}

// Request message for SessionService.NewSession.
message NewSessionRequest {
  string workspace = 1;
}

// Response message for SessionService.NewSession.
message NewSessionResponse {
  SessionInfo session = 1;
}

// Request message for SessionService.OpenSession.
message OpenSessionRequest {
  string workspace = 1;
  // A session ID, a snapshot name, or "latest"; empty for a new session
  // unless continue_latest.
  string resume = 2;
  bool continue_latest = 3;
}

// Response message for SessionService.OpenSession.
message OpenSessionResponse {
  SessionInfo session = 1;
  // An existing session was resumed.
  bool resumed = 2;
}

// Request message for SessionService.LoadSession.
message LoadSessionRequest {
  string workspace = 1;
  // A session ID or snapshot name.
  string ref = 2;
}

// Response message for SessionService.LoadSession.
message LoadSessionResponse {
  // With its messages.
  SessionInfo session = 1;
  // A new session started from a snapshot.
  bool branched = 2;
}

// Request message for SessionService.SaveSnapshot.
message SaveSnapshotRequest {
  string workspace = 1;
  string name = 2;
  bool force = 3;
}

// Response message for SessionService.SaveSnapshot.
message SaveSnapshotResponse {
  SessionInfo snapshot = 1;
}

// Request message for SessionService.RenameSession.
message RenameSessionRequest {
  string workspace = 1;
  string title = 2;
}

// Response message for SessionService.RenameSession.
message RenameSessionResponse {
  SessionInfo session = 1;
}

// Request message for SessionService.DeleteSession.
message DeleteSessionRequest {
  string workspace = 1;
  string session_id = 2;
}

// Response message for SessionService.DeleteSession.
message DeleteSessionResponse {}

// Request message for SessionService.ForkSession.
message ForkSessionRequest {
  string workspace = 1;
  // The last prompt turn to keep: 1 the first; 0 all of them.
  int32 turn = 2;
}

// Response message for SessionService.ForkSession.
message ForkSessionResponse {
  SessionInfo session = 1;
}

// Request message for SessionService.ExportSession.
message ExportSessionRequest {
  string workspace = 1;
  // The session; empty for the active one.
  string session_id = 2;
}

// Response message for SessionService.ExportSession.
message ExportSessionResponse {
  string markdown = 1;
}

// Request message for SessionService.MoveSession.
message MoveSessionRequest {
  // The workspace it moves to.
  string workspace = 1;
  string session_id = 2;
}

// Response message for SessionService.MoveSession.
message MoveSessionResponse {
  SessionInfo session = 1;
}

// Request message for SessionService.RunTurn.
message RunTurnRequest {
  string workspace = 1;
  string session_id = 2;
  Turn turn = 3;
}

// Response message for SessionService.RunTurn.
message RunTurnResponse {
  TurnEvent event = 1;
}

// Request message for SessionService.Steer.
message SteerRequest {
  string workspace = 1;
  string session_id = 2;
  string text = 3;
}

// Response message for SessionService.Steer.
message SteerResponse {}

// Request message for SessionService.Approve.
message ApproveRequest {
  string workspace = 1;
  string request_id = 2;
  Decision decision = 3;
}

// Response message for SessionService.Approve.
message ApproveResponse {}

// Request message for SessionService.Answer.
message AnswerRequest {
  string workspace = 1;
  string request_id = 2;
  string answer = 3;
}

// Response message for SessionService.Answer.
message AnswerResponse {}

// Request message for SessionService.GetUsage.
message GetUsageRequest {
  string workspace = 1;
  // Also estimate what the context is made of (parts).
  bool parts = 2;
}

// Response message for SessionService.GetUsage.
message GetUsageResponse {
  Usage usage = 1;
  // The context is compacted when it passes threshold tokens, keeping the
  // last keep events.
  bool auto_compact = 2;
  int32 threshold = 3;
  int32 keep = 4;
  // What the context is made of, estimated by category, when asked for.
  repeated ContextPart parts = 5;
}

// ContextPart is one category of what a prompt carries.
message ContextPart {
  // system prompt, instructions and notes, tool declarations, your
  // messages, replies, tool calls, tool results, images, earlier
  // conversation (summary).
  string name = 1;
  int64 tokens = 2;
}

// Goal is what a session works toward.
message Goal {
  string condition = 1;
  // How often the agent was sent on, and the limit.
  int32 continues = 2;
  int32 max = 3;
  // The judge's latest reason.
  string last = 4;
}

// Request message for SessionService.SetGoal.
message SetGoalRequest {
  string workspace = 1;
  string condition = 2;
}

// Response message for SessionService.SetGoal.
message SetGoalResponse {
  Goal goal = 1;
}

// Request message for SessionService.GetGoal.
message GetGoalRequest {
  string workspace = 1;
}

// Response message for SessionService.GetGoal.
message GetGoalResponse {
  Goal goal = 1;
}

// Request message for SessionService.ClearGoal.
message ClearGoalRequest {
  string workspace = 1;
}

// Response message for SessionService.ClearGoal.
message ClearGoalResponse {}

// Request message for SessionService.Compact.
message CompactRequest {
  string workspace = 1;
  // What the summary should keep.
  string focus = 2;
}

// Response message for SessionService.Compact.
message CompactResponse {
  int32 events_compacted = 1;
  int32 summary_chars = 2;
  Usage before = 3;
  Usage after = 4;
}

// A prompt the conversation can be rewound to: its place in the transcript,
// its text and time, the files the agent changed from it on, and whether
// the conversation can go back to it.
message RewindPoint {
  // The prompt's position in the transcript.
  int32 index = 1;
  string text = 2;
  google.protobuf.Timestamp time = 3;
  // Files the agent changed from this prompt until the next.
  repeated string files = 4;
  // Whether the conversation can be rewound to it.
  bool conversation = 5;
}

// Request message for SessionService.ListRewindPoints.
message ListRewindPointsRequest {
  string workspace = 1;
}

// Response message for SessionService.ListRewindPoints.
message ListRewindPointsResponse {
  repeated RewindPoint points = 1;
}

// Request message for SessionService.Rewind.
message RewindRequest {
  string workspace = 1;
  int32 index = 2;
  // both, conversation, code, summarize_from or summarize_up_to.
  string mode = 3;
  // Restore files even if they changed since the agent's edits.
  bool force = 4;
}

// Response message for SessionService.Rewind.
message RewindResponse {
  string mode = 1;
  repeated string restored = 2;
  // The prompt's text, to edit and send again.
  string prompt = 3;
  CompactResponse compacted = 4;
}

// Request message for SessionService.SearchSession.
message SearchSessionRequest {
  string workspace = 1;
  string terms = 2;
}

// Response message for SessionService.SearchSession.
message SearchSessionResponse {
  // How many passages matched.
  int32 found = 1;
  string prompt = 2;
}

// BackgroundRun is a turn the service runs with no client attached.
message BackgroundRun {
  // bg-1, bg-2, … for the service's lifetime.
  string id = 1;
  string workspace = 2;
  string session_id = 3;
  // The prompt's first line.
  string prompt = 4;
  // running, waiting (for an answer), done, failed or stopped.
  string state = 5;
  google.protobuf.Timestamp started = 6;
  // Unset while it runs.
  google.protobuf.Timestamp ended = 7;
  double cost_usd = 8;
  // Requests waiting for an answer.
  int32 waiting = 9;
  string error = 10;
}

// Request message for SessionService.StartBackground.
message StartBackgroundRequest {
  string workspace = 1;
  Turn turn = 2;
}

// Response message for SessionService.StartBackground.
message StartBackgroundResponse {
  BackgroundRun run = 1;
}

// Request message for SessionService.ListBackground.
message ListBackgroundRequest {}

// Response message for SessionService.ListBackground.
message ListBackgroundResponse {
  repeated BackgroundRun runs = 1;
}

// Request message for SessionService.WatchBackground.
message WatchBackgroundRequest {
  string id = 1;
  // Keep streaming until the run ends; otherwise stop after what has
  // happened so far.
  bool follow = 2;
}

// Response message for SessionService.WatchBackground.
message WatchBackgroundResponse {
  TurnEvent event = 1;
}

// Request message for SessionService.StopBackground.
message StopBackgroundRequest {
  string id = 1;
}

// Response message for SessionService.StopBackground.
message StopBackgroundResponse {
  BackgroundRun run = 1;
}

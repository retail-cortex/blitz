syntax = "proto3";

package blitz.v1;

import "blitz/v1/session.proto";
import "blitz/v1/turn.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/retail-cortex/blitz/proto/blitz/v1;blitzv1";

// WorkspaceService covers everything about a workspace except its
// conversations (SessionService) and workers (WorkerService): agents and
// models, settings, skills and their environments, MCP servers and tools,
// project memory, the reply language, checkpoints, approvals, images and web
// search. Mirrors pkg/api's Backend.
//
// Every request names its workspace by absolute directory; the service opens
// it on first use. Errors carry an ErrorInfo detail.
service WorkspaceService {
  // Describes the service itself, so a client can tell whether it's the
  // version it expects (older services don't have it: Unimplemented).
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);
  // Stops the service as SIGTERM does: turns in progress get a few seconds,
  // then it exits. For clients that can't signal it (Windows, where it
  // isn't a login item: the tray stops it this way). A service that can't
  // stop itself (one in a test) is FAILED_PRECONDITION.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  // The days the service has a log for, newest first, and its log
  // directory.
  rpc ListLogDays(ListLogDaysRequest) returns (ListLogDaysResponse);
  // A day's log records, newest first, filtered by level and text.
  rpc ReadLog(ReadLogRequest) returns (ReadLogResponse);
  // Deletes a past day's log. Today's is being written: LOG_IN_USE; a day
  // with no log is LOG_NOT_FOUND.
  rpc DeleteLogDay(DeleteLogDayRequest) returns (DeleteLogDayResponse);
  // Returns the workspaces the service has open.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  // Closes a workspace: kills its background processes and MCP servers.
  rpc CloseWorkspace(CloseWorkspaceRequest) returns (CloseWorkspaceResponse);
  // Describes the sandbox commands run in, one line each.
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);

  // Returns every agent and which is active.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // Makes an agent the active one (UNKNOWN_AGENT).
  rpc SetAgent(SetAgentRequest) returns (SetAgentResponse);
  // Returns what the welcome screen suggests for the workspace: tiles from
  // its state at once, and up to three a model wrote from the recent
  // conversations (cached; pending while new ones are being written), and
  // whether it has no agent instructions yet, so setup (/setup) is offered.
  rpc GetSuggestions(GetSuggestionsRequest) returns (GetSuggestionsResponse);
  // Lists the agent files of a scope: the workspace's (.agents/agents) or
  // the user's (~/.blitz/agents), with why a file doesn't load.
  rpc ListAgentFiles(ListAgentFilesRequest) returns (ListAgentFilesResponse);
  // Writes an agent's file, a new one or in place of previous_name's; what
  // is wrong with it comes back as problems, with nothing written.
  rpc SaveAgentFile(SaveAgentFileRequest) returns (SaveAgentFileResponse);
  // Deletes an agent's file (UNKNOWN_AGENT).
  rpc DeleteAgentFile(DeleteAgentFileRequest) returns (DeleteAgentFileResponse);
  // Returns the model the active agent runs on.
  rpc GetModel(GetModelRequest) returns (GetModelResponse);
  // Switches every unpinned agent to a model.
  rpc SetModel(SetModelRequest) returns (SetModelResponse);
  // Pins an agent to a model and saves the pin (UNKNOWN_AGENT).
  rpc PinModel(PinModelRequest) returns (PinModelResponse);
  // Returns an agent to the configured model, or its own default.
  rpc UnpinModel(UnpinModelRequest) returns (UnpinModelResponse);
  // Returns every model's generation settings, or one model's.
  rpc GetModelSettings(GetModelSettingsRequest) returns (GetModelSettingsResponse);
  // Changes a model's generation settings and saves them (BAD_MODEL_REF,
  // INVALID_SETTING; nothing changes on error).
  rpc UpdateModelSettings(UpdateModelSettingsRequest) returns (UpdateModelSettingsResponse);
  // Returns the agency level, plus model, agent and reply language.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // Returns the workspace's git branch and how many files differ from
  // HEAD (repo false outside a repository; one with no commit yet is a
  // repository), and whether git is installed, for the status bar and
  // Changes.
  rpc GetGitStatus(GetGitStatusRequest) returns (GetGitStatusResponse);
  // Makes the workspace a git repository (git init) unless it's in one
  // already, and returns its git status (NO_GIT without git on the
  // service's PATH, GIT_FAILED).
  rpc InitGitRepo(InitGitRepoRequest) returns (InitGitRepoResponse);
  // Lists what's staged (everything staged first with stage_all, as git
  // add --all) and has the model draft a commit message from its diff,
  // secrets redacted; nothing is asked with nothing staged, and a model
  // that fails leaves the message empty with problem saying why
  // (NOT_A_REPOSITORY, GIT_FAILED).
  rpc DraftCommit(DraftCommitRequest) returns (DraftCommitResponse);
  // Commits what's staged with the message (the repository's hooks run)
  // (NOT_A_REPOSITORY, NOTHING_STAGED, EMPTY_MESSAGE, GIT_FAILED).
  rpc Commit(CommitRequest) returns (CommitResponse);
  // Fetches the upstream's remote (else every remote) for the ahead and
  // behind counts, and returns the git status (NOT_A_REPOSITORY, NO_REMOTE,
  // REPO_CONFIG_COMMAND, REMOTE_AUTH, GIT_FAILED).
  rpc FetchRemote(FetchRemoteRequest) returns (FetchRemoteResponse);
  // Pulls the upstream's commits as the repository's git config says
  // (pull.rebase, pull.ff; a merge when neither is set), keeping
  // uncommitted changes. One that stops on conflicts isn't an error: its
  // outcome is CONFLICTS (NOT_A_REPOSITORY, NO_UPSTREAM, GIT_BUSY,
  // REPO_CONFIG_COMMAND, REMOTE_AUTH, GIT_FAILED).
  rpc Pull(PullRequest) returns (PullResponse);
  // Pushes the branch to its upstream, or publishes it to the remote and
  // tracks it (NOT_A_REPOSITORY, NO_REMOTE, GIT_BUSY, PUSH_REJECTED,
  // REPO_CONFIG_COMMAND, REMOTE_AUTH, GIT_FAILED).
  rpc Push(PushRequest) returns (PushResponse);
  // Settles a file a pull left in conflict (NO_MERGE, NOT_CONFLICTED,
  // MARKERS_REMAIN, BAD_PATH, REPO_CONFIG_COMMAND, GIT_FAILED).
  rpc ResolveConflict(ResolveConflictRequest) returns (ResolveConflictResponse);
  // Completes the merge or rebase a pull started; a rebase may stop on
  // its next commit's conflicts (NO_MERGE, CONFLICTS_REMAIN,
  // REPO_CONFIG_COMMAND, GIT_FAILED).
  rpc CompleteMerge(CompleteMergeRequest) returns (CompleteMergeResponse);
  // Gives up the merge or rebase a pull started, putting the branch and
  // the uncommitted changes back (NO_MERGE, REPO_CONFIG_COMMAND,
  // GIT_FAILED).
  rpc AbortMerge(AbortMergeRequest) returns (AbortMergeResponse);
  // Lists the local branches, then the remotes' branches no local branch
  // tracks, each newest commit first (NOT_A_REPOSITORY, GIT_FAILED).
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  // Checks out a branch, carrying uncommitted changes along; a remote's
  // branch gets a local one that tracks it (NOT_A_REPOSITORY, NO_BRANCH,
  // BAD_BRANCH_NAME, LOCAL_CHANGES, GIT_BUSY, REPO_CONFIG_COMMAND,
  // GIT_FAILED).
  rpc SwitchBranch(SwitchBranchRequest) returns (SwitchBranchResponse);
  // Makes a branch at the current commit and switches to it, keeping
  // uncommitted changes (NOT_A_REPOSITORY, BRANCH_EXISTS, BAD_BRANCH_NAME,
  // GIT_BUSY, REPO_CONFIG_COMMAND, GIT_FAILED).
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);
  // Merges a branch into the current one, keeping uncommitted changes. One
  // that stops on conflicts isn't an error: its outcome is CONFLICTS, and
  // ResolveConflict, CompleteMerge and AbortMerge finish it
  // (NOT_A_REPOSITORY, NO_BRANCH, BAD_BRANCH_NAME, MERGE_SELF, GIT_BUSY,
  // REPO_CONFIG_COMMAND, GIT_FAILED).
  rpc MergeBranch(MergeBranchRequest) returns (MergeBranchResponse);
  // Changes a setting for the workspace: agency, or effort (a reasoning
  // effort, or "auto" to clear it) (UNKNOWN_SETTING, INVALID_AGENCY,
  // INVALID_SETTING).
  rpc SetSetting(SetSettingRequest) returns (SetSettingResponse);
  // Changes which actions run without asking, for every session of the
  // workspace (UNKNOWN_MODE; BYPASS_NEEDS_SANDBOX when bypass is asked for
  // without an active OS sandbox).
  rpc SetPermissionMode(SetPermissionModeRequest) returns (SetPermissionModeResponse);
  // Returns the custom slash commands: command files, bundled commands, and
  // skills run by name.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  // Returns the permission rules in force: deny, then ask, then allow.
  rpc ListPermissionRules(ListPermissionRulesRequest) returns (ListPermissionRulesResponse);
  // Adds an allow, ask or deny rule for the workspace and, with save, to
  // a settings file: the global one or, with scope "workspace", the
  // workspace's own (BAD_RULE). Read rules must be saved and apply from
  // the next start.
  rpc AddPermissionRule(AddPermissionRuleRequest) returns (AddPermissionRuleResponse);
  // Removes a rule (any effect), and with save from a settings file.
  rpc RemovePermissionRule(RemovePermissionRuleRequest) returns (RemovePermissionRuleResponse);

  // Returns the skills found, or those matching a query.
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  // Returns one skill (SKILL_NOT_FOUND).
  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse);
  // Returns a skill as Studio edits it: its SKILL.md's fields and hash,
  // and whether it's the workspace's own, which may be edited
  // (SKILL_NOT_FOUND; spec_skills_013 SK-100).
  rpc GetSkillFile(GetSkillFileRequest) returns (GetSkillFileResponse);
  // Writes a skill of the workspace's from Studio's form: a new one in
  // .agents/skills, or an existing one (renamed when the name differs) if
  // its SKILL.md still has the hash read (HASH_MISMATCH). Its front
  // matter's other fields are kept. Problems are returned, with nothing
  // written, when it can't be saved.
  rpc SaveSkill(SaveSkillRequest) returns (SaveSkillResponse);
  // Deletes a skill of the workspace's: its folder (SKILL_NOT_FOUND).
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse);
  // Returns one of a skill's files (references/…, scripts/…).
  rpc ReadSkillFile(ReadSkillFileRequest) returns (ReadSkillFileResponse);
  // Writes one of a workspace skill's files, under references/ or
  // scripts/, never outside its folder.
  rpc WriteSkillFile(WriteSkillFileRequest) returns (WriteSkillFileResponse);
  // Removes one of a workspace skill's files.
  rpc DeleteSkillFile(DeleteSkillFileRequest) returns (DeleteSkillFileResponse);
  // Copies any skill the workspace sees into .agents/skills under a name
  // of its own, files and all, to edit (problems, nothing written, when
  // the name won't do).
  rpc CopySkill(CopySkillRequest) returns (CopySkillResponse);
  // Runs one of a skill's scripts now with arguments, as run_skill_script
  // would (the policy, its sandbox and the permission rules apply): the
  // user starts it, so its approvals are given.
  rpc RunSkillScript(RunSkillScriptRequest) returns (RunSkillScriptResponse);
  // Returns the workspace's rules (spec_gates_041): the gates in the
  // order they run (before the agent, then after), then the instruction
  // rules.
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  // Writes a rule in .agents/rules from Studio's form (renamed when the
  // name differs from previous_name), keeping its front matter's other
  // fields; problems, with nothing written, when it can't be saved.
  rpc SaveRule(SaveRuleRequest) returns (SaveRuleResponse);
  // Deletes a rule from .agents/rules (RULE_NOT_FOUND).
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse);
  // Numbers the named rules in .agents/rules 10, 20, 30… in the order
  // given: the order they run.
  rpc ReorderRules(ReorderRulesRequest) returns (ReorderRulesResponse);
  // Judges a sample against a rule as written (Try it): a prompt for a
  // before-agent rule, an answer for an after-agent one. A judge that
  // fails gives problem.
  rpc TryRule(TryRuleRequest) returns (TryRuleResponse);
  // Returns the workspace's guardrails (spec_gates_041): each built-in one
  // (its file, or its defaults), then the custom ones.
  rpc ListGuardrails(ListGuardrailsRequest) returns (ListGuardrailsResponse);
  // Writes a guardrail in .agents/guardrails from Studio's form (a
  // built-in's file holds its settings, or switches it off), keeping its front matter's other
  // fields; problems, with nothing written, when it can't be saved.
  rpc SaveGuardrail(SaveGuardrailRequest) returns (SaveGuardrailResponse);
  // Deletes a guardrail from .agents/guardrails (a built-in's: back to its
  // defaults; GUARDRAIL_NOT_FOUND).
  rpc DeleteGuardrail(DeleteGuardrailRequest) returns (DeleteGuardrailResponse);
  // Checks a sample against a guardrail as written (Try it): a custom one
  // by the judge, the injection and secrets ones by their patterns. A
  // judge that fails gives problem.
  rpc TryGuardrail(TryGuardrailRequest) returns (TryGuardrailResponse);
  // Returns the workspace's evals (spec_evals_042), by name, each with its
  // last run's status.
  rpc ListEvals(ListEvalsRequest) returns (ListEvalsResponse);
  // Writes an eval in .agents/evals from Studio's form, keeping its front
  // matter's other fields and the text around its table; problems, with
  // nothing written, when it can't be saved (EVAL_NOT_FOUND for an
  // unknown previous_name).
  rpc SaveEval(SaveEvalRequest) returns (SaveEvalResponse);
  // Deletes an eval from .agents/evals (EVAL_NOT_FOUND).
  rpc DeleteEval(DeleteEvalRequest) returns (DeleteEvalResponse);
  // Runs an eval: its cases (or those named) on each of its agents,
  // streaming each result as it's scored, then the finished run, which
  // is recorded. An eval with a problem, or no case to run, is
  // FAILED_PRECONDITION (EVAL_NOT_RUNNABLE).
  rpc RunEval(RunEvalRequest) returns (stream RunEvalResponse);
  // Returns an eval's recorded runs, newest first.
  rpc ListEvalRuns(ListEvalRunsRequest) returns (ListEvalRunsResponse);
  // Drafts cases for an agent from its description and instructions,
  // beside the cases given, saving nothing. An unknown agent is
  // INVALID_ARGUMENT; a model that fails gives problem.
  rpc DraftEvalCases(DraftEvalCasesRequest) returns (DraftEvalCasesResponse);
  // Returns the workspace's workflows (spec_workflows_043), by name. Run
  // one as a turn ("/name input"), in a session or in the background.
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  // Writes a workflow in .agents/workflows from Studio's canvas; problems,
  // with nothing written, when it can't be saved (WORKFLOW_NOT_FOUND for
  // an unknown previous_name). A step not filled in yet is saved, and is
  // the workflow's problem until it is.
  rpc SaveWorkflow(SaveWorkflowRequest) returns (SaveWorkflowResponse);
  // Deletes a workflow from .agents/workflows (WORKFLOW_NOT_FOUND).
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (DeleteWorkflowResponse);
  // Returns the tasks paused workflow runs wait on (human tasks' forms,
  // timers), oldest first: one workspace's, or every one's.
  rpc ListHumanTasks(ListHumanTasksRequest) returns (ListHumanTasksResponse);
  // Streams the tasks: the list now, then again each time it changes (a
  // run pauses, a task is answered, a timer fires).
  rpc WatchHumanTasks(ListHumanTasksRequest) returns (stream ListHumanTasksResponse);
  // Answers a human task with A2UI's action message, checked against its
  // form by the service: its run resumes in the background
  // (TASK_NOT_FOUND; ANSWER_INVALID with the problems; NOT_ANSWERABLE for
  // a timer; WORKFLOW_CHANGED when its workflow changed since).
  rpc AnswerHumanTask(AnswerHumanTaskRequest) returns (AnswerHumanTaskResponse);
  // Returns skill scripts' environments (SCRIPTS_DISABLED).
  rpc ListEnvs(ListEnvsRequest) returns (ListEnvsResponse);
  // Removes one environment.
  rpc RemoveEnv(RemoveEnvRequest) returns (RemoveEnvResponse);
  // Removes environments no allowed script needs, and incomplete ones.
  rpc PruneEnvs(PruneEnvsRequest) returns (PruneEnvsResponse);
  // Has the model write or improve a manifest field (an agent's or a
  // skill's instructions, a script, a rule): nothing is saved.
  rpc DraftManifest(DraftManifestRequest) returns (DraftManifestResponse);
  // Returns the configured MCP servers and how each is doing.
  rpc ListMCPServers(ListMCPServersRequest) returns (ListMCPServersResponse);
  // Stops an MCP server and starts it afresh when the next turn lists its
  // tools (NOT_FOUND when it isn't running).
  rpc RestartMCPServer(RestartMCPServerRequest) returns (RestartMCPServerResponse);
  // Returns what the active agent can use.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);

  // Re-reads project instruction files and returns their paths.
  rpc ReloadMemory(ReloadMemoryRequest) returns (ReloadMemoryResponse);
  // Re-reads the agents, skills, instruction files and rules whether or
  // not they look changed, and says what it loaded (/reload). Each turn
  // already reloads what changed; MCP servers aren't restarted.
  rpc ReloadAgentFiles(ReloadAgentFilesRequest) returns (ReloadAgentFilesResponse);
  // Appends a note to the project instruction file.
  rpc AddMemory(AddMemoryRequest) returns (AddMemoryResponse);
  // Returns the languages with an interface catalog.
  rpc ListLocales(ListLocalesRequest) returns (ListLocalesResponse);
  // Sets the language the model replies in and saves it (UNKNOWN_LOCALE).
  // The client switches its own interface language to the returned tag.
  rpc SetLocale(SetLocaleRequest) returns (SetLocaleResponse);

  // Returns the turns that changed files, newest first.
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  // Restores the files the latest turn with changes modified
  // (UNDO_CONFLICT unless force; NOTHING_TO_UNDO when none are left).
  rpc Undo(UndoRequest) returns (UndoResponse);
  // Returns a diff of the agent's changes this session, or git's.
  rpc GetDiff(GetDiffRequest) returns (GetDiffResponse);
  // Returns standing approvals.
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  // Revokes approvals by key, or all of them.
  rpc RevokeApprovals(RevokeApprovalsRequest) returns (RevokeApprovalsResponse);

  // Returns the background processes started in the given sessions' turns
  // (a client's), finished ones too, ordered by ID.
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  // Returns a background process's captured output and status
  // (UNKNOWN_PROCESS unless one of the given sessions started it).
  rpc GetProcessOutput(GetProcessOutputRequest) returns (GetProcessOutputResponse);
  // Stops a background process and its descendants (UNKNOWN_PROCESS unless
  // one of the given sessions started it).
  rpc KillProcess(KillProcessRequest) returns (KillProcessResponse);
  // Records in the workspace's audit log a command the user ran directly
  // in a client (!cmd), as user_shell.
  rpc AuditShell(AuditShellRequest) returns (AuditShellResponse);

  // Returns the background tasks (invoke_agent with background: true)
  // started in the given sessions' turns, oldest first.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  // Returns a background task with its latest events (UNKNOWN_TASK unless
  // one of the given sessions started it).
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  // Stops a background task (UNKNOWN_TASK unless one of the given
  // sessions started it).
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);
  // Streams what happens to the given sessions' background tasks outside
  // turns: first their active tasks and waiting requests, then ready,
  // then each change. Requests are answered with SessionService.Approve and Answer.
  rpc WatchTasks(WatchTasksRequest) returns (stream WatchTasksResponse);
  // Returns the given sessions' tasks' approval requests and questions
  // waiting for an answer.
  rpc ListTaskRequests(ListTaskRequestsRequest) returns (ListTaskRequestsResponse);

  // Returns the workspace's project settings (.blitz/settings.toml) and
  // the trust decision for the part that runs code or loosens a policy.
  rpc GetProjectSettings(GetProjectSettingsRequest) returns (GetProjectSettingsResponse);
  // Records trusting or declining the project settings with the hash
  // shown (PROJECT_CHANGED if they have changed since), and reopens the
  // workspace so they take effect, unless a turn is running in it.
  rpc TrustProject(TrustProjectRequest) returns (TrustProjectResponse);
  // Forgets the decision about the project settings (blitz trust
  // --revoke): they wait for trust again, and the workspace reopens
  // without them unless a turn is running in it.
  rpc ForgetProjectTrust(ForgetProjectTrustRequest) returns (ForgetProjectTrustResponse);

  // Removes and returns what watched background processes (notify) of a
  // session reported while no turn ran there.
  rpc TakeProcessNotices(TakeProcessNoticesRequest) returns (TakeProcessNoticesResponse);

  // Returns the output styles, with the one in use (SetSetting "style"
  // changes it).
  rpc ListStyles(ListStylesRequest) returns (ListStylesResponse);

  // Returns the configured hooks, by event, with their recent failures.
  rpc ListHooks(ListHooksRequest) returns (ListHooksResponse);

  // Returns the notes the agent saved across sessions of the workspace
  // with its remember tool, newest first.
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);
  // Deletes one of those notes, by its name (NO_NOTE).
  rpc ForgetNote(ForgetNoteRequest) returns (ForgetNoteResponse);

  // Reads an image or a PDF from the workspace for a prompt
  // (IMAGES_DISABLED).
  rpc LoadImage(LoadImageRequest) returns (LoadImageResponse);
  // Stores image or PDF data (e.g. pasted) for a prompt (IMAGES_DISABLED).
  rpc AddImage(AddImageRequest) returns (AddImageResponse);
  // Names the web search provider (NO_FETCH when the agent can't fetch
  // pages, so a search would give it nothing to read).
  rpc GetSearchProvider(GetSearchProviderRequest) returns (GetSearchProviderResponse);
  // Searches the web and prepares the prompt that hands the readable results
  // to the agent (NO_FETCH, NO_SEARCH): run it as a turn with fetch_grants
  // set to the links' URLs.
  rpc SearchWeb(SearchWebRequest) returns (SearchWebResponse);
  // Searches the workspace's index: its files, the text of its PDFs and
  // notebooks, its chats and notes (SEARCH_DISABLED, UNKNOWN_SEARCH_SOURCE;
  // spec_search_035).
  rpc SearchWorkspace(SearchWorkspaceRequest) returns (SearchWorkspaceResponse);
  // Says how the workspace's search index is.
  rpc GetSearchStatus(GetSearchStatusRequest) returns (GetSearchStatusResponse);
  // Starts a scan of the workspace for search and returns at once
  // (SEARCH_DISABLED).
  rpc Reindex(ReindexRequest) returns (ReindexResponse);
}

// Saved reports where a change was written in the config file. The change
// applies even when saving fails.
message Saved {
  string path = 1;
  // Why it wasn't saved; empty on success.
  string error = 2;
}

// Request message for WorkspaceService.Shutdown.
message ShutdownRequest {}

// Response message for WorkspaceService.Shutdown: sent before the service
// stops.
message ShutdownResponse {}

// Request message for WorkspaceService.GetServiceInfo.
message GetServiceInfoRequest {}

// Response message for WorkspaceService.GetServiceInfo.
message GetServiceInfoResponse {
  // The release (1.4.0), or "dev" for an unstamped build.
  string version = 1;
  // The program the service runs from, as it started (the file may have
  // been replaced or removed since).
  string executable = 2;
  google.protobuf.Timestamp started = 3;
  // The service's process, so a client can stop one that isn't a login
  // item.
  int32 pid = 4;
  // The program file has been replaced or removed since the service
  // started (a new build or package installed): it runs the old program.
  bool replaced = 5;
}

// Request message for WorkspaceService.ListLogDays.
message ListLogDaysRequest {}

// Response message for WorkspaceService.ListLogDays.
message ListLogDaysResponse {
  // YYYY-MM-DD, newest first.
  repeated string days = 1;
  // Where the log files are ("" when logging is off).
  string dir = 2;
}

// Request message for WorkspaceService.ReadLog.
message ReadLogRequest {
  // YYYY-MM-DD; "" is the newest day.
  string day = 1;
  // debug, info, warn or error: that level and above ("" is all).
  string min_level = 2;
  // Records containing every word, in any field, ignoring case.
  string text = 3;
  // The most records returned (0: 500).
  int32 limit = 4;
}

// A field of a log record.
message LogAttr {
  string key = 1;
  // Strings as they are, other values as JSON.
  string value = 2;
}

// A log record.
message LogEntry {
  google.protobuf.Timestamp time = 1;
  // DEBUG, INFO, WARN or ERROR.
  string level = 2;
  string message = 3;
  // The record's other fields, in order.
  repeated LogAttr attrs = 4;
}

// Response message for WorkspaceService.ReadLog.
message ReadLogResponse {
  // The day read, and its file.
  string day = 1;
  string path = 2;
  // Newest first.
  repeated LogEntry entries = 3;
  // How many records matched (more than entries when the limit cut them).
  int32 matched = 4;
}

// Request message for WorkspaceService.DeleteLogDay.
message DeleteLogDayRequest {
  // YYYY-MM-DD.
  string day = 1;
}

// Response message for WorkspaceService.DeleteLogDay.
message DeleteLogDayResponse {}

// Request message for WorkspaceService.ListWorkspaces.
message ListWorkspacesRequest {}

// Response message for WorkspaceService.ListWorkspaces.
message ListWorkspacesResponse {
  // Absolute directories.
  repeated string workspaces = 1;
}

// Request message for WorkspaceService.CloseWorkspace.
message CloseWorkspaceRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.CloseWorkspace.
message CloseWorkspaceResponse {}

// Request message for WorkspaceService.GetSandbox.
message GetSandboxRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetSandbox.
message GetSandboxResponse {
  repeated string summary = 1;
}

// AgentInfo describes an agent.
message AgentInfo {
  string name = 1;
  string display_name = 2;
  string description = 3;
  bool active = 4;
  // The model it is pinned to; empty when it runs on the configured model.
  string pinned_model = 5;
}

// Request message for WorkspaceService.ListAgents.
message ListAgentsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListAgents.
message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

// Request message for WorkspaceService.SetAgent.
message SetAgentRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkspaceService.SetAgent.
message SetAgentResponse {
  AgentInfo agent = 1;
}

// SuggestionKind is what a welcome tile does. The state kinds carry data
// for the front end to word in its own language; IDEA carries text.
enum SuggestionKind {
  SUGGESTION_KIND_UNSPECIFIED = 0;
  // No agent instructions yet: run /setup in a new chat.
  SUGGESTION_KIND_SETUP = 1;
  // Pick up the latest conversation: open session_id (title is its title).
  SUGGESTION_KIND_CONTINUE = 2;
  // Uncommitted changes (count files): review them and propose a commit.
  SUGGESTION_KIND_CHANGES = 3;
  // A worker's latest run failed or hit a limit (worker, detail: why).
  SUGGESTION_KIND_WORKER_FAILED = 4;
  // A model's suggestion from the recent conversations: title on the tile,
  // prompt sent when it's chosen.
  SUGGESTION_KIND_IDEA = 5;
  // The specification (.agents/specs/) changed after the skills and agents:
  // run /skills update (then /agents update).
  SUGGESTION_KIND_HARNESS_UPDATE = 6;
}

// Suggestion is one welcome tile.
message Suggestion {
  SuggestionKind kind = 1;
  string title = 2;
  string prompt = 3;
  string session_id = 4;
  string worker = 5;
  int32 count = 6;
  string detail = 7;
}

// Request message for WorkspaceService.GetSuggestions.
message GetSuggestionsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetSuggestions.
message GetSuggestionsResponse {
  // State tiles first, then ideas; empty: the front end's own defaults.
  repeated Suggestion suggestions = 1;
  // No .agents/AGENTS.md, AGENTS.md, CLAUDE.md, GEMINI.md or BLITZ.md.
  bool harness_missing = 2;
  // Ideas are being written from newer conversations: ask again shortly.
  bool pending = 3;
}

// AgentScope is where an agent's file is kept.
enum AgentScope {
  AGENT_SCOPE_UNSPECIFIED = 0;
  // The workspace's .agents/agents.
  AGENT_SCOPE_WORKSPACE = 1;
  // The user's ~/.blitz/agents, for every workspace.
  AGENT_SCOPE_USER = 2;
}

// AgentDefinition is an agent's file: its frontmatter and its prompt.
message AgentDefinition {
  // Lowercase letters, digits, - and _.
  string name = 1;
  string display_name = 2;
  string description = 3;
  // The tools it may use, by name.
  repeated string tools = 4;
  // The model it runs on ("provider/" optional); empty: the configured one.
  string default_model = 5;
  // low, medium, high or extreme; empty: high.
  string agency_level = 6;
  // Its permission mode through invoke_agent; empty: the workspace's.
  string permission_mode = 7;
  // Its model calls through invoke_agent (0: the caller's budget).
  int32 max_turns = 8;
  bool background = 9;
  // "" or "worktree".
  string isolation = 10;
  // The model settings this agent runs with, over the model's own; unset
  // leaves the model's.
  optional double temperature = 11;
  optional double top_p = 12;
  optional int32 max_tokens = 13;
  // minimal, low, medium, high or max; empty: the model's.
  string effort = 14;
  optional int32 thinking_budget = 15;
  // The system prompt: the file's body.
  string prompt = 16;
}

// AgentFile is one agent file of a scope.
message AgentFile {
  string path = 1;
  // What the file defines; unset when it doesn't parse.
  AgentDefinition agent = 2;
  // Why it doesn't load ("" when it does).
  string problem = 3;
}

// Request message for WorkspaceService.ListAgentFiles.
message ListAgentFilesRequest {
  // Required for AGENT_SCOPE_WORKSPACE.
  string workspace = 1;
  AgentScope scope = 2;
}

// Response message for WorkspaceService.ListAgentFiles.
message ListAgentFilesResponse {
  // By file name.
  repeated AgentFile files = 1;
  // The scope's folder.
  string dir = 2;
}

// Request message for WorkspaceService.SaveAgentFile.
message SaveAgentFileRequest {
  string workspace = 1;
  AgentScope scope = 2;
  // The agent it replaces (a rename); empty for a new agent.
  string previous_name = 3;
  AgentDefinition agent = 4;
}

// Response message for WorkspaceService.SaveAgentFile.
message SaveAgentFileResponse {
  // The file written, unless there were problems.
  AgentFile file = 1;
  repeated string problems = 2;
}

// Request message for WorkspaceService.DeleteAgentFile.
message DeleteAgentFileRequest {
  string workspace = 1;
  AgentScope scope = 2;
  // The agent whose file goes.
  string name = 3;
  // Or the file itself, which must be one of the scope's (for a file that
  // doesn't parse, so names no agent).
  string path = 4;
}

// Response message for WorkspaceService.DeleteAgentFile.
message DeleteAgentFileResponse {}

// Request message for WorkspaceService.GetModel.
message GetModelRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetModel.
message GetModelResponse {
  string name = 1;
  // The configured provider.
  string provider = 2;
  // Why the configured model couldn't be built, if it couldn't; the
  // workspace then runs on a placeholder model.
  string unavailable = 3;
}

// Request message for WorkspaceService.SetModel.
message SetModelRequest {
  string workspace = 1;
  // A name or "provider/model".
  string ref = 2;
}

// Response message for WorkspaceService.SetModel.
message SetModelResponse {
  // The model the active agent is pinned to, which still applies to it;
  // empty if it isn't pinned.
  string active_pin = 1;
}

// Request message for WorkspaceService.PinModel.
message PinModelRequest {
  string workspace = 1;
  string agent = 2;
  string ref = 3;
}

// Response message for WorkspaceService.PinModel.
message PinModelResponse {
  string agent = 1;
  // The model the agent now runs on.
  string model = 2;
  Saved saved = 3;
}

// Request message for WorkspaceService.UnpinModel.
message UnpinModelRequest {
  string workspace = 1;
  string agent = 2;
}

// Response message for WorkspaceService.UnpinModel.
message UnpinModelResponse {
  string agent = 1;
  string model = 2;
  Saved saved = 3;
}

// ModelSettings are a model's generation settings; unset fields use the
// global value or the provider's default.
message ModelSettings {
  optional double temperature = 1;
  optional int32 max_tokens = 2;
  optional double top_p = 3;
  optional int32 seed = 4;
  // minimal, low, medium, high or max.
  optional string reasoning_effort = 5;
  // Tokens the model may spend thinking; 0 turns thinking off.
  optional int32 thinking_budget = 6;
}

// ModelSettingsInfo is one model's settings and what applies otherwise.
message ModelSettingsInfo {
  // Without a provider prefix.
  string model = 1;
  string provider = 2;
  ModelSettings settings = 3;
  // Apply when settings leaves them unset (0: the provider's default).
  double global_temperature = 4;
  int32 global_max_tokens = 5;
}

// Request message for WorkspaceService.GetModelSettings.
message GetModelSettingsRequest {
  string workspace = 1;
  // One model ("provider/" optional); empty for every model with settings.
  string ref = 2;
}

// Response message for WorkspaceService.GetModelSettings.
message GetModelSettingsResponse {
  // Every model with settings, by name (when ref is empty).
  map<string, ModelSettings> all = 1;
  // The requested model (when ref is set).
  ModelSettingsInfo model = 2;
}

// Setting is one key=value change; an empty value clears the key.
message Setting {
  string key = 1;
  string value = 2;
}

// Request message for WorkspaceService.UpdateModelSettings.
message UpdateModelSettingsRequest {
  string workspace = 1;
  string ref = 2;
  // Clear every setting before applying changes.
  bool reset = 3;
  repeated Setting changes = 4;
}

// Response message for WorkspaceService.UpdateModelSettings.
message UpdateModelSettingsResponse {
  ModelSettingsInfo model = 1;
  // Keys set that the provider or model ignores.
  repeated string unsupported = 2;
  Saved saved = 3;
}

// Request message for WorkspaceService.GetSettings.
message GetSettingsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetSettings.
message GetSettingsResponse {
  reserved 1, 2;
  reserved "puppy_name", "owner_name";
  string agency = 3;
  string model = 4;
  string provider = 5;
  string agent = 6;
  // The language the model replies in.
  string locale = 7;
  // Images can be attached to prompts.
  bool images_enabled = 8;
  // default, accept-edits, plan, dont-ask or bypass.
  string permission_mode = 9;
  // The session's reasoning effort (minimal … max), empty when unset.
  string effort = 10;
  // The output style in use ("default": none).
  string style = 11;
  // The speech model generate_audio reads aloud with ([audio] model,
  // "provider/model"; "" for none).
  string speech_model = 12;
  // Why the speech model can't be used ("" when it can, or there's none).
  string speech_error = 13;
  // What the active agent's model takes as attachments, for the front ends
  // to offer only those (LoadImage and AddImage refuse others,
  // UNSUPPORTED_MEDIA).
  repeated AcceptedMedia accepted_media = 14;
}

// AcceptedMedia is a kind of attachment a model takes.
message AcceptedMedia {
  // image, document (PDF), text, audio or video.
  string kind = 1;
  repeated string mime_types = 2;
  // The file name extensions of those types, with their dot.
  repeated string extensions = 3;
  // The largest file the model takes.
  int64 max_bytes = 4;
}

// Request message for WorkspaceService.SetPermissionMode.
message SetPermissionModeRequest {
  string workspace = 1;
  // default, accept-edits, plan, dont-ask or bypass (other spellings such
  // as acceptEdits are accepted).
  string mode = 2;
}

// Response message for WorkspaceService.SetPermissionMode.
message SetPermissionModeResponse {
  // The mode's canonical name.
  string mode = 1;
}

// Command is a custom slash command.
message Command {
  // Without the slash; may be namespaced ("db:migrate").
  string name = 1;
  string description = 2;
  string argument_hint = 3;
  // project, user, bundled or skill.
  string source = 4;
}

// Request message for WorkspaceService.ListCommands.
message ListCommandsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListCommands.
message ListCommandsResponse {
  repeated Command commands = 1;
}

// PermissionRule is an allow, ask or deny rule.
message PermissionRule {
  // allow, ask or deny.
  string effect = 1;
  // kind(pattern), e.g. shell(git push *), or a tool name.
  string rule = 2;
  // Where it comes from: global or workspace (the settings file it's
  // in), built-in (read_only_defaults), flag or session.
  string source = 3;
}

// Request message for WorkspaceService.ListPermissionRules.
message ListPermissionRulesRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListPermissionRules.
message ListPermissionRulesResponse {
  repeated PermissionRule rules = 1;
  // Why some of the settings' rules were left out when they last changed
  // (not enforced until fixed; the workspace won't open with them).
  string problem = 2;
}

// Request message for WorkspaceService.AddPermissionRule.
message AddPermissionRuleRequest {
  string workspace = 1;
  string effect = 2;
  string rule = 3;
  bool save = 4;
  // With save: "global" ("" too) or "workspace".
  string scope = 5;
}

// Response message for WorkspaceService.AddPermissionRule.
message AddPermissionRuleResponse {
  // The rule in canonical form.
  string rule = 1;
  // Saved, but only applies from the next start (read rules).
  bool next_start = 2;
  Saved saved = 3;
}

// Request message for WorkspaceService.RemovePermissionRule.
message RemovePermissionRuleRequest {
  string workspace = 1;
  string rule = 2;
  bool save = 3;
  // With save: "global" ("" too) or "workspace".
  string scope = 4;
}

// Response message for WorkspaceService.RemovePermissionRule.
message RemovePermissionRuleResponse {
  string rule = 1;
  // How many rules were removed.
  int32 removed = 2;
  Saved saved = 3;
}

// Request message for WorkspaceService.SetSetting.
message SetSettingRequest {
  string workspace = 1;
  // "agency".
  string key = 2;
  string value = 3;
}

// Response message for WorkspaceService.SetSetting.
message SetSettingResponse {
  // The key in canonical form.
  string key = 1;
}

// SkillInfo describes a skill and what the skills policy lets it do.
message SkillInfo {
  string name = 1;
  string description = 2;
  string version = 3;
  string license = 4;
  string category = 5;
  string compatibility = 6;
  repeated string tags = 7;
  // Identifies the content, for pinning it in the policy.
  string hash = 8;
  repeated SkillTool tools = 9;
  repeated SkillScript scripts = 10;
  // The approval tier the scripts run at; empty without scripts.
  string tier = 11;
  // The skill may skip approvals and the policy allows it.
  bool bypass = 12;
  // The scripts may use the network.
  bool network = 13;
  // The skill asks for the network (granted or not).
  bool needs_network = 14;
  // Host environment variables passed to the scripts, and those withheld.
  repeated string env = 15;
  repeated string withheld = 16;
  // Why none of the scripts may run.
  repeated string blocked = 17;
  // Its folder on disk ("" for a built-in skill).
  string dir = 18;
  // simple, references, scripts or meta, from its folder.
  string kind = 19;
  // The agents it's offered to (none: every one).
  repeated string agents = 20;
  // The skills a meta skill combines.
  repeated string members = 21;
  // Its files under references/, as references/<path>.
  repeated string references = 22;
  // The workspace's own: its folder is in the workspace.
  bool project = 23;
  // Its package files (requirements.txt, pyproject.toml, package.json),
  // as paths in its folder: the first of each kind gives its scripts
  // their packages.
  repeated string package_files = 24;
  // Its scripts, on disk, weren't reviewed and trusted with this content
  // (hash): new, changed, or a registry's. Each run asks first, until
  // ConfigService.TrustSkillScripts.
  bool needs_review = 25;
}

// SkillTool is a tool a skill needs.
message SkillTool {
  string name = 1;
  repeated string scopes = 2;
  string why = 3;
}

// SkillScript is one of a skill's scripts and the policy's verdict.
message SkillScript {
  string name = 1;
  string language = 2;
  // Its path in the skill, or "inline".
  string source = 3;
  google.protobuf.Duration timeout = 4;
  repeated string deps = 5;
  bool allowed = 6;
  repeated string reasons = 7;
  // Not declared, but found in scripts/.
  bool found = 8;
}

// Request message for WorkspaceService.ListSkills.
message ListSkillsRequest {
  string workspace = 1;
  // Only skills matching; empty for all.
  string query = 2;
}

// Response message for WorkspaceService.ListSkills.
message ListSkillsResponse {
  repeated SkillInfo skills = 1;
}

// Request message for WorkspaceService.GetSkill.
message GetSkillRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkspaceService.GetSkill.
message GetSkillResponse {
  SkillInfo skill = 1;
}

// What Studio's skill form edits.
message SkillSpec {
  // Its folder's name: lowercase letters, digits and single hyphens.
  string name = 1;
  string description = 2;
  // The tools it may use (allowed-tools), space-separated.
  string tools = 3;
  repeated string agents = 4;
  // The skills a meta skill combines.
  repeated string members = 5;
  string instructions = 6;
}

// A skill as Studio edits it.
message SkillFile {
  SkillInfo skill = 1;
  // Its SKILL.md.
  string path = 2;
  // SKILL.md's content hash, for SaveSkill ("" when not editable).
  string hash = 3;
  SkillSpec spec = 4;
  // The workspace's own: Studio may change it.
  bool editable = 5;
}

// Request message for WorkspaceService.GetSkillFile.
message GetSkillFileRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkspaceService.GetSkillFile.
message GetSkillFileResponse {
  SkillFile file = 1;
}

// Request message for WorkspaceService.SaveSkill.
message SaveSkillRequest {
  string workspace = 1;
  // The skill edited; empty for a new one.
  string previous_name = 2;
  // Its SKILL.md's hash when read.
  string hash = 3;
  SkillSpec skill = 4;
}

// Response message for WorkspaceService.SaveSkill.
message SaveSkillResponse {
  SkillFile file = 1;
  repeated string problems = 2;
}

// Request message for WorkspaceService.DeleteSkill.
message DeleteSkillRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkspaceService.DeleteSkill.
message DeleteSkillResponse {}

// Request message for WorkspaceService.ReadSkillFile.
message ReadSkillFileRequest {
  string workspace = 1;
  string name = 2;
  // Relative to the skill's folder.
  string path = 3;
}

// Response message for WorkspaceService.ReadSkillFile.
message ReadSkillFileResponse {
  bytes content = 1;
}

// Request message for WorkspaceService.WriteSkillFile.
message WriteSkillFileRequest {
  string workspace = 1;
  string name = 2;
  // references/… or scripts/…
  string path = 3;
  bytes content = 4;
}

// Response message for WorkspaceService.WriteSkillFile.
message WriteSkillFileResponse {
  SkillFile file = 1;
}

// Request message for WorkspaceService.DeleteSkillFile.
message DeleteSkillFileRequest {
  string workspace = 1;
  string name = 2;
  string path = 3;
}

// Response message for WorkspaceService.DeleteSkillFile.
message DeleteSkillFileResponse {
  SkillFile file = 1;
}

// Request message for WorkspaceService.CopySkill.
message CopySkillRequest {
  string workspace = 1;
  // The skill copied: any the workspace sees.
  string from = 2;
  // The copy's name.
  string name = 3;
}

// Response message for WorkspaceService.CopySkill.
message CopySkillResponse {
  SkillFile file = 1;
  repeated string problems = 2;
}

// Request message for WorkspaceService.RunSkillScript.
message RunSkillScriptRequest {
  string workspace = 1;
  string name = 2;
  string script = 3;
  repeated string args = 4;
}

// Response message for WorkspaceService.RunSkillScript.
message RunSkillScriptResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
  bool timed_out = 4;
  // The sandbox it ran in.
  string sandbox = 5;
  // Files it wrote to its output directory.
  repeated string output_files = 6;
  // Why it didn't run, or failed to.
  string error = 7;
}

// Env is an isolated Python environment built for skill scripts.
message Env {
  string key = 1;
  repeated string deps = 2;
  // The skills that used it.
  repeated string skills = 3;
  // Bytes on disk.
  int64 size = 4;
  google.protobuf.Timestamp last_used = 5;
  // Built completely.
  bool ready = 6;
}

// Request message for WorkspaceService.ListEnvs.
message ListEnvsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListEnvs.
message ListEnvsResponse {
  repeated Env envs = 1;
}

// Request message for WorkspaceService.RemoveEnv.
message RemoveEnvRequest {
  string workspace = 1;
  string key = 2;
}

// Response message for WorkspaceService.RemoveEnv.
message RemoveEnvResponse {}

// Request message for WorkspaceService.PruneEnvs.
message PruneEnvsRequest {
  string workspace = 1;
}

// EnvError is an environment that couldn't be removed.
message EnvError {
  string key = 1;
  string error = 2;
}

// Response message for WorkspaceService.PruneEnvs.
message PruneEnvsResponse {
  int32 removed = 1;
  // Bytes freed.
  int64 freed = 2;
  repeated EnvError failed = 3;
}

// MCPServer is a configured MCP server.
message MCPServer {
  string name = 1;
  // Its URL, or the command that starts it.
  string target = 2;
  bool auto_approve = 3;
  // Configured, but never started (disabled = true).
  bool disabled = 4;
  // "disabled", "idle" (its tools not listed yet), "connected" or
  // "failed" (error says why).
  string state = 5;
  string error = 6;
  // How many tools it offered when last listed.
  int32 tools = 7;
}

// Request message for WorkspaceService.ListMCPServers.
message ListMCPServersRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListMCPServers.
message ListMCPServersResponse {
  repeated MCPServer servers = 1;
}

// Request message for WorkspaceService.RestartMCPServer.
message RestartMCPServerRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkspaceService.RestartMCPServer.
message RestartMCPServerResponse {}

// ToolInfo is a tool an agent can call.
message ToolInfo {
  string name = 1;
  string description = 2;
  // Stays available in plan mode.
  bool plan_allowed = 3;
}

// MCPOffer is an MCP server offered to an agent.
message MCPOffer {
  string server = 1;
  // The tools offered; empty means all.
  repeated string tools = 2;
  // Prepended to tool names.
  string prefix = 3;
}

// Request message for WorkspaceService.ListTools.
message ListToolsRequest {
  string workspace = 1;
  // Every tool an agent can be given (for the agent editors), not only the
  // active agent's; agent and mcp are left empty.
  bool all = 2;
}

// Response message for WorkspaceService.ListTools.
message ListToolsResponse {
  string agent = 1;
  repeated ToolInfo tools = 2;
  repeated MCPOffer mcp = 3;
}

// Request message for WorkspaceService.ReloadMemory.
message ReloadMemoryRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ReloadMemory.
message ReloadMemoryResponse {
  repeated string paths = 1;
  // The file names looked for, in order.
  repeated string files = 2;
}

// Request message for WorkspaceService.ReloadAgentFiles.
message ReloadAgentFilesRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ReloadAgentFiles.
message ReloadAgentFilesResponse {
  // Agents loaded from files (built-in ones aside).
  int32 agents = 1;
  // Skills loaded from files (built-in ones aside).
  int32 skills = 2;
  // The instruction files and rules loaded.
  repeated string files = 3;
  // Files that didn't load, and why.
  repeated string problems = 4;
}

// Request message for WorkspaceService.AddMemory.
message AddMemoryRequest {
  string workspace = 1;
  string text = 2;
}

// Response message for WorkspaceService.AddMemory.
message AddMemoryResponse {
  string path = 1;
}

// LocaleInfo names a language with an interface catalog.
message LocaleInfo {
  string tag = 1;
  string name = 2;
}

// Request message for WorkspaceService.ListLocales.
message ListLocalesRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListLocales.
message ListLocalesResponse {
  repeated LocaleInfo locales = 1;
  // Where custom catalogs are read from; empty if none is configured.
  string custom_dir = 2;
}

// Request message for WorkspaceService.SetLocale.
message SetLocaleRequest {
  string workspace = 1;
  // A language tag or name.
  string input = 2;
}

// Response message for WorkspaceService.SetLocale.
message SetLocaleResponse {
  string tag = 1;
  // e.g. "Español".
  string native_name = 2;
  // In the new language's terms, e.g. "español".
  string language_name = 3;
  // The interface is translated; otherwise only replies are.
  bool has_catalog = 4;
  Saved saved = 5;
}

// Checkpoint is the files one turn changed.
message Checkpoint {
  int32 id = 1;
  string label = 2;
  google.protobuf.Timestamp time = 3;
  repeated string files = 4;
}

// Request message for WorkspaceService.ListCheckpoints.
message ListCheckpointsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListCheckpoints.
message ListCheckpointsResponse {
  repeated Checkpoint checkpoints = 1;
}

// Request message for WorkspaceService.Undo.
message UndoRequest {
  string workspace = 1;
  // Restore even files changed since the agent's edit.
  bool force = 2;
}

// Response message for WorkspaceService.Undo.
message UndoResponse {
  string label = 1;
  repeated string restored = 2;
  // Why the rest wasn't restored, after a partial restore.
  ErrorInfo error = 3;
}

// Request message for WorkspaceService.GetDiff.
message GetDiffRequest {
  string workspace = 1;
  // git's diff (stat and patch) instead of the agent's changes.
  bool git = 2;
  // Keep git's terminal colours.
  bool color = 3;
}

// Response message for WorkspaceService.GetDiff.
message GetDiffResponse {
  // A unified diff; empty when nothing changed.
  string diff = 1;
}

// Approval is a standing permission.
message Approval {
  // Identifies it for RevokeApprovals.
  string key = 1;
  // "cmd", "write", "delete", "web", "mcp", "uc-run", or a newer kind.
  string kind = 2;
  // The command, path, host or tool.
  string subject = 3;
  // The workspace a command approval is limited to.
  string dir = 4;
  // Saved for future sessions; otherwise it lasts until the service stops.
  bool always = 5;
  google.protobuf.Timestamp added = 6;
}

// Request message for WorkspaceService.ListApprovals.
message ListApprovalsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListApprovals.
message ListApprovalsResponse {
  repeated Approval approvals = 1;
}

// Request message for WorkspaceService.RevokeApprovals.
message RevokeApprovalsRequest {
  string workspace = 1;
  repeated string keys = 2;
  // Revoke every approval; keys is ignored.
  bool all = 3;
}

// Response message for WorkspaceService.RevokeApprovals.
message RevokeApprovalsResponse {
  int32 revoked = 1;
  // Saved approvals that couldn't be removed from the file
  // (APPROVALS_STILL_SAVED): revoked for now, back at the next start.
  ErrorInfo error = 2;
}

// Process is a background process the agent started, and how it is.
message Process {
  // The workspace's number for it.
  int32 id = 1;
  string command = 2;
  bool running = 3;
  // Once it has finished.
  int32 exit_code = 4;
  // How long it has run, or ran.
  int64 runtime_ms = 5;
}

// Request message for WorkspaceService.ListProcesses.
message ListProcessesRequest {
  string workspace = 1;
  // The sessions whose processes to list.
  repeated string session_ids = 2;
}

// Response message for WorkspaceService.ListProcesses.
message ListProcessesResponse {
  repeated Process processes = 1;
}

// Request message for WorkspaceService.GetProcessOutput.
message GetProcessOutputRequest {
  string workspace = 1;
  // The sessions the asking client ran turns in.
  repeated string session_ids = 2;
  int32 id = 3;
}

// Response message for WorkspaceService.GetProcessOutput.
message GetProcessOutputResponse {
  // Its output and errors as captured (the first part, when long).
  string output = 1;
  Process process = 2;
}

// Request message for WorkspaceService.KillProcess.
message KillProcessRequest {
  string workspace = 1;
  // The sessions the asking client ran turns in.
  repeated string session_ids = 2;
  int32 id = 3;
}

// Response message for WorkspaceService.KillProcess.
message KillProcessResponse {
  // How it is after the kill.
  Process process = 1;
}

// Request message for WorkspaceService.AuditShell.
message AuditShellRequest {
  string workspace = 1;
  string command = 2;
  int32 exit_code = 3;
  // Why it didn't start, if it didn't ("" when it ran).
  string start_error = 4;
}

// Response message for WorkspaceService.AuditShell.
message AuditShellResponse {}

// BackgroundTask is a sub-agent running beside the turn that started it.
message BackgroundTask {
  // task-1, task-2, … in the workspace.
  string id = 1;
  string agent = 2;
  // The first line of what it was asked.
  string prompt = 3;
  // The session whose turn started it.
  string session_id = 4;
  // running, done, failed or stopped.
  string state = 5;
  google.protobuf.Timestamp started = 6;
  // Unset while it runs.
  google.protobuf.Timestamp ended = 7;
  // What it answered, when done.
  string result = 8;
  // Why it failed or stopped.
  string error = 9;
  // Its own tokens and cost (also counted in its session's).
  Usage usage = 10;
  // Its own git worktree and branch, when it ran isolated in one.
  string worktree = 11;
  string branch = 12;
}

// Request message for WorkspaceService.ListTasks.
message ListTasksRequest {
  string workspace = 1;
  // The sessions whose tasks to list.
  repeated string session_ids = 2;
}

// Response message for WorkspaceService.ListTasks.
message ListTasksResponse {
  repeated BackgroundTask tasks = 1;
}

// Request message for WorkspaceService.GetTask.
message GetTaskRequest {
  string workspace = 1;
  // The sessions the asking client ran turns in.
  repeated string session_ids = 2;
  string id = 3;
}

// Response message for WorkspaceService.GetTask.
message GetTaskResponse {
  BackgroundTask task = 1;
  // Its latest events, in words (the last 200).
  repeated string events = 2;
}

// Request message for WorkspaceService.StopTask.
message StopTaskRequest {
  string workspace = 1;
  // The sessions the asking client ran turns in.
  repeated string session_ids = 2;
  string id = 3;
}

// TaskEvent is something that happened to a background task outside a
// turn.
message TaskEvent {
  oneof kind {
    // Started, waiting for an answer, running again, or ended.
    BackgroundTask task = 1;
    // Waits for Approve.
    ApprovalRequest approval_request = 2;
    // Waits for Answer.
    Question question = 3;
    // A request that no longer waits (answered, or its task ended).
    string resolved = 4;
    // Sent once, after the active tasks and waiting requests: changes
    // follow.
    bool ready = 5;
    // The workspace's permission rules or remembered approvals changed
    // (their files were edited, by anyone): views of them should refresh.
    bool settings_changed = 6;
  }
}

// Request message for WorkspaceService.WatchTasks.
message WatchTasksRequest {
  string workspace = 1;
  // The sessions whose tasks to follow.
  repeated string session_ids = 2;
}

// Response message for WorkspaceService.WatchTasks.
message WatchTasksResponse {
  TaskEvent event = 1;
}

// Request message for WorkspaceService.ListTaskRequests.
message ListTaskRequestsRequest {
  string workspace = 1;
  repeated string session_ids = 2;
}

// Response message for WorkspaceService.ListTaskRequests.
message ListTaskRequestsResponse {
  // Each an approval_request or a question.
  repeated TaskEvent requests = 1;
}

// Response message for WorkspaceService.StopTask.
message StopTaskResponse {
  // How it is once stopped.
  BackgroundTask task = 1;
}

// ProjectItem is one setting from a project file.
message ProjectItem {
  // The file, relative to the workspace.
  string file = 1;
  // deny, ask, blocked_path, limit, skill_policy, worker_limit (applied);
  // hook, mcp, allow, writable, model, agent_model, worker_allow,
  // skill_scripts (needing trust); setting (another key).
  string kind = 2;
  // The hook's event, the server's, agent's or skill's name, or the key.
  string key = 3;
  // The rule, command, path, model or number.
  string value = 4;
  // Why it was ignored: never, unknown, not_stricter, outside, provider,
  // user_set.
  string reason = 5;
}

// ProjectSettings are what a workspace's project files say.
message ProjectSettings {
  // The files found, relative to the workspace.
  repeated string files = 1;
  // The trust decision for the content as it is now: none, new, changed,
  // trusted, declined.
  string state = 2;
  // Identifies the content needing trust; TrustProject takes it back.
  string hash = 3;
  // The settings needing trust are in force.
  bool loaded = 4;
  // In force without trust: they only tighten.
  repeated ProjectItem applied = 5;
  // Needing trust: they run code or loosen a policy.
  repeated ProjectItem pending = 6;
  // Not taken from a project, or changing nothing.
  repeated ProjectItem ignored = 7;
  // Files that couldn't be read.
  repeated string problems = 8;
}

// Request message for WorkspaceService.GetProjectSettings.
message GetProjectSettingsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetProjectSettings.
message GetProjectSettingsResponse {
  ProjectSettings settings = 1;
}

// Request message for WorkspaceService.TakeProcessNotices.
message TakeProcessNoticesRequest {
  string workspace = 1;
  string session_id = 2;
}

// Response message for WorkspaceService.TakeProcessNotices.
message TakeProcessNoticesResponse {
  repeated string notices = 1;
}

// Style is an output style.
message Style {
  string name = 1;
  string description = 2;
  // "built-in", or the style's file.
  string source = 3;
  bool active = 4;
}

// Request message for WorkspaceService.ListStyles.
message ListStylesRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListStyles.
message ListStylesResponse {
  repeated Style styles = 1;
}

// Hook is a configured hook.
message Hook {
  string event = 1;
  // command, http or prompt.
  string type = 2;
  // The tool-name glob, for tool events.
  string match = 3;
  // The permission rule calls must match.
  string if = 4;
  // What it runs: the command, POST <url>, or prompt: <text>.
  string runs = 5;
  // The project file it came from; empty for the user's own settings.
  string source = 6;
  bool fail_closed = 7;
  // Its latest failed runs since the workspace opened.
  repeated HookFailure failures = 8;
}

// HookFailure is one failed run of a hook.
message HookFailure {
  google.protobuf.Timestamp time = 1;
  string error = 2;
}

// Request message for WorkspaceService.ListHooks.
message ListHooksRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListHooks.
message ListHooksResponse {
  repeated Hook hooks = 1;
}

// Note is something the agent remembered across sessions of a workspace.
message Note {
  // Its name, to forget it.
  string name = 1;
  // fact, preference or correction.
  string kind = 2;
  string text = 3;
  google.protobuf.Timestamp time = 4;
  // Its file, on the service's machine.
  string path = 5;
}

// Request message for WorkspaceService.ListNotes.
message ListNotesRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListNotes.
message ListNotesResponse {
  repeated Note notes = 1;
}

// Request message for WorkspaceService.ForgetNote.
message ForgetNoteRequest {
  string workspace = 1;
  // The note's name, or the start of it when only one note's starts so.
  string name = 2;
}

// Response message for WorkspaceService.ForgetNote.
message ForgetNoteResponse {}

// Request message for WorkspaceService.ForgetProjectTrust.
message ForgetProjectTrustRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ForgetProjectTrust.
message ForgetProjectTrustResponse {
  // The workspace was reopened without the settings; false when a turn
  // was running (it takes effect when the workspace next opens).
  bool reopened = 1;
}

// Request message for WorkspaceService.TrustProject.
message TrustProjectRequest {
  string workspace = 1;
  // The hash of the content shown.
  string hash = 2;
  // Trust it, or decline it.
  bool trusted = 3;
}

// Response message for WorkspaceService.TrustProject.
message TrustProjectResponse {
  // The workspace was reopened with the decision; false when a turn was
  // running in it: it applies the next time the workspace opens.
  bool reopened = 1;
}

// Image is an image or a PDF stored for a prompt.
message Image {
  // For Turn.image_ids: the SHA-256 of the data.
  string id = 1;
  string name = 2;
  string mime_type = 3;
  int32 width = 4;
  int32 height = 5;
  // Bytes, after any resizing.
  int64 size = 6;
  // Scaled down to fit the model's limits.
  bool resized = 7;
  // A PDF's page count (mime_type application/pdf); 0 for a picture.
  int32 pages = 8;
  // image, document, text, audio or video.
  string kind = 9;
  // The length of audio or video, when its header gives it; 0 otherwise.
  double seconds = 10;
}

// Request message for WorkspaceService.LoadImage.
message LoadImageRequest {
  string workspace = 1;
  // Relative to the workspace.
  string path = 2;
}

// Response message for WorkspaceService.LoadImage.
message LoadImageResponse {
  Image image = 1;
}

// Request message for WorkspaceService.AddImage.
message AddImageRequest {
  string workspace = 1;
  string name = 2;
  bytes data = 3;
}

// Response message for WorkspaceService.AddImage.
message AddImageResponse {
  Image image = 1;
}

// Link is a search result handed to the agent.
message Link {
  string title = 1;
  string url = 2;
}

// Request message for WorkspaceService.GetSearchProvider.
message GetSearchProviderRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetSearchProvider.
message GetSearchProviderResponse {
  string provider = 1;
}

// Request message for WorkspaceService.SearchWeb.
message SearchWebRequest {
  string workspace = 1;
  string terms = 2;
}

// Response message for WorkspaceService.SearchWeb.
message SearchWebResponse {
  // The provider searched.
  string provider = 1;
  // None: nothing worth handing over.
  repeated Link links = 2;
  string prompt = 3;
}

// Request message for WorkspaceService.SearchWorkspace.
message SearchWorkspaceRequest {
  string workspace = 1;
  // Words and "quoted phrases".
  string query = 2;
  // files, documents, chats, notes; none: the search.sources setting.
  repeated string sources = 3;
  // 0: 20.
  int32 limit = 4;
  // keyword, semantic or hybrid; "": hybrid with an embedding model, else
  // keyword (NO_EMBEDDINGS, UNKNOWN_SEARCH_MODE).
  string mode = 5;
  // Include hidden items: dotfiles, files git ignores (the desktop app
  // asks for them when it shows hidden files).
  bool hidden = 6;
}

// SearchHit is one item workspace search found.
message SearchHit {
  // files, documents, chats or notes.
  string source = 1;
  // A path relative to the workspace (files, documents, plans), a
  // session's ID (chats) or a note's name.
  string ref = 2;
  string title = 3;
  // The passage's line in the item's text (1-based).
  int32 line = 4;
  // What the passage is in: a PDF's page, a notebook's cell.
  string section = 5;
  // The lines around the match.
  string snippet = 6;
  double score = 7;
  // What a model wrote of the item (search.enrich), if it has.
  string summary = 8;
  repeated string tags = 9;
}

// Response message for WorkspaceService.SearchWorkspace.
message SearchWorkspaceResponse {
  // Best first, one per item.
  repeated SearchHit hits = 1;
  // The sources searched.
  repeated string sources = 2;
}

// Request message for WorkspaceService.GetSearchStatus.
message GetSearchStatusRequest {
  string workspace = 1;
}

// SearchStatus is how a workspace's search index is.
message SearchStatus {
  // Search is on (search.enabled).
  bool enabled = 1;
  // Items indexed, by source.
  map<string, int32> items = 2;
  // A scan is running.
  bool scanning = 3;
  // When the last scan finished.
  google.protobuf.Timestamp last_scan = 4;
  // Items that couldn't be read.
  int32 unreadable = 5;
  string error = 6;
  // Semantic search's embedding model ("": off).
  string embedding_model = 7;
  // Chunks with vectors.
  int32 embedded = 8;
  // Why embedding stopped (the next scan tries again).
  string embed_error = 9;
  // Items with a summary (search.enrich), and why describing stopped.
  int32 enriched = 10;
  string enrich_error = 11;
  // The [search] settings followed, even with search off.
  SearchSettings settings = 12;
  // What kept them from applying in full (an embedding model or describer
  // that couldn't be built, an index that couldn't open).
  string problem = 13;
}

// SearchSettings are a workspace's [search] settings (set with
// ConfigService.SetConfigValue: search.enabled, search.sources, …).
message SearchSettings {
  bool enabled = 1;
  repeated string sources = 2;
  string embedding_model = 3;
  bool enrich = 4;
  string enrich_model = 5;
  int32 enrich_daily_limit = 6;
  bool include_ignored = 7;
}

// Response message for WorkspaceService.GetSearchStatus.
message GetSearchStatusResponse {
  SearchStatus status = 1;
}

// Request message for WorkspaceService.Reindex.
message ReindexRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.Reindex.
message ReindexResponse {}

// Request message for WorkspaceService.GetGitStatus.
message GetGitStatusRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetGitStatus.
message GetGitStatusResponse {
  bool repo = 1;
  // The branch, or the short commit when detached.
  string branch = 2;
  // Files that differ from HEAD, untracked ones included.
  int32 changed = 3;
  // Git is on the service's PATH (else repo is false).
  bool git = 4;
  // The repository has a remote.
  bool remote = 5;
  // The branch's upstream, such as "origin/main"; empty when it has none.
  string upstream = 6;
  // Commits the branch has that the upstream hasn't, as of the last fetch.
  int32 ahead = 7;
  // Commits the upstream has that the branch hasn't, as of the last fetch.
  int32 behind = 8;
  // A merge or rebase in progress (a pull that stopped on conflicts).
  GitOperation operation = 9;
  // The files still in conflict, workspace-relative with "/".
  repeated string conflicts = 10;
  // The branch a merge in progress brings in, such as "feature" or
  // "origin/main" (empty when none, or when git can't name it).
  string merging = 11;
}

// What a repository is in the middle of.
enum GitOperation {
  // Nothing: no merge or rebase in progress.
  GIT_OPERATION_UNSPECIFIED = 0;
  // A merge, to complete (a merge commit) or abort.
  GIT_OPERATION_MERGE = 1;
  // A rebase, to continue or abort.
  GIT_OPERATION_REBASE = 2;
}

// Request message for WorkspaceService.InitGitRepo.
message InitGitRepoRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.InitGitRepo.
message InitGitRepoResponse {
  // The repository's git status, after git init.
  GetGitStatusResponse status = 1;
}

// A file in the index, for the commit dialog.
message StagedFile {
  // Git's status letter: A, M, D, T, …
  string status = 1;
  // Workspace-relative, with "/".
  string path = 2;
}

// Request message for WorkspaceService.DraftCommit.
message DraftCommitRequest {
  string workspace = 1;
  // Stage every change first (git add --all).
  bool stage_all = 2;
}

// Response message for WorkspaceService.DraftCommit.
message DraftCommitResponse {
  // What's staged; none means nothing to commit.
  repeated StagedFile files = 1;
  // The drafted message ("" with problem set when the model failed).
  string message = 2;
  // Why there's no draft.
  string problem = 3;
}

// Request message for WorkspaceService.Commit.
message CommitRequest {
  string workspace = 1;
  string message = 2;
}

// Response message for WorkspaceService.Commit.
message CommitResponse {
  // The new commit's short hash.
  string hash = 1;
  // Its message's first line.
  string subject = 2;
}

// Request message for WorkspaceService.FetchRemote.
message FetchRemoteRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.FetchRemote.
message FetchRemoteResponse {
  // The git status after the fetch.
  GetGitStatusResponse status = 1;
}

// Request message for WorkspaceService.Pull.
message PullRequest {
  string workspace = 1;
}

// How a pull went.
enum PullOutcome {
  PULL_OUTCOME_UNSPECIFIED = 0;
  // Nothing new.
  PULL_OUTCOME_UP_TO_DATE = 1;
  // The branch moved to the upstream's commit.
  PULL_OUTCOME_FAST_FORWARD = 2;
  // A merge commit joined the two.
  PULL_OUTCOME_MERGED = 3;
  // The branch's commits were replayed on the upstream's.
  PULL_OUTCOME_REBASED = 4;
  // Stopped on conflicts: a merge or rebase waits (status.conflicts).
  PULL_OUTCOME_CONFLICTS = 5;
}

// Response message for WorkspaceService.Pull.
message PullResponse {
  PullOutcome outcome = 1;
  // Commits brought in from the upstream.
  int32 commits = 2;
  // The git status after the pull.
  GetGitStatusResponse status = 3;
}

// Request message for WorkspaceService.Push.
message PushRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.Push.
message PushResponse {
  // Where it pushed, as "remote/branch".
  string target = 1;
  // The git status after the push.
  GetGitStatusResponse status = 2;
}

// How a conflicted file is settled.
enum ConflictChoice {
  CONFLICT_CHOICE_UNSPECIFIED = 0;
  // The branch's version, from before the pull.
  CONFLICT_CHOICE_MINE = 1;
  // The upstream's version.
  CONFLICT_CHOICE_THEIRS = 2;
  // As edited by hand (refused while conflict markers remain).
  CONFLICT_CHOICE_RESOLVED = 3;
}

// Request message for WorkspaceService.ResolveConflict.
message ResolveConflictRequest {
  string workspace = 1;
  // The file, workspace-relative.
  string path = 2;
  ConflictChoice choice = 3;
}

// Response message for WorkspaceService.ResolveConflict.
message ResolveConflictResponse {
  // The git status after it.
  GetGitStatusResponse status = 1;
}

// Request message for WorkspaceService.CompleteMerge.
message CompleteMergeRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.CompleteMerge.
message CompleteMergeResponse {
  // The git status after it: a rebase may have stopped on new conflicts.
  GetGitStatusResponse status = 1;
}

// Request message for WorkspaceService.AbortMerge.
message AbortMergeRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.AbortMerge.
message AbortMergeResponse {
  // The git status after it.
  GetGitStatusResponse status = 1;
}

// A branch the workspace can switch to or merge.
message Branch {
  // Its short name: "main", or "origin/feature" for a remote's.
  string name = 1;
  // A remote's branch no local branch tracks: switching to it makes one.
  bool remote = 2;
  // The branch checked out.
  bool current = 3;
  // A local branch's upstream, such as "origin/main".
  string upstream = 4;
  // Its last commit's subject.
  string subject = 5;
  // Its last commit's time.
  google.protobuf.Timestamp time = 6;
}

// Request message for WorkspaceService.ListBranches.
message ListBranchesRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListBranches.
message ListBranchesResponse {
  repeated Branch branches = 1;
}

// Request message for WorkspaceService.SwitchBranch.
message SwitchBranchRequest {
  string workspace = 1;
  // A branch's name as ListBranches gives it.
  string branch = 2;
}

// Response message for WorkspaceService.SwitchBranch.
message SwitchBranchResponse {
  // The git status after it.
  GetGitStatusResponse status = 1;
}

// Request message for WorkspaceService.CreateBranch.
message CreateBranchRequest {
  string workspace = 1;
  // The new branch's name.
  string branch = 2;
}

// Response message for WorkspaceService.CreateBranch.
message CreateBranchResponse {
  // The git status after it, on the new branch.
  GetGitStatusResponse status = 1;
}

// Request message for WorkspaceService.MergeBranch.
message MergeBranchRequest {
  string workspace = 1;
  // The branch to merge into the current one, as ListBranches names it.
  string branch = 2;
}

// Response message for WorkspaceService.MergeBranch.
message MergeBranchResponse {
  // UP_TO_DATE, FAST_FORWARD, MERGED or CONFLICTS (never REBASED).
  PullOutcome outcome = 1;
  // Commits brought in from the branch.
  int32 commits = 2;
  // The git status after the merge.
  GetGitStatusResponse status = 3;
}

// Request message for WorkspaceService.DraftManifest.
message DraftManifestRequest {
  string workspace = 1;
  // agent, skill, script, rule, guardrail, eval or workflow_step.
  string kind = 2;
  string name = 3;
  string description = 4;
  // The text now; empty to write it afresh.
  string current = 5;
  // What the user asks; empty to improve it.
  string request = 6;
  // A script's language (python or typescript).
  string language = 7;
}

// Response message for WorkspaceService.DraftManifest.
message DraftManifestResponse {
  string text = 1;
  // What was written or changed and why, a line each.
  repeated string changes = 2;
  // Why there's no draft (the model failed); the user's text stands.
  string problem = 3;
}

// A rule file: a gate (when set) or an instruction rule.
message RuleFile {
  // Its path in the rule folder, without .md.
  string name = 1;
  string path = 2;
  // before_agent or after_agent for a gate; empty for an instruction
  // rule.
  string when = 3;
  // block, warn or revise (a gate).
  string action = 4;
  int32 order = 5;
  // The agents it gates (none: every one).
  repeated string agents = 6;
  string description = 7;
  // The files an instruction rule is scoped to.
  repeated string paths = 8;
  string text = 9;
  // Why its front matter doesn't hold (it's skipped).
  string problem = 10;
  // In .agents/rules: Studio may change it.
  bool editable = 11;
}

// What Studio's rule form edits.
message RuleSpec {
  string name = 1;
  string when = 2;
  string action = 3;
  int32 order = 4;
  repeated string agents = 5;
  string description = 6;
  repeated string paths = 7;
  string text = 8;
}

// Request message for WorkspaceService.ListRules.
message ListRulesRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListRules.
message ListRulesResponse {
  repeated RuleFile rules = 1;
  // Where new rules are written (.agents/rules).
  string dir = 2;
}

// Request message for WorkspaceService.SaveRule.
message SaveRuleRequest {
  string workspace = 1;
  string previous_name = 2;
  RuleSpec rule = 3;
}

// Response message for WorkspaceService.SaveRule.
message SaveRuleResponse {
  RuleFile rule = 1;
  repeated string problems = 2;
}

// Request message for WorkspaceService.DeleteRule.
message DeleteRuleRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkspaceService.DeleteRule.
message DeleteRuleResponse {}

// Request message for WorkspaceService.ReorderRules.
message ReorderRulesRequest {
  string workspace = 1;
  repeated string names = 2;
}

// Response message for WorkspaceService.ReorderRules.
message ReorderRulesResponse {}

// Request message for WorkspaceService.TryRule.
message TryRuleRequest {
  string workspace = 1;
  RuleSpec rule = 2;
  // A prompt (before-agent) or an answer (after-agent).
  string sample = 3;
}

// Response message for WorkspaceService.TryRule.
message TryRuleResponse {
  bool pass = 1;
  string reason = 2;
  // Why it couldn't be judged.
  string problem = 3;
}

// The limits guardrail's limits; zero or empty means none of that kind.
message GuardrailLimits {
  double max_cost_usd = 1;
  int32 max_turns = 2;
  int32 max_files_changed = 3;
  repeated string allowed_domains = 4;
  // Shell commands not to run (globs over the whole command).
  repeated string commands = 5;
}

// A guardrail file, or a built-in guardrail without one (its defaults).
message GuardrailFile {
  // Its file's name without .md (a built-in's is its id).
  string name = 1;
  // Empty for a built-in guardrail running with its defaults.
  string path = 2;
  // prompt_injection, secrets or limits; empty for a custom one.
  string builtin = 3;
  // input, tool_result, output or action.
  string stage = 4;
  // block, warn or redact.
  string action = 5;
  repeated string agents = 6;
  // The tools a tool-result or action guardrail checks.
  repeated string tools = 7;
  string description = 8;
  // The secrets guardrail masks personal data too.
  bool pii = 9;
  // The injection guardrail confirms with the judge.
  bool judge = 10;
  GuardrailLimits limits = 11;
  // A custom guardrail's check.
  string text = 12;
  string problem = 13;
  // In .agents/guardrails, or a built-in one's defaults: Studio may
  // change it.
  bool editable = 14;
  // Switched off (enabled: false).
  bool off = 15;
}

// A built-in guardrail: on by default.
message BuiltinGuardrail {
  string id = 1;
  string stage = 2;
  string default_action = 3;
  repeated string actions = 4;
  // As it runs: its file, or its defaults (no path).
  GuardrailFile file = 5;
}

// What Studio's guardrail form edits.
message GuardrailSpec {
  string name = 1;
  string builtin = 2;
  string stage = 3;
  string action = 4;
  repeated string agents = 5;
  repeated string tools = 6;
  string description = 7;
  bool pii = 8;
  bool judge = 9;
  GuardrailLimits limits = 10;
  string text = 11;
  // Switches it off, keeping its settings.
  bool off = 12;
}

// Request message for WorkspaceService.ListGuardrails.
message ListGuardrailsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListGuardrails.
message ListGuardrailsResponse {
  repeated BuiltinGuardrail builtins = 1;
  repeated GuardrailFile guardrails = 2;
  // Where new guardrails are written (.agents/guardrails).
  string dir = 3;
}

// Request message for WorkspaceService.SaveGuardrail.
message SaveGuardrailRequest {
  string workspace = 1;
  string previous_name = 2;
  GuardrailSpec guardrail = 3;
}

// Response message for WorkspaceService.SaveGuardrail.
message SaveGuardrailResponse {
  GuardrailFile guardrail = 1;
  repeated string problems = 2;
}

// Request message for WorkspaceService.DeleteGuardrail.
message DeleteGuardrailRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkspaceService.DeleteGuardrail.
message DeleteGuardrailResponse {}

// Request message for WorkspaceService.TryGuardrail.
message TryGuardrailRequest {
  string workspace = 1;
  GuardrailSpec guardrail = 2;
  string sample = 3;
}

// Response message for WorkspaceService.TryGuardrail.
message TryGuardrailResponse {
  bool pass = 1;
  string reason = 2;
  string problem = 3;
}

// A row of an eval's table.
message EvalCase {
  string id = 1;
  string name = 2;
  string prompt = 3;
  // The output expected.
  string output = 4;
  // exact or near.
  string type = 5;
  // A near case's threshold, above 0 and up to 1.
  double threshold = 6;
  // fail, warn or info.
  string scope = 7;
}

// An eval file in .agents/evals.
message EvalFile {
  string name = 1;
  string path = 2;
  string description = 3;
  repeated string agents = 4;
  repeated string skills = 5;
  // judge or embedding.
  string near = 6;
  // network or mcp.
  repeated string allow = 7;
  repeated EvalCase cases = 8;
  string problem = 9;
  // Its last run, if any (without its results).
  EvalRun last_run = 10;
}

// What Studio's eval form edits.
message EvalSpec {
  string name = 1;
  string description = 2;
  repeated string agents = 3;
  repeated string skills = 4;
  string near = 5;
  repeated string allow = 6;
  repeated EvalCase cases = 7;
}

// One case run by one agent, and its score.
message EvalResult {
  string case = 1;
  string name = 2;
  string agent = 3;
  string type = 4;
  string scope = 5;
  // pass; fail, warn or info (the case's scope) when it didn't pass; or
  // error when it couldn't be run or scored.
  string status = 6;
  double score = 7;
  double threshold = 8;
  string prompt = 9;
  string expected = 10;
  string output = 11;
  string reason = 12;
  // Actions the eval didn't allow, as "tool: detail".
  repeated string refusals = 13;
  double cost_usd = 14;
  google.protobuf.Duration duration = 15;
}

// A run of an eval.
message EvalRun {
  string id = 1;
  string eval = 2;
  google.protobuf.Timestamp started = 3;
  google.protobuf.Duration duration = 4;
  // running, passed, failed or stopped.
  string status = 5;
  repeated EvalResult results = 6;
  double cost_usd = 7;
  string error = 8;
  // The results by status (pass, fail, warn, info, error).
  map<string, int32> counts = 9;
}

// Request message for WorkspaceService.ListEvals.
message ListEvalsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListEvals.
message ListEvalsResponse {
  repeated EvalFile evals = 1;
  // .agents/evals.
  string dir = 2;
}

// Request message for WorkspaceService.SaveEval.
message SaveEvalRequest {
  string workspace = 1;
  // The eval edited; empty for a new one.
  string previous_name = 2;
  EvalSpec eval = 3;
}

// Response message for WorkspaceService.SaveEval.
message SaveEvalResponse {
  EvalFile eval = 1;
  repeated string problems = 2;
}

// Request message for WorkspaceService.DeleteEval.
message DeleteEvalRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkspaceService.DeleteEval.
message DeleteEvalResponse {}

// Request message for WorkspaceService.RunEval.
message RunEvalRequest {
  string workspace = 1;
  string name = 2;
  // The case IDs to run; none: every case.
  repeated string cases = 3;
}

// Response message for WorkspaceService.RunEval: the run as it starts,
// each result, then the finished run.
message RunEvalResponse {
  oneof event {
    EvalRun started = 1;
    EvalResult result = 2;
    EvalRun finished = 3;
  }
}

// Request message for WorkspaceService.ListEvalRuns.
message ListEvalRunsRequest {
  string workspace = 1;
  string name = 2;
  // At most this many (0: 20).
  int32 limit = 3;
}

// Response message for WorkspaceService.ListEvalRuns.
message ListEvalRunsResponse {
  repeated EvalRun runs = 1;
}

// Request message for WorkspaceService.DraftEvalCases.
message DraftEvalCasesRequest {
  string workspace = 1;
  string agent = 2;
  // What to draft cases for (optional).
  string request = 3;
  // The cases the eval has, not to repeat.
  repeated EvalCase existing = 4;
}

// Response message for WorkspaceService.DraftEvalCases.
message DraftEvalCasesResponse {
  repeated EvalCase cases = 1;
  string problem = 2;
}

// A workflow's step.
message FlowNode {
  string id = 1;
  // agent, refine, summarize, accumulate, browser, script, read_file,
  // save_file; email and data are shown, not run yet.
  string type = 2;
  string title = 3;
  // Where it sits on the canvas.
  double x = 4;
  double y = 5;
  // The agent an agent, refine, summarize or browser step runs (empty:
  // the active one).
  string agent = 6;
  repeated string skills = 7;
  // What it's to do (a browser step's goal; a summary's focus).
  string instructions = 8;
  // Rules its output must pass, beyond the gates every turn has.
  repeated string rules = 9;
  // A script step's skill, script and arguments.
  string skill = 10;
  string script = 11;
  repeated string args = 12;
  // A read_file or save_file step's file, in the workspace.
  string path = 13;
  // What an extract step pulls out.
  repeated FlowField fields = 14;
  // Tries in all when it fails (0 or 1: once), the first wait (a Go
  // duration, doubled each time), and the most it may take.
  int32 retry_attempts = 15;
  string retry_delay = 16;
  string timeout = 17;
  // An MCP call's server, tool and arguments (a JSON object; string
  // values take templates).
  string server = 18;
  string tool = 19;
  string arguments_json = 20;
  // An API call's URL (an A2A call's: where its agent card is), method,
  // query, headers, body (text) or JSON body (JSON), and auth. Values
  // take templates and {secrets:key}.
  string url = 21;
  string method = 22;
  repeated FlowPair query = 23;
  repeated FlowPair headers = 24;
  string body = 25;
  string json_body = 26;
  FlowAuth auth = 27;
  // The workflow a call step runs.
  string workflow = 28;
  // Runs the step once per item of this list (a CEL expression), so many
  // at a time (0: 4).
  string for_each = 29;
  int32 concurrency = 30;
  // A human task's form: A2UI v0.9 ({"components": [...], "data": {...}}).
  string form_json = 31;
  // How long a timer waits (a Go duration), or until when (RFC 3339).
  string wait = 32;
  string until = 33;
}

// A paused workflow run's task: a human task's form waiting for an
// answer, or a timer waiting for its time.
message HumanTask {
  // Answer with it.
  string id = 1;
  string run = 2;
  string workspace = 3;
  string workflow = 4;
  string step = 5;
  string title = 6;
  // human_task or timer.
  string kind = 7;
  // What's shown above the form.
  string message = 8;
  // The form as A2UI v0.9 server-to-client messages, any A2UI renderer's
  // to draw: a JSON array of createSurface (the surface's ID is the
  // task's), updateComponents and updateDataModel, its templates filled
  // from the run as the step started.
  string a2ui_json = 9;
  google.protobuf.Timestamp fire_at = 10;
  google.protobuf.Timestamp created = 11;
  // The chat its run's agent steps are turns in.
  string session_id = 12;
}

// Request message for WorkspaceService.ListHumanTasks.
message ListHumanTasksRequest {
  // Empty: every workspace's.
  string workspace = 1;
}

// Response message for WorkspaceService.ListHumanTasks.
message ListHumanTasksResponse {
  repeated HumanTask tasks = 1;
  // How a waiting task reaches the user with no window open ([ui]
  // task_alerts): notify, open or off.
  string alerts = 2;
}

// Request message for WorkspaceService.AnswerHumanTask.
message AnswerHumanTaskRequest {
  string workspace = 1;
  string task_id = 2;
  // A2UI v0.9's client-to-server action message, from one of the form's
  // buttons: {"version": "v0.9", "action": {"name", "surfaceId",
  // "sourceComponentId", "timestamp", "context"}}.
  string action_json = 3;
  // The surface's data model as the client had it (a JSON object; empty:
  // the form's own, with the action's values), on which every check of
  // the form must pass.
  string data_json = 4;
}

// Response message for WorkspaceService.AnswerHumanTask.
message AnswerHumanTaskResponse {
  // The run, resumed in the background.
  BackgroundRun run = 1;
}

// A named value: a header, a query parameter.
message FlowPair {
  string name = 1;
  string value = 2;
}

// How an API call authenticates.
message FlowAuth {
  // bearer, basic, api_key or oauth2 (client credentials).
  string type = 1;
  string token = 2;
  string username = 3;
  string password = 4;
  // An API key's name, value, and where it goes (header or query).
  string name = 5;
  string value = 6;
  string in = 7;
  // OAuth2 client credentials'.
  string token_url = 8;
  string client_id = 9;
  string client_secret = 10;
  repeated string scopes = 11;
  string audience = 12;
}

// A value an extract step pulls out.
message FlowField {
  string name = 1;
  // string, number, boolean or list.
  string type = 2;
  string description = 3;
}

// A link carrying a step's output to another.
message FlowEdge {
  string from = 1;
  string to = 2;
  // A condition: CEL (when) or plain English judged by a model (if).
  string when = 3;
  string if = 4;
  // Taken when none of its step's conditional links is.
  bool default = 5;
  // Taken when its step fails, the error as its input.
  bool error = 6;
  string label = 7;
}

// A workflow file in .agents/workflows.
message WorkflowFile {
  string name = 1;
  string path = 2;
  string description = 3;
  repeated FlowNode nodes = 4;
  repeated FlowEdge edges = 5;
  string problem = 6;
}

// Request message for WorkspaceService.ListWorkflows.
message ListWorkflowsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListWorkflows.
message ListWorkflowsResponse {
  repeated WorkflowFile workflows = 1;
  // .agents/workflows.
  string dir = 2;
}

// Request message for WorkspaceService.SaveWorkflow.
message SaveWorkflowRequest {
  string workspace = 1;
  // The workflow edited; empty for a new one.
  string previous_name = 2;
  // What to write (its path and problem aside).
  WorkflowFile workflow = 3;
}

// Response message for WorkspaceService.SaveWorkflow.
message SaveWorkflowResponse {
  WorkflowFile workflow = 1;
  repeated string problems = 2;
}

// Request message for WorkspaceService.DeleteWorkflow.
message DeleteWorkflowRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkspaceService.DeleteWorkflow.
message DeleteWorkflowResponse {}

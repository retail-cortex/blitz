syntax = "proto3";

package blitz.v1;

import "blitz/v1/turn.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/retail-cortex/blitz/proto/blitz/v1;blitzv1";

// WorkspaceService covers everything about a workspace except its
// conversations (SessionService) and workers (WorkerService): agents and
// models, settings, skills and their environments, MCP servers and tools,
// project memory, the reply language, checkpoints, approvals, images and web
// search. Mirrors pkg/api's Backend.
//
// Every request names its workspace by absolute directory; the service opens
// it on first use. Errors carry an ErrorInfo detail.
service WorkspaceService {
  // Describes the service itself, so a client can tell whether it's the
  // version it expects (older services don't have it: Unimplemented).
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);
  // The days the service has a log for, newest first, and its log
  // directory.
  rpc ListLogDays(ListLogDaysRequest) returns (ListLogDaysResponse);
  // A day's log records, newest first, filtered by level and text.
  rpc ReadLog(ReadLogRequest) returns (ReadLogResponse);
  // Returns the workspaces the service has open.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  // Closes a workspace: kills its background processes and MCP servers.
  rpc CloseWorkspace(CloseWorkspaceRequest) returns (CloseWorkspaceResponse);
  // Describes the sandbox commands run in, one line each.
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);

  // Returns every agent and which is active.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // Makes an agent the active one (UNKNOWN_AGENT).
  rpc SetAgent(SetAgentRequest) returns (SetAgentResponse);
  // Returns the model the active agent runs on.
  rpc GetModel(GetModelRequest) returns (GetModelResponse);
  // Switches every unpinned agent to a model.
  rpc SetModel(SetModelRequest) returns (SetModelResponse);
  // Pins an agent to a model and saves the pin (UNKNOWN_AGENT).
  rpc PinModel(PinModelRequest) returns (PinModelResponse);
  // Returns an agent to the configured model, or its own default.
  rpc UnpinModel(UnpinModelRequest) returns (UnpinModelResponse);
  // Returns every model's generation settings, or one model's.
  rpc GetModelSettings(GetModelSettingsRequest) returns (GetModelSettingsResponse);
  // Changes a model's generation settings and saves them (BAD_MODEL_REF,
  // INVALID_SETTING; nothing changes on error).
  rpc UpdateModelSettings(UpdateModelSettingsRequest) returns (UpdateModelSettingsResponse);
  // Returns the agency level, plus model, agent and reply language.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // Returns the workspace's git branch and how many files differ from
  // HEAD (repo false outside a repository; one with no commit yet is a
  // repository), and whether git is installed, for the status bar and
  // Changes.
  rpc GetGitStatus(GetGitStatusRequest) returns (GetGitStatusResponse);
  // Makes the workspace a git repository (git init) unless it's in one
  // already, and returns its git status (NO_GIT without git on the
  // service's PATH, GIT_FAILED).
  rpc InitGitRepo(InitGitRepoRequest) returns (InitGitRepoResponse);
  // Changes a setting for the workspace: agency, or effort (a reasoning
  // effort, or "auto" to clear it) (UNKNOWN_SETTING, INVALID_AGENCY,
  // INVALID_SETTING).
  rpc SetSetting(SetSettingRequest) returns (SetSettingResponse);
  // Changes which actions run without asking, for every session of the
  // workspace (UNKNOWN_MODE; BYPASS_NEEDS_SANDBOX when bypass is asked for
  // without an active OS sandbox).
  rpc SetPermissionMode(SetPermissionModeRequest) returns (SetPermissionModeResponse);
  // Returns the custom slash commands: command files, bundled commands, and
  // skills run by name.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  // Returns the permission rules in force: deny, then ask, then allow.
  rpc ListPermissionRules(ListPermissionRulesRequest) returns (ListPermissionRulesResponse);
  // Adds an allow, ask or deny rule for the workspace and, with save, to
  // a settings file: the global one or, with scope "workspace", the
  // workspace's own (BAD_RULE). Read rules must be saved and apply from
  // the next start.
  rpc AddPermissionRule(AddPermissionRuleRequest) returns (AddPermissionRuleResponse);
  // Removes a rule (any effect), and with save from a settings file.
  rpc RemovePermissionRule(RemovePermissionRuleRequest) returns (RemovePermissionRuleResponse);

  // Returns the skills found, or those matching a query.
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  // Returns one skill (SKILL_NOT_FOUND).
  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse);
  // Returns skill scripts' environments (SCRIPTS_DISABLED).
  rpc ListEnvs(ListEnvsRequest) returns (ListEnvsResponse);
  // Removes one environment.
  rpc RemoveEnv(RemoveEnvRequest) returns (RemoveEnvResponse);
  // Removes environments no allowed script needs, and incomplete ones.
  rpc PruneEnvs(PruneEnvsRequest) returns (PruneEnvsResponse);
  // Returns the configured MCP servers.
  rpc ListMCPServers(ListMCPServersRequest) returns (ListMCPServersResponse);
  // Returns what the active agent can use.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);

  // Re-reads project instruction files and returns their paths.
  rpc ReloadMemory(ReloadMemoryRequest) returns (ReloadMemoryResponse);
  // Appends a note to the project instruction file.
  rpc AddMemory(AddMemoryRequest) returns (AddMemoryResponse);
  // Returns the languages with an interface catalog.
  rpc ListLocales(ListLocalesRequest) returns (ListLocalesResponse);
  // Sets the language the model replies in and saves it (UNKNOWN_LOCALE).
  // The client switches its own interface language to the returned tag.
  rpc SetLocale(SetLocaleRequest) returns (SetLocaleResponse);

  // Returns the turns that changed files, newest first.
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  // Restores the files the latest turn with changes modified
  // (UNDO_CONFLICT unless force; NOTHING_TO_UNDO when none are left).
  rpc Undo(UndoRequest) returns (UndoResponse);
  // Returns a diff of the agent's changes this session, or git's.
  rpc GetDiff(GetDiffRequest) returns (GetDiffResponse);
  // Returns standing approvals.
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  // Revokes approvals by key, or all of them.
  rpc RevokeApprovals(RevokeApprovalsRequest) returns (RevokeApprovalsResponse);

  // Returns the background processes started in the given sessions' turns
  // (a client's), finished ones too, ordered by ID.
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  // Returns a background process's captured output and status
  // (UNKNOWN_PROCESS unless one of the given sessions started it).
  rpc GetProcessOutput(GetProcessOutputRequest) returns (GetProcessOutputResponse);
  // Stops a background process and its descendants (UNKNOWN_PROCESS unless
  // one of the given sessions started it).
  rpc KillProcess(KillProcessRequest) returns (KillProcessResponse);
  // Records in the workspace's audit log a command the user ran directly
  // in a client (!cmd), as user_shell.
  rpc AuditShell(AuditShellRequest) returns (AuditShellResponse);

  // Returns the background tasks (invoke_agent with background: true)
  // started in the given sessions' turns, oldest first.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  // Returns a background task with its latest events (UNKNOWN_TASK unless
  // one of the given sessions started it).
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  // Stops a background task (UNKNOWN_TASK unless one of the given
  // sessions started it).
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);
  // Streams what happens to the given sessions' background tasks outside
  // turns: first their active tasks and waiting requests, then ready,
  // then each change. Requests are answered with SessionService.Approve and Answer.
  rpc WatchTasks(WatchTasksRequest) returns (stream WatchTasksResponse);
  // Returns the given sessions' tasks' approval requests and questions
  // waiting for an answer.
  rpc ListTaskRequests(ListTaskRequestsRequest) returns (ListTaskRequestsResponse);

  // Returns the workspace's project settings (.blitz/settings.toml) and
  // the trust decision for the part that runs code or loosens a policy.
  rpc GetProjectSettings(GetProjectSettingsRequest) returns (GetProjectSettingsResponse);
  // Records trusting or declining the project settings with the hash
  // shown (PROJECT_CHANGED if they have changed since), and reopens the
  // workspace so they take effect, unless a turn is running in it.
  rpc TrustProject(TrustProjectRequest) returns (TrustProjectResponse);

  // Removes and returns what watched background processes (notify) of a
  // session reported while no turn ran there.
  rpc TakeProcessNotices(TakeProcessNoticesRequest) returns (TakeProcessNoticesResponse);

  // Returns the output styles, with the one in use (SetSetting "style"
  // changes it).
  rpc ListStyles(ListStylesRequest) returns (ListStylesResponse);

  // Returns the configured hooks, by event, with their recent failures.
  rpc ListHooks(ListHooksRequest) returns (ListHooksResponse);

  // Returns the notes the agent saved across sessions of the workspace
  // with its remember tool, newest first.
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);
  // Deletes one of those notes, by its name (NO_NOTE).
  rpc ForgetNote(ForgetNoteRequest) returns (ForgetNoteResponse);

  // Reads an image from the workspace for a prompt (IMAGES_DISABLED).
  rpc LoadImage(LoadImageRequest) returns (LoadImageResponse);
  // Stores image data (e.g. pasted) for a prompt (IMAGES_DISABLED).
  rpc AddImage(AddImageRequest) returns (AddImageResponse);
  // Names the web search provider (NO_FETCH when the agent can't fetch
  // pages, so a search would give it nothing to read).
  rpc GetSearchProvider(GetSearchProviderRequest) returns (GetSearchProviderResponse);
  // Searches the web and prepares the prompt that hands the readable results
  // to the agent (NO_FETCH, NO_SEARCH): run it as a turn with fetch_grants
  // set to the links' URLs.
  rpc SearchWeb(SearchWebRequest) returns (SearchWebResponse);
}

// Saved reports where a change was written in the config file. The change
// applies even when saving fails.
message Saved {
  string path = 1;
  // Why it wasn't saved; empty on success.
  string error = 2;
}

// Request message for WorkspaceService.GetServiceInfo.
message GetServiceInfoRequest {}

// Response message for WorkspaceService.GetServiceInfo.
message GetServiceInfoResponse {
  // The release (1.4.0), or "dev" for an unstamped build.
  string version = 1;
  // The program the service runs from, as it started (the file may have
  // been replaced or removed since).
  string executable = 2;
  google.protobuf.Timestamp started = 3;
  // The service's process, so a client can stop one that isn't a login
  // item.
  int32 pid = 4;
  // The program file has been replaced or removed since the service
  // started (a new build or package installed): it runs the old program.
  bool replaced = 5;
}

// Request message for WorkspaceService.ListLogDays.
message ListLogDaysRequest {}

// Response message for WorkspaceService.ListLogDays.
message ListLogDaysResponse {
  // YYYY-MM-DD, newest first.
  repeated string days = 1;
  // Where the log files are ("" when logging is off).
  string dir = 2;
}

// Request message for WorkspaceService.ReadLog.
message ReadLogRequest {
  // YYYY-MM-DD; "" is the newest day.
  string day = 1;
  // debug, info, warn or error: that level and above ("" is all).
  string min_level = 2;
  // Records containing every word, in any field, ignoring case.
  string text = 3;
  // The most records returned (0: 500).
  int32 limit = 4;
}

// A field of a log record.
message LogAttr {
  string key = 1;
  // Strings as they are, other values as JSON.
  string value = 2;
}

// A log record.
message LogEntry {
  google.protobuf.Timestamp time = 1;
  // DEBUG, INFO, WARN or ERROR.
  string level = 2;
  string message = 3;
  // The record's other fields, in order.
  repeated LogAttr attrs = 4;
}

// Response message for WorkspaceService.ReadLog.
message ReadLogResponse {
  // The day read, and its file.
  string day = 1;
  string path = 2;
  // Newest first.
  repeated LogEntry entries = 3;
  // How many records matched (more than entries when the limit cut them).
  int32 matched = 4;
}

// Request message for WorkspaceService.ListWorkspaces.
message ListWorkspacesRequest {}

// Response message for WorkspaceService.ListWorkspaces.
message ListWorkspacesResponse {
  // Absolute directories.
  repeated string workspaces = 1;
}

// Request message for WorkspaceService.CloseWorkspace.
message CloseWorkspaceRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.CloseWorkspace.
message CloseWorkspaceResponse {}

// Request message for WorkspaceService.GetSandbox.
message GetSandboxRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetSandbox.
message GetSandboxResponse {
  repeated string summary = 1;
}

// AgentInfo describes an agent.
message AgentInfo {
  string name = 1;
  string display_name = 2;
  string description = 3;
  bool active = 4;
  // The model it is pinned to; empty when it runs on the configured model.
  string pinned_model = 5;
}

// Request message for WorkspaceService.ListAgents.
message ListAgentsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListAgents.
message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

// Request message for WorkspaceService.SetAgent.
message SetAgentRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkspaceService.SetAgent.
message SetAgentResponse {
  AgentInfo agent = 1;
}

// Request message for WorkspaceService.GetModel.
message GetModelRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetModel.
message GetModelResponse {
  string name = 1;
  // The configured provider.
  string provider = 2;
  // Why the configured model couldn't be built, if it couldn't; the
  // workspace then runs on a placeholder model.
  string unavailable = 3;
}

// Request message for WorkspaceService.SetModel.
message SetModelRequest {
  string workspace = 1;
  // A name or "provider/model".
  string ref = 2;
}

// Response message for WorkspaceService.SetModel.
message SetModelResponse {
  // The model the active agent is pinned to, which still applies to it;
  // empty if it isn't pinned.
  string active_pin = 1;
}

// Request message for WorkspaceService.PinModel.
message PinModelRequest {
  string workspace = 1;
  string agent = 2;
  string ref = 3;
}

// Response message for WorkspaceService.PinModel.
message PinModelResponse {
  string agent = 1;
  // The model the agent now runs on.
  string model = 2;
  Saved saved = 3;
}

// Request message for WorkspaceService.UnpinModel.
message UnpinModelRequest {
  string workspace = 1;
  string agent = 2;
}

// Response message for WorkspaceService.UnpinModel.
message UnpinModelResponse {
  string agent = 1;
  string model = 2;
  Saved saved = 3;
}

// ModelSettings are a model's generation settings; unset fields use the
// global value or the provider's default.
message ModelSettings {
  optional double temperature = 1;
  optional int32 max_tokens = 2;
  optional double top_p = 3;
  optional int32 seed = 4;
  // minimal, low, medium, high or max.
  optional string reasoning_effort = 5;
  // Tokens the model may spend thinking; 0 turns thinking off.
  optional int32 thinking_budget = 6;
}

// ModelSettingsInfo is one model's settings and what applies otherwise.
message ModelSettingsInfo {
  // Without a provider prefix.
  string model = 1;
  string provider = 2;
  ModelSettings settings = 3;
  // Apply when settings leaves them unset (0: the provider's default).
  double global_temperature = 4;
  int32 global_max_tokens = 5;
}

// Request message for WorkspaceService.GetModelSettings.
message GetModelSettingsRequest {
  string workspace = 1;
  // One model ("provider/" optional); empty for every model with settings.
  string ref = 2;
}

// Response message for WorkspaceService.GetModelSettings.
message GetModelSettingsResponse {
  // Every model with settings, by name (when ref is empty).
  map<string, ModelSettings> all = 1;
  // The requested model (when ref is set).
  ModelSettingsInfo model = 2;
}

// Setting is one key=value change; an empty value clears the key.
message Setting {
  string key = 1;
  string value = 2;
}

// Request message for WorkspaceService.UpdateModelSettings.
message UpdateModelSettingsRequest {
  string workspace = 1;
  string ref = 2;
  // Clear every setting before applying changes.
  bool reset = 3;
  repeated Setting changes = 4;
}

// Response message for WorkspaceService.UpdateModelSettings.
message UpdateModelSettingsResponse {
  ModelSettingsInfo model = 1;
  // Keys set that the provider or model ignores.
  repeated string unsupported = 2;
  Saved saved = 3;
}

// Request message for WorkspaceService.GetSettings.
message GetSettingsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetSettings.
message GetSettingsResponse {
  reserved 1, 2;
  reserved "puppy_name", "owner_name";
  string agency = 3;
  string model = 4;
  string provider = 5;
  string agent = 6;
  // The language the model replies in.
  string locale = 7;
  // Images can be attached to prompts.
  bool images_enabled = 8;
  // default, accept-edits, plan, dont-ask or bypass.
  string permission_mode = 9;
  // The session's reasoning effort (minimal … max), empty when unset.
  string effort = 10;
  // The output style in use ("default": none).
  string style = 11;
}

// Request message for WorkspaceService.SetPermissionMode.
message SetPermissionModeRequest {
  string workspace = 1;
  // default, accept-edits, plan, dont-ask or bypass (other spellings such
  // as acceptEdits are accepted).
  string mode = 2;
}

// Response message for WorkspaceService.SetPermissionMode.
message SetPermissionModeResponse {
  // The mode's canonical name.
  string mode = 1;
}

// Command is a custom slash command.
message Command {
  // Without the slash; may be namespaced ("db:migrate").
  string name = 1;
  string description = 2;
  string argument_hint = 3;
  // project, user, bundled or skill.
  string source = 4;
}

// Request message for WorkspaceService.ListCommands.
message ListCommandsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListCommands.
message ListCommandsResponse {
  repeated Command commands = 1;
}

// PermissionRule is an allow, ask or deny rule.
message PermissionRule {
  // allow, ask or deny.
  string effect = 1;
  // kind(pattern), e.g. shell(git push *), or a tool name.
  string rule = 2;
  // Where it comes from: global or workspace (the settings file it's
  // in), built-in (read_only_defaults), flag or session.
  string source = 3;
}

// Request message for WorkspaceService.ListPermissionRules.
message ListPermissionRulesRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListPermissionRules.
message ListPermissionRulesResponse {
  repeated PermissionRule rules = 1;
}

// Request message for WorkspaceService.AddPermissionRule.
message AddPermissionRuleRequest {
  string workspace = 1;
  string effect = 2;
  string rule = 3;
  bool save = 4;
  // With save: "global" ("" too) or "workspace".
  string scope = 5;
}

// Response message for WorkspaceService.AddPermissionRule.
message AddPermissionRuleResponse {
  // The rule in canonical form.
  string rule = 1;
  // Saved, but only applies from the next start (read rules).
  bool next_start = 2;
  Saved saved = 3;
}

// Request message for WorkspaceService.RemovePermissionRule.
message RemovePermissionRuleRequest {
  string workspace = 1;
  string rule = 2;
  bool save = 3;
  // With save: "global" ("" too) or "workspace".
  string scope = 4;
}

// Response message for WorkspaceService.RemovePermissionRule.
message RemovePermissionRuleResponse {
  string rule = 1;
  // How many rules were removed.
  int32 removed = 2;
  Saved saved = 3;
}

// Request message for WorkspaceService.SetSetting.
message SetSettingRequest {
  string workspace = 1;
  // "agency".
  string key = 2;
  string value = 3;
}

// Response message for WorkspaceService.SetSetting.
message SetSettingResponse {
  // The key in canonical form.
  string key = 1;
}

// SkillInfo describes a skill and what the skills policy lets it do.
message SkillInfo {
  string name = 1;
  string description = 2;
  string version = 3;
  string license = 4;
  string category = 5;
  string compatibility = 6;
  repeated string tags = 7;
  // Identifies the content, for pinning it in the policy.
  string hash = 8;
  repeated SkillTool tools = 9;
  repeated SkillScript scripts = 10;
  // The approval tier the scripts run at; empty without scripts.
  string tier = 11;
  // The skill may skip approvals and the policy allows it.
  bool bypass = 12;
  // The scripts may use the network.
  bool network = 13;
  // The skill asks for the network (granted or not).
  bool needs_network = 14;
  // Host environment variables passed to the scripts, and those withheld.
  repeated string env = 15;
  repeated string withheld = 16;
  // Why none of the scripts may run.
  repeated string blocked = 17;
}

// SkillTool is a tool a skill needs.
message SkillTool {
  string name = 1;
  repeated string scopes = 2;
  string why = 3;
}

// SkillScript is one of a skill's scripts and the policy's verdict.
message SkillScript {
  string name = 1;
  string language = 2;
  // Its path in the skill, or "inline".
  string source = 3;
  google.protobuf.Duration timeout = 4;
  repeated string deps = 5;
  bool allowed = 6;
  repeated string reasons = 7;
}

// Request message for WorkspaceService.ListSkills.
message ListSkillsRequest {
  string workspace = 1;
  // Only skills matching; empty for all.
  string query = 2;
}

// Response message for WorkspaceService.ListSkills.
message ListSkillsResponse {
  repeated SkillInfo skills = 1;
}

// Request message for WorkspaceService.GetSkill.
message GetSkillRequest {
  string workspace = 1;
  string name = 2;
}

// Response message for WorkspaceService.GetSkill.
message GetSkillResponse {
  SkillInfo skill = 1;
}

// Env is an isolated Python environment built for skill scripts.
message Env {
  string key = 1;
  repeated string deps = 2;
  // The skills that used it.
  repeated string skills = 3;
  // Bytes on disk.
  int64 size = 4;
  google.protobuf.Timestamp last_used = 5;
  // Built completely.
  bool ready = 6;
}

// Request message for WorkspaceService.ListEnvs.
message ListEnvsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListEnvs.
message ListEnvsResponse {
  repeated Env envs = 1;
}

// Request message for WorkspaceService.RemoveEnv.
message RemoveEnvRequest {
  string workspace = 1;
  string key = 2;
}

// Response message for WorkspaceService.RemoveEnv.
message RemoveEnvResponse {}

// Request message for WorkspaceService.PruneEnvs.
message PruneEnvsRequest {
  string workspace = 1;
}

// EnvError is an environment that couldn't be removed.
message EnvError {
  string key = 1;
  string error = 2;
}

// Response message for WorkspaceService.PruneEnvs.
message PruneEnvsResponse {
  int32 removed = 1;
  // Bytes freed.
  int64 freed = 2;
  repeated EnvError failed = 3;
}

// MCPServer is a configured MCP server.
message MCPServer {
  string name = 1;
  // Its URL, or the command that starts it.
  string target = 2;
  bool auto_approve = 3;
}

// Request message for WorkspaceService.ListMCPServers.
message ListMCPServersRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListMCPServers.
message ListMCPServersResponse {
  repeated MCPServer servers = 1;
}

// ToolInfo is a tool an agent can call.
message ToolInfo {
  string name = 1;
  string description = 2;
  // Stays available in plan mode.
  bool plan_allowed = 3;
}

// MCPOffer is an MCP server offered to an agent.
message MCPOffer {
  string server = 1;
  // The tools offered; empty means all.
  repeated string tools = 2;
  // Prepended to tool names.
  string prefix = 3;
}

// Request message for WorkspaceService.ListTools.
message ListToolsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListTools.
message ListToolsResponse {
  string agent = 1;
  repeated ToolInfo tools = 2;
  repeated MCPOffer mcp = 3;
}

// Request message for WorkspaceService.ReloadMemory.
message ReloadMemoryRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ReloadMemory.
message ReloadMemoryResponse {
  repeated string paths = 1;
  // The file names looked for, in order.
  repeated string files = 2;
}

// Request message for WorkspaceService.AddMemory.
message AddMemoryRequest {
  string workspace = 1;
  string text = 2;
}

// Response message for WorkspaceService.AddMemory.
message AddMemoryResponse {
  string path = 1;
}

// LocaleInfo names a language with an interface catalog.
message LocaleInfo {
  string tag = 1;
  string name = 2;
}

// Request message for WorkspaceService.ListLocales.
message ListLocalesRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListLocales.
message ListLocalesResponse {
  repeated LocaleInfo locales = 1;
  // Where custom catalogs are read from; empty if none is configured.
  string custom_dir = 2;
}

// Request message for WorkspaceService.SetLocale.
message SetLocaleRequest {
  string workspace = 1;
  // A language tag or name.
  string input = 2;
}

// Response message for WorkspaceService.SetLocale.
message SetLocaleResponse {
  string tag = 1;
  // e.g. "Español".
  string native_name = 2;
  // In the new language's terms, e.g. "español".
  string language_name = 3;
  // The interface is translated; otherwise only replies are.
  bool has_catalog = 4;
  Saved saved = 5;
}

// Checkpoint is the files one turn changed.
message Checkpoint {
  int32 id = 1;
  string label = 2;
  google.protobuf.Timestamp time = 3;
  repeated string files = 4;
}

// Request message for WorkspaceService.ListCheckpoints.
message ListCheckpointsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListCheckpoints.
message ListCheckpointsResponse {
  repeated Checkpoint checkpoints = 1;
}

// Request message for WorkspaceService.Undo.
message UndoRequest {
  string workspace = 1;
  // Restore even files changed since the agent's edit.
  bool force = 2;
}

// Response message for WorkspaceService.Undo.
message UndoResponse {
  string label = 1;
  repeated string restored = 2;
  // Why the rest wasn't restored, after a partial restore.
  ErrorInfo error = 3;
}

// Request message for WorkspaceService.GetDiff.
message GetDiffRequest {
  string workspace = 1;
  // git's diff (stat and patch) instead of the agent's changes.
  bool git = 2;
  // Keep git's terminal colours.
  bool color = 3;
}

// Response message for WorkspaceService.GetDiff.
message GetDiffResponse {
  // A unified diff; empty when nothing changed.
  string diff = 1;
}

// Approval is a standing permission.
message Approval {
  // Identifies it for RevokeApprovals.
  string key = 1;
  // "cmd", "write", "delete", "web", "mcp", "uc-run", or a newer kind.
  string kind = 2;
  // The command, path, host or tool.
  string subject = 3;
  // The workspace a command approval is limited to.
  string dir = 4;
  // Saved for future sessions; otherwise it lasts until the service stops.
  bool always = 5;
  google.protobuf.Timestamp added = 6;
}

// Request message for WorkspaceService.ListApprovals.
message ListApprovalsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListApprovals.
message ListApprovalsResponse {
  repeated Approval approvals = 1;
}

// Request message for WorkspaceService.RevokeApprovals.
message RevokeApprovalsRequest {
  string workspace = 1;
  repeated string keys = 2;
  // Revoke every approval; keys is ignored.
  bool all = 3;
}

// Response message for WorkspaceService.RevokeApprovals.
message RevokeApprovalsResponse {
  int32 revoked = 1;
}

// Process is a background process the agent started, and how it is.
message Process {
  // The workspace's number for it.
  int32 id = 1;
  string command = 2;
  bool running = 3;
  // Once it has finished.
  int32 exit_code = 4;
  // How long it has run, or ran.
  int64 runtime_ms = 5;
}

// Request message for WorkspaceService.ListProcesses.
message ListProcessesRequest {
  string workspace = 1;
  // The sessions whose processes to list.
  repeated string session_ids = 2;
}

// Response message for WorkspaceService.ListProcesses.
message ListProcessesResponse {
  repeated Process processes = 1;
}

// Request message for WorkspaceService.GetProcessOutput.
message GetProcessOutputRequest {
  string workspace = 1;
  // The sessions the asking client ran turns in.
  repeated string session_ids = 2;
  int32 id = 3;
}

// Response message for WorkspaceService.GetProcessOutput.
message GetProcessOutputResponse {
  // Its output and errors as captured (the first part, when long).
  string output = 1;
  Process process = 2;
}

// Request message for WorkspaceService.KillProcess.
message KillProcessRequest {
  string workspace = 1;
  // The sessions the asking client ran turns in.
  repeated string session_ids = 2;
  int32 id = 3;
}

// Response message for WorkspaceService.KillProcess.
message KillProcessResponse {
  // How it is after the kill.
  Process process = 1;
}

// Request message for WorkspaceService.AuditShell.
message AuditShellRequest {
  string workspace = 1;
  string command = 2;
  int32 exit_code = 3;
  // Why it didn't start, if it didn't ("" when it ran).
  string start_error = 4;
}

// Response message for WorkspaceService.AuditShell.
message AuditShellResponse {}

// BackgroundTask is a sub-agent running beside the turn that started it.
message BackgroundTask {
  // task-1, task-2, … in the workspace.
  string id = 1;
  string agent = 2;
  // The first line of what it was asked.
  string prompt = 3;
  // The session whose turn started it.
  string session_id = 4;
  // running, done, failed or stopped.
  string state = 5;
  google.protobuf.Timestamp started = 6;
  // Unset while it runs.
  google.protobuf.Timestamp ended = 7;
  // What it answered, when done.
  string result = 8;
  // Why it failed or stopped.
  string error = 9;
  // Its own tokens and cost (also counted in its session's).
  Usage usage = 10;
  // Its own git worktree and branch, when it ran isolated in one.
  string worktree = 11;
  string branch = 12;
}

// Request message for WorkspaceService.ListTasks.
message ListTasksRequest {
  string workspace = 1;
  // The sessions whose tasks to list.
  repeated string session_ids = 2;
}

// Response message for WorkspaceService.ListTasks.
message ListTasksResponse {
  repeated BackgroundTask tasks = 1;
}

// Request message for WorkspaceService.GetTask.
message GetTaskRequest {
  string workspace = 1;
  // The sessions the asking client ran turns in.
  repeated string session_ids = 2;
  string id = 3;
}

// Response message for WorkspaceService.GetTask.
message GetTaskResponse {
  BackgroundTask task = 1;
  // Its latest events, in words (the last 200).
  repeated string events = 2;
}

// Request message for WorkspaceService.StopTask.
message StopTaskRequest {
  string workspace = 1;
  // The sessions the asking client ran turns in.
  repeated string session_ids = 2;
  string id = 3;
}

// TaskEvent is something that happened to a background task outside a
// turn.
message TaskEvent {
  oneof kind {
    // Started, waiting for an answer, running again, or ended.
    BackgroundTask task = 1;
    // Waits for Approve.
    ApprovalRequest approval_request = 2;
    // Waits for Answer.
    Question question = 3;
    // A request that no longer waits (answered, or its task ended).
    string resolved = 4;
    // Sent once, after the active tasks and waiting requests: changes
    // follow.
    bool ready = 5;
    // The workspace's permission rules or remembered approvals changed
    // (their files were edited, by anyone): views of them should refresh.
    bool settings_changed = 6;
  }
}

// Request message for WorkspaceService.WatchTasks.
message WatchTasksRequest {
  string workspace = 1;
  // The sessions whose tasks to follow.
  repeated string session_ids = 2;
}

// Response message for WorkspaceService.WatchTasks.
message WatchTasksResponse {
  TaskEvent event = 1;
}

// Request message for WorkspaceService.ListTaskRequests.
message ListTaskRequestsRequest {
  string workspace = 1;
  repeated string session_ids = 2;
}

// Response message for WorkspaceService.ListTaskRequests.
message ListTaskRequestsResponse {
  // Each an approval_request or a question.
  repeated TaskEvent requests = 1;
}

// Response message for WorkspaceService.StopTask.
message StopTaskResponse {
  // How it is once stopped.
  BackgroundTask task = 1;
}

// ProjectItem is one setting from a project file.
message ProjectItem {
  // The file, relative to the workspace.
  string file = 1;
  // deny, ask, blocked_path, limit, skill_policy, worker_limit (applied);
  // hook, mcp, allow, writable, model, agent_model, worker_allow,
  // skill_scripts (needing trust); setting (another key).
  string kind = 2;
  // The hook's event, the server's, agent's or skill's name, or the key.
  string key = 3;
  // The rule, command, path, model or number.
  string value = 4;
  // Why it was ignored: never, unknown, not_stricter, outside, provider,
  // user_set.
  string reason = 5;
}

// ProjectSettings are what a workspace's project files say.
message ProjectSettings {
  // The files found, relative to the workspace.
  repeated string files = 1;
  // The trust decision for the content as it is now: none, new, changed,
  // trusted, declined.
  string state = 2;
  // Identifies the content needing trust; TrustProject takes it back.
  string hash = 3;
  // The settings needing trust are in force.
  bool loaded = 4;
  // In force without trust: they only tighten.
  repeated ProjectItem applied = 5;
  // Needing trust: they run code or loosen a policy.
  repeated ProjectItem pending = 6;
  // Not taken from a project, or changing nothing.
  repeated ProjectItem ignored = 7;
  // Files that couldn't be read.
  repeated string problems = 8;
}

// Request message for WorkspaceService.GetProjectSettings.
message GetProjectSettingsRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetProjectSettings.
message GetProjectSettingsResponse {
  ProjectSettings settings = 1;
}

// Request message for WorkspaceService.TakeProcessNotices.
message TakeProcessNoticesRequest {
  string workspace = 1;
  string session_id = 2;
}

// Response message for WorkspaceService.TakeProcessNotices.
message TakeProcessNoticesResponse {
  repeated string notices = 1;
}

// Style is an output style.
message Style {
  string name = 1;
  string description = 2;
  // "built-in", or the style's file.
  string source = 3;
  bool active = 4;
}

// Request message for WorkspaceService.ListStyles.
message ListStylesRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListStyles.
message ListStylesResponse {
  repeated Style styles = 1;
}

// Hook is a configured hook.
message Hook {
  string event = 1;
  // command, http or prompt.
  string type = 2;
  // The tool-name glob, for tool events.
  string match = 3;
  // The permission rule calls must match.
  string if = 4;
  // What it runs: the command, POST <url>, or prompt: <text>.
  string runs = 5;
  // The project file it came from; empty for the user's own settings.
  string source = 6;
  bool fail_closed = 7;
  // Its latest failed runs since the workspace opened.
  repeated HookFailure failures = 8;
}

// HookFailure is one failed run of a hook.
message HookFailure {
  google.protobuf.Timestamp time = 1;
  string error = 2;
}

// Request message for WorkspaceService.ListHooks.
message ListHooksRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListHooks.
message ListHooksResponse {
  repeated Hook hooks = 1;
}

// Note is something the agent remembered across sessions of a workspace.
message Note {
  // Its name, to forget it.
  string name = 1;
  // fact, preference or correction.
  string kind = 2;
  string text = 3;
  google.protobuf.Timestamp time = 4;
  // Its file, on the service's machine.
  string path = 5;
}

// Request message for WorkspaceService.ListNotes.
message ListNotesRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.ListNotes.
message ListNotesResponse {
  repeated Note notes = 1;
}

// Request message for WorkspaceService.ForgetNote.
message ForgetNoteRequest {
  string workspace = 1;
  // The note's name, or the start of it when only one note's starts so.
  string name = 2;
}

// Response message for WorkspaceService.ForgetNote.
message ForgetNoteResponse {}

// Request message for WorkspaceService.TrustProject.
message TrustProjectRequest {
  string workspace = 1;
  // The hash of the content shown.
  string hash = 2;
  // Trust it, or decline it.
  bool trusted = 3;
}

// Response message for WorkspaceService.TrustProject.
message TrustProjectResponse {
  // The workspace was reopened with the decision; false when a turn was
  // running in it: it applies the next time the workspace opens.
  bool reopened = 1;
}

// Image is an image stored for a prompt.
message Image {
  // For Turn.image_ids: the SHA-256 of the data.
  string id = 1;
  string name = 2;
  string mime_type = 3;
  int32 width = 4;
  int32 height = 5;
  // Bytes, after any resizing.
  int64 size = 6;
  // Scaled down to fit the model's limits.
  bool resized = 7;
}

// Request message for WorkspaceService.LoadImage.
message LoadImageRequest {
  string workspace = 1;
  // Relative to the workspace.
  string path = 2;
}

// Response message for WorkspaceService.LoadImage.
message LoadImageResponse {
  Image image = 1;
}

// Request message for WorkspaceService.AddImage.
message AddImageRequest {
  string workspace = 1;
  string name = 2;
  bytes data = 3;
}

// Response message for WorkspaceService.AddImage.
message AddImageResponse {
  Image image = 1;
}

// Link is a search result handed to the agent.
message Link {
  string title = 1;
  string url = 2;
}

// Request message for WorkspaceService.GetSearchProvider.
message GetSearchProviderRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetSearchProvider.
message GetSearchProviderResponse {
  string provider = 1;
}

// Request message for WorkspaceService.SearchWeb.
message SearchWebRequest {
  string workspace = 1;
  string terms = 2;
}

// Response message for WorkspaceService.SearchWeb.
message SearchWebResponse {
  // The provider searched.
  string provider = 1;
  // None: nothing worth handing over.
  repeated Link links = 2;
  string prompt = 3;
}

// Request message for WorkspaceService.GetGitStatus.
message GetGitStatusRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.GetGitStatus.
message GetGitStatusResponse {
  bool repo = 1;
  // The branch, or the short commit when detached.
  string branch = 2;
  // Files that differ from HEAD, untracked ones included.
  int32 changed = 3;
  // Git is on the service's PATH (else repo is false).
  bool git = 4;
}

// Request message for WorkspaceService.InitGitRepo.
message InitGitRepoRequest {
  string workspace = 1;
}

// Response message for WorkspaceService.InitGitRepo.
message InitGitRepoResponse {
  // The repository's git status, after git init.
  GetGitStatusResponse status = 1;
}

id: postgres
category: databases
name:
  en: "PostgreSQL"
  es: "PostgreSQL"
  fr-CA: "PostgreSQL"
hint:
  en: "Any PostgreSQL server, local or hosted."
  es: "Cualquier servidor PostgreSQL, local o alojado."
  fr-CA: "N'importe quel serveur PostgreSQL, local ou hébergé."
backend: toolbox
source: postgres
# Listed simplest first: SQLite, PostgreSQL, BigQuery, AlloyDB.
order: 2
capabilities: [test, try, queries, schema, query-builder]
fields:
  - key: host
    required: true
    default: "localhost"
    label:
      en: "Host"
      es: "Host"
      fr-CA: "Hôte"
    help:
      en: "localhost, or the server's address"
      es: "localhost, o la dirección del servidor"
      fr-CA: "localhost, ou l'adresse du serveur"
  - key: port
    required: true
    default: "5432"
    label:
      en: "Port"
      es: "Puerto"
      fr-CA: "Port"
    help:
      en: "5432 unless it's another"
      es: "5432 salvo que sea otro"
      fr-CA: "5432 sauf si c'est un autre"
  - key: database
    required: true
    label:
      en: "Database"
      es: "Base de datos"
      fr-CA: "Base de données"
    help:
      en: "Its name (for SQLite, the file's path)"
      es: "Su nombre (en SQLite, la ruta del archivo)"
      fr-CA: "Son nom (pour SQLite, le chemin du fichier)"
  - key: user
    required: true
    label:
      en: "User"
      es: "Usuario"
      fr-CA: "Utilisateur"
    help:
      en: "A user that can only read is safest"
      es: "Lo más seguro es un usuario que solo pueda leer"
      fr-CA: "Un utilisateur qui ne peut que lire est le plus sûr"
  - key: password
    type: secret
    required: true
    label:
      en: "Password"
      es: "Contraseña"
      fr-CA: "Mot de passe"
readOnly:
  key: readOnly
  value: true
  hint:
    en: "Every session is read-only: PostgreSQL refuses any write, whatever the SQL. Tools that write aren't offered."
    es: "Cada sesión es de solo lectura: PostgreSQL rechaza cualquier escritura, sea cual sea el SQL. No se ofrecen herramientas que escriben."
    fr-CA: "Chaque session est en lecture seule : PostgreSQL refuse toute écriture, quel que soit le SQL. Les outils qui écrivent ne sont pas offerts."
tools:
  - id: execute_sql
    type: postgres-execute-sql
    on: true
    agent: "Run a SQL statement on {connection}."
    about:
      en: "Runs any SQL the agent writes"
      es: "Ejecuta cualquier SQL que escriba el agente"
      fr-CA: "Exécute tout SQL écrit par l'agent"
  - id: list_tables
    type: postgres-list-tables
    on: true
    agent: "List the tables in {connection}, with their columns."
    about:
      en: "Lists the tables and their columns"
      es: "Lista las tablas y sus columnas"
      fr-CA: "Liste les tables et leurs colonnes"
  - id: list_schemas
    type: postgres-list-schemas
    agent: "List the schemas in {connection}."
    about:
      en: "Lists the schemas"
      es: "Lista los esquemas"
      fr-CA: "Liste les schémas"
  - id: list_views
    type: postgres-list-views
    agent: "List the views in {connection}."
    about:
      en: "Lists the views"
      es: "Lista las vistas"
      fr-CA: "Liste les vues"
  - id: list_indexes
    type: postgres-list-indexes
    agent: "List the indexes in {connection}."
    about:
      en: "Lists the indexes"
      es: "Lista los índices"
      fr-CA: "Liste les index"
  - id: database_overview
    type: postgres-database-overview
    agent: "An overview of {connection}: its version, size and connections."
    about:
      en: "Its version, size and connections"
      es: "Su versión, tamaño y conexiones"
      fr-CA: "Sa version, sa taille et ses connexions"
queries:
  type: postgres-sql
  dialect: "PostgreSQL"
  placeholders: "$1"
  example: "SELECT name, total FROM orders WHERE customer = $1"
  hint:
    en: "SQL you write once, with parameters ($1, $2…), offered as tools of their own. Safer than letting the agent write SQL."
    es: "SQL que escribes una vez, con parámetros ($1, $2…), ofrecido como herramienta propia. Más seguro que dejar que el agente escriba SQL."
    fr-CA: "Du SQL écrit une fois, avec des paramètres ($1, $2…), offert comme outil à part entière. Plus sûr que de laisser l'agent écrire le SQL."
schema:
  statement: |
    SELECT c.table_schema || '.' || c.table_name AS "table",
      obj_description(format('%I.%I', c.table_schema, c.table_name)::regclass, 'pg_class') AS about,
      string_agg(c.column_name || ' ' || c.data_type, ', ' ORDER BY c.ordinal_position) AS columns
    FROM information_schema.columns c
    WHERE c.table_schema NOT IN ('pg_catalog', 'information_schema') AND c.table_schema NOT LIKE 'pg_toast%'
    GROUP BY c.table_schema, c.table_name
    ORDER BY 1
    LIMIT 500

# Hugo's settings for the documentation site (docs/BUILD.bazel builds it).
baseURL: https://retail-cortex.github.io/blitz/
title: Blitz
theme: hugo-geekdoc
locale: en
enableGitInfo: false
enableRobotsTXT: true
pluralizeListTitles: false

markup:
  goldmark:
    renderer:
      # Geekdoc's shortcodes emit HTML.
      unsafe: true
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  geekdocRepo: https://github.com/retail-cortex/blitz
  geekdocEditPath: edit/main/docs
  geekdocSearch: true
  geekdocBreadcrumb: true
  geekdocToC: 3
  geekdocNextPrev: true
  geekdocDarkModeToggle: true
  geekdocCollapseSection: false
  geekdocFileTreeSortBy: weight
  geekdocContentLicense:
    name: Apache License 2.0
    link: https://www.apache.org/licenses/LICENSE-2.0

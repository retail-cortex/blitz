name: sqlite-vec soak

# TestSQLiteVec, many times, on an Intel runner: with wazero 1.8.2 (the
# WebAssembly runtime go-sqlite3 runs SQLite in), sqlite-vec's searches
# read out of bounds (vec0Filter) on an Intel Xeon Platinum 8370C, 196
# runs of 200, and never on AMD EPYC or arm64; wazero 1.12.0 passed 1,000.
# GitHub picks a runner's CPU, and ci.yml's Linux job mostly gets AMD, so
# a change to the toolbox or go.mod (wazero, go-sqlite3, sqlite-vec) tries
# several runners and tests on the Intel ones. Or by hand.
on:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/sqlite-vec-soak.yml
      - third_party/mcp-toolbox/**
      - go.mod
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        try: [1, 2, 3, 4, 5, 6]
    name: try ${{ matrix.try }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Runner
        id: cpu
        run: |
          cpu="$(lscpu | sed -n 's/^Model name: *//p')"
          echo "::notice::$cpu"
          case "$cpu" in *Intel*) echo intel=true >> "$GITHUB_OUTPUT";; esac
      # As ci.yml: the runner's toolchains Blitz doesn't use, removed for
      # room (a try ran out of disk).
      - name: Free disk space
        if: steps.cpu.outputs.intel
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
      - name: Check out
        if: steps.cpu.outputs.intel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bazel
        if: steps.cpu.outputs.intel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false
      # The modules first, tried again on a proxy's dropped stream (a try's
      # build stopped on one).
      - name: Fetch
        id: fetch
        if: steps.cpu.outputs.intel
        run: |
          for i in 1 2 3; do
            bazel fetch //third_party/mcp-toolbox/embed:embed_test && exit 0
            sleep 10
          done
          exit 1
      - name: TestSQLiteVec 500 times in one process
        if: steps.cpu.outputs.intel
        run: |
          bazel test --nocache_test_results --test_output=errors --test_filter=TestSQLiteVec \
            --test_arg=-test.count=500 --test_arg=-test.failfast --test_timeout=1800 \
            //third_party/mcp-toolbox/embed:embed_test
      - name: The same with the race detector
        if: always() && steps.cpu.outputs.intel && steps.fetch.outcome == 'success'
        run: |
          bazel test --config=race --nocache_test_results --test_output=errors --test_filter=TestSQLiteVec \
            --test_arg=-test.count=500 --test_arg=-test.failfast --test_timeout=1800 \
            //third_party/mcp-toolbox/embed:embed_test

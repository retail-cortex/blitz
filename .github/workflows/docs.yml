name: docs

# The documentation site (docs/): built by Bazel on every change to it or
# to the protos its API reference is generated from, and after CI on main
# for the coverage report; published to GitHub Pages from main.
on:
  push:
    branches: [main]
    paths: ["docs/**", "proto/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "proto/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
  # Also after each successful CI run on main, for its coverage report.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read # the coverage report, from a CI run's artifacts

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      # The specs live in the site; a docs-only change skips ci.yml.
      - run: bazel run //tools/specs
      # The coverage page's report: from the CI run that triggered this one,
      # else the latest successful CI run on main (a docs-only change skips
      # CI). Without one the page says so.
      - name: Coverage report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          run="${RUN_ID:-$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')}"
          if [ -z "$run" ] || ! gh run download "$run" --repo "$GITHUB_REPOSITORY" --name coverage --dir docs/data; then
            echo "::warning::no coverage report from CI (run: ${run:-none}); the page will say so"
          fi
      # A link to a missing page fails the build (docs/layouts).
      - run: bazel build //docs:site
      # Bazel's outputs are read-only; the artifact is a plain copy.
      - run: cp -RL bazel-bin/docs/site "$RUNNER_TEMP/site" && chmod -R u+w "$RUNNER_TEMP/site"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

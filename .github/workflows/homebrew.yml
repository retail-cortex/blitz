name: homebrew

# The Homebrew formula (spec_parity_027 PAR-MOD-06): when a release is
# published (not a pre-release), its signed checksums are verified and
# release/homebrew_formula.sh writes Formula/blitz.rb in
# retail-cortex/homebrew-tap, so `brew install retail-cortex/tap/blitz`
# installs it. It needs a HOMEBREW_TAP_TOKEN secret that can push to the
# tap; without one the job says so and does nothing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to publish to the tap (v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1
      - name: Formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::No HOMEBREW_TAP_TOKEN secret: the tap isn't updated."
            exit 0
          fi
          gh release download "$TAG" --pattern checksums.txt --pattern checksums.txt.sigstore.json --dir dl
          cosign verify-blob --bundle dl/checksums.txt.sigstore.json \
            --certificate-identity-regexp '^https://github.com/retail-cortex/blitz/\.github/workflows/release\.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dl/checksums.txt
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/retail-cortex/homebrew-tap.git" tap
          mkdir -p tap/Formula
          release/homebrew_formula.sh "$TAG" dl/checksums.txt > tap/Formula/blitz.rb
          cd tap
          git config user.name "blitz-release"
          git config user.email "blitz-release@users.noreply.github.com"
          git add Formula/blitz.rb
          git diff --cached --quiet && { echo "The formula is up to date."; exit 0; }
          git commit -m "blitz ${TAG#v}"
          git push origin HEAD

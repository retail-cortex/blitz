name: release

on:
  push:
    tags: ["v*"]
  # A tag push is skipped when the tagged commit's message says [skip ci]
  # (a squash merge carries it over from the branch's commits): run it by
  # hand then, on the tag (gh workflow run release.yml --ref v0.8.6).
  workflow_dispatch:
    inputs:
      publish:
        description: "Only put this published tag in the apt repository and the Snap Store"
        type: boolean
        default: false
  # Publishing the draft (the owner's review done) updates the apt
  # repository: apt upgrade offers only what's published.
  release:
    types: [published]

permissions:
  contents: write # create the GitHub release
  id-token: write # keyless cosign signing

jobs:
  # The CLI archives (blitz and blitzd for five platforms, pure Go, built on
  # one machine by Bazel, stamped with the tag), their SBOMs, a signed
  # checksum file, and the draft release that the desktop jobs add to.
  release:
    # By hand on a branch would name the release after the branch. Not
    # again when the release is published, nor when only publishing it.
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release' && !inputs.publish
    runs-on: ubuntu-latest
    steps:
      # GitHub's Ubuntu runners start with about 14 GB free, too little for
      # the build, the race-detector tests and five platforms' archives
      # (a run failed with "No space left on device"). Toolchains Blitz
      # doesn't use take most of the disk: remove them first. (The Android
      # SDK too: .bazelrc keeps Bazel from reading ANDROID_HOME.)
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version comes from git describe
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          # ci.yml's build outputs from main, so only what the version
          # stamp touches is built again (the links and the archives): a
          # tag can restore main's caches. It saves none, which would serve
          # only this tag.
          disk-cache: ci-ubuntu-latest
          cache-save: false
      # Release tools are pinned to exact versions, so a rebuild of a tag
      # uses the same tools as the original release.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.52.0
      - run: bazel build --config=release //release:archives
      - name: Archives, SBOMs and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for f in $(bazel cquery --config=release --output=files //release:archives); do
            name="$(basename "$f")"        # blitz_linux_amd64.tar.gz
            out="dist/blitz_${version}_${name#blitz_}"
            cp "$f" "$out"
            syft scan "file:$out" -o "spdx-json=$out.sbom.json"
          done
          # The VS Code extension (apps/vscode), at the release's version.
          bazel build --config=release --action_env=VSIX_VERSION="$version" //apps/vscode:vsix
          cp "$(bazel cquery --config=release --action_env=VSIX_VERSION="$version" --output=files //apps/vscode:vsix)" "dist/blitz_${version}_vscode.vsix"
          (cd dist && sha256sum blitz_* > checksums.txt)
          # Sigstore's standard bundle (not cosign's older one), which
          # `blitz update` and the desktop app check without cosign
          # (pkg/selfupdate); cosign verify-blob reads either.
          cosign sign-blob --yes --new-bundle-format --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          # The install script (curl …/releases/latest/download/install.sh | sh),
          # which checks the archives against the signed checksums.
          cp release/install.sh dist/install.sh
          # The desktop app for Windows (apps/electron/packaging): a zip,
          # cross-built here, signed like the other desktop packages with
          # its own bundle, which the app's updater checks (pkg/selfupdate).
          bazel build --config=release //apps/electron/packaging:windows_zip
          cp "$(bazel cquery --config=release --output=files //apps/electron/packaging:windows_zip)" "dist/Blitz_${version}_windows_x64.zip"
          cosign sign-blob --yes --new-bundle-format --bundle "dist/Blitz_${version}_windows_x64.zip.sigstore.json" "dist/Blitz_${version}_windows_x64.zip"
          # Its setup program (apps/electron/winsetup): the zip installed for
          # the person running it, without an administrator; signed alike.
          bazel build --config=release //apps/electron/packaging:windows_setup
          cp "$(bazel cquery --config=release --output=files //apps/electron/packaging:windows_setup)" "dist/Blitz_${version}_windows_x64_setup.exe"
          cosign sign-blob --yes --new-bundle-format --bundle "dist/Blitz_${version}_windows_x64_setup.exe.sigstore.json" "dist/Blitz_${version}_windows_x64_setup.exe"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.1.0-rc.1) is a pre-release, which GitHub
          # doesn't offer as the latest.
          pre=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes "${pre[@]}" \
            --notes-file .github/release-footer.md dist/*

  # The desktop app (Electron, apps/electron/packaging; spec_038_electron
  # EL-80): a macOS disk image for each Mac (arm64, x64), and Linux .debs,
  # Arch Linux packages and tarballs, attached to the draft release, each
  # signed keylessly with its own cosign bundle (the Windows zip is the
  # release job's). Bazel builds the apps and the packages; on macOS
  # sign_macos.sh signs them with a Developer ID and notarises them when
  # the signing secrets are set (spec_025_release REL-22), else signs them
  # ad hoc with a warning.
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      # GitHub's Ubuntu runners start with about 14 GB free, too little for
      # the build, the race-detector tests and five platforms' archives
      # (a run failed with "No space left on device"). Toolchains Blitz
      # doesn't use take most of the disk: remove them first. (The Android
      # SDK too: .bazelrc keeps Bazel from reading ANDROID_HOME.)
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version comes from git describe
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          # ci.yml's build outputs from main for this OS, as in the release
          # job. The key carries the CPU, so ARM Linux, which CI doesn't
          # build, finds none and builds everything.
          disk-cache: ${{ matrix.os == 'macos-latest' && 'ci-macos-latest' || 'ci-ubuntu-latest' }}
          cache-save: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1
      # A throwaway keychain holding the Developer ID certificate, and the
      # App Store Connect API key for notarytool.
      - name: Signing keychain
        if: runner.os == 'macOS' && env.SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$NOTARY_KEY" >"$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >>"$GITHUB_ENV"
      - name: Unsigned
        if: runner.os == 'macOS' && env.SIGNING != 'true'
        run: echo "::warning::MACOS_CERTIFICATE isn't set; the macOS app is signed ad hoc and not notarised"
      - name: macOS disk images
        if: runner.os == 'macOS'
        env:
          DESKTOP_SIGN_IDENTITY: ${{ env.SIGNING == 'true' && secrets.DESKTOP_SIGN_IDENTITY || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for arch in arm64 x64; do
            bazel build --config=release "//apps/electron/packaging:Blitz_${arch}.app"
            apps/electron/packaging/sign_macos.sh \
              "$(bazel cquery --config=release --output=files "//apps/electron/packaging:Blitz_${arch}.app")" \
              "$version" "dist/Blitz_${version}_macos_${arch}.dmg"
          done
      - name: Linux package
        if: runner.os == 'Linux'
        run: |
          version="${GITHUB_REF_NAME#v}"
          bazel build --config=release //apps/electron/packaging:deb
          mkdir dist
          deb="$(bazel cquery --config=release --output=files //apps/electron/packaging:deb | grep '\.deb$' | head -1)"
          cp "$deb" "dist/blitz-desktop_${version}_$(dpkg --print-architecture).deb"
          # The tarball, which updates itself (pkg/selfupdate).
          bazel build --config=release //apps/electron/packaging:linux_tar
          cp "$(bazel cquery --config=release --output=files //apps/electron/packaging:linux_tar)" "dist/blitz-desktop_${version}_linux_$(dpkg --print-architecture).tar.gz"
          # Arch's name, from the package's own pkgver (a pre-release is
          # 0.4.0rc1) and arch: blitz-desktop-0.3.2-1-x86_64.pkg.tar.zst.
          bazel build --config=release //apps/electron/packaging:pacman
          pkg="$(bazel cquery --config=release --output=files //apps/electron/packaging:pacman)"
          info="$(zstd -dcq <"$pkg" | tar -xOf - .PKGINFO)"
          cp "$pkg" "dist/blitz-desktop-$(sed -n 's/^pkgver = //p' <<<"$info")-$(sed -n 's/^arch = //p' <<<"$info").pkg.tar.zst"
      # The snap (REL-34): Bazel builds its tree, snap pack packs it.
      - name: Snap
        if: runner.os == 'Linux'
        run: |
          version="${GITHUB_REF_NAME#v}"
          bazel build --config=release //apps/electron/packaging:snap_tree
          mkdir snap-tree
          tar -xf "$(bazel cquery --config=release --output=files //apps/electron/packaging:snap_tree)" -C snap-tree
          command -v snap >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q snapd; }
          snap pack snap-tree dist
          test -e "dist/blitz-desktop_${version}_$(dpkg --print-architecture).snap"
      # It installs (its hooks run: the AppArmor profile is there) and its
      # programs run; then it's removed, and the profile with it.
      - name: Snap smoke test
        if: runner.os == 'Linux'
        run: |
          sudo snap install --dangerous --classic dist/blitz-desktop_*.snap
          blitz-desktop.blitz --version
          /snap/blitz-desktop/current/usr/lib/blitz-desktop/resources/app/bin/blitzd --version
          test -e /etc/apparmor.d/blitz-desktop-snap
          sudo snap remove --purge blitz-desktop
          test ! -e /etc/apparmor.d/blitz-desktop-snap
      # The package installs on a clean system: its dependencies resolve,
      # the app's libraries are all found, and the programs run.
      - name: Smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/blitz-desktop_*.deb
          ldd /usr/lib/blitz-desktop/blitz-desktop > ldd.txt
          if grep 'not found' ldd.txt; then exit 1; fi
          /usr/lib/blitz-desktop/resources/app/bin/blitz --version
          /usr/lib/blitz-desktop/resources/app/bin/blitzd --version
          /usr/lib/blitz-desktop/resources/app/bin/blitz-tray --version
          test "$(readlink -f /usr/bin/blitz-desktop)" = /usr/lib/blitz-desktop/blitz-desktop
          test "$(stat -c %a:%U /usr/lib/blitz-desktop/chrome-sandbox)" = 4755:root
      # The Arch package installs on a current Arch Linux with pacman: its
      # dependencies resolve, the libraries are found, the programs run and
      # the files match its .MTREE. x86_64 only: Arch has no arm64 image.
      # pacman's download sandbox is off: it needs seccomp and Landlock,
      # which a container may not give it, and the container is thrown away.
      - name: Arch Linux smoke test
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" archlinux:latest bash -euxc '
            pacman -Syu --noconfirm --needed --disable-sandbox
            pacman -U --noconfirm --disable-sandbox /dist/blitz-desktop-*.pkg.tar.zst
            if ldd /usr/lib/blitz-desktop/blitz-desktop | grep "not found"; then exit 1; fi
            /usr/lib/blitz-desktop/resources/app/bin/blitz --version
            /usr/lib/blitz-desktop/resources/app/bin/blitzd --version
            /usr/lib/blitz-desktop/resources/app/bin/blitz-tray --version
            test "$(readlink -f /usr/bin/blitz-desktop)" = /usr/lib/blitz-desktop/blitz-desktop
            pacman -Qkk blitz-desktop
            pacman -R --noconfirm blitz-desktop
            test ! -e /usr/lib/blitz-desktop
          '
      - name: Sign and attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for f in *.dmg *.deb *.snap *.pkg.tar.zst *.tar.gz; do
            [ -e "$f" ] || continue
            cosign sign-blob --yes --new-bundle-format --bundle "$f.sigstore.json" "$f"
            gh release upload "$GITHUB_REF_NAME" "$f" "$f.sigstore.json" --clobber
          done
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && env.SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" && rm -f "$RUNNER_TEMP/notary.p8"

  # The apt repository (spec_025_release REL-30): a published release's
  # .debs (not a pre-release's), checked against their bundles, with
  # signed indexes and AppStream data (tools/apt_repo.sh), in the bucket
  # that blitz-desktop.sources names. GCP takes this workflow's identity
  # (Workload Identity Federation: no key is kept). By hand for a tag
  # already published: gh workflow run release.yml --ref v0.9.8 -f publish=true.
  apt:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    concurrency: apt-repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1
      - name: The release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          [ "$state" = "false false" ] || { echo "::error::$GITHUB_REF_NAME isn't a published release ($state)"; exit 1; }
          gh release download "$GITHUB_REF_NAME" --dir debs --pattern 'blitz-desktop_*.deb' --pattern 'blitz-desktop_*.deb.sigstore.json'
          for f in debs/*.deb; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/retail-cortex/blitz/\.github/workflows/release\.yml@refs/tags/v' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          rm debs/*.sigstore.json
      - name: Repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q apt-utils appstream-compose appstream
          gpg --batch --import <<<"$APT_SIGNING_KEY"
          # The key signing is the one the package trusts.
          key="$(gpg --show-keys --with-colons apps/electron/packaging/linux/blitz-desktop.asc | awk -F: '/^fpr/{print $10; exit}')"
          gpg --list-secret-keys "$key" >/dev/null
          tools/apt_repo.sh repo "$key" debs/*.deb
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.APT_WIF_PROVIDER }}
          service_account: ${{ vars.APT_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # The packages first, then the indexes naming them, InRelease last.
      # The indexes are never cached (apt would see an old release); the
      # packages always are. The previous release's packages stay, for a
      # machine that read the indexes before this run; older ones go.
      - name: Upload
        run: |
          b="gs://${{ vars.APT_BUCKET }}"
          pool=pool/main/b/blitz-desktop
          keep="$( (gcloud storage cat "$b/dists/stable/main/binary-*/Packages" 2>/dev/null || true; cat repo/dists/stable/main/binary-*/Packages) | sed -n 's/^Filename: //p' | sort -u)"
          gcloud storage cp --cache-control="public, max-age=31536000, immutable" repo/$pool/*.deb "$b/$pool/"
          gcloud storage rsync --recursive --delete-unmatched-destination-objects --cache-control="no-cache, max-age=0" \
            --exclude='^stable/(InRelease|Release|Release\.gpg)$' repo/dists "$b/dists"
          gcloud storage cp --cache-control="no-cache, max-age=0" repo/dists/stable/Release repo/dists/stable/Release.gpg "$b/dists/stable/"
          gcloud storage cp --cache-control="no-cache, max-age=0" repo/dists/stable/InRelease "$b/dists/stable/"
          gcloud storage cp --cache-control="no-cache, max-age=0" repo/blitz-desktop.asc "$b/"
          for obj in $(gcloud storage ls "$b/$pool/"); do
            grep -qx "${obj#"$b/"}" <<<"$keep" || gcloud storage rm "$obj"
          done

  # The Snap Store (REL-35): a published release's snaps (not a
  # pre-release's), checked against their bundles, uploaded to the stable
  # channel. Nothing until the owner stores SNAPCRAFT_STORE_CREDENTIALS
  # (snapcraft export-login); a classic snap is held for the store's review
  # until Canonical approves classic confinement for it.
  snap:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Not set up
        if: env.SNAPCRAFT_STORE_CREDENTIALS == ''
        run: echo "::notice::SNAPCRAFT_STORE_CREDENTIALS isn't set, so the snaps aren't uploaded to the Snap Store"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          cosign-release: v2.6.1
      - name: Upload
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir snaps --pattern 'blitz-desktop_*.snap' --pattern 'blitz-desktop_*.snap.sigstore.json'
          sudo snap install snapcraft --classic
          for f in snaps/*.snap; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/retail-cortex/blitz/\.github/workflows/release\.yml@refs/tags/v' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
            snapcraft upload --release=stable "$f"
          done

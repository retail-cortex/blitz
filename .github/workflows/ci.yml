name: ci

# Documentation-only changes don't need a build; docs.yml builds the site.
# A run can also be started by hand (Actions > ci > Run workflow): after
# pushes marked [skip ci], or that changed only documentation.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Everything goes through Bazel (the runners ship Bazelisk; .bazelversion
  # picks Bazel): Go, the page, the protos, the tools. One job per OS
  # builds, tests and checks everything.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # GitHub's Ubuntu runners start with about 14 GB free, too little for
      # the build, the race-detector tests and five platforms' archives
      # (a run failed with "No space left on device"). Toolchains Blitz
      # doesn't use take most of the disk: remove them first. (The Android
      # SDK too: .bazelrc keeps Bazel from reading ANDROID_HOME.)
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking compares with the previous commit
      # The disk cache's key hashes MODULE.bazel and every BUILD file: a
      # change to one restores the last cache and saves it again, with this
      # run's outputs added. Only main saves: another branch's caches serve
      # only that branch, and GitHub's 10 GB for the repository evicts the
      # oldest first, main's included (a run started by hand on a branch
      # saved 7.8 GB). release.yml restores these by name
      # (ci-ubuntu-latest, ci-macos-latest): keep the names in step.
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}
      # Bazel touches each disk cache entry it reads or writes: what this
      # run didn't touch is removed before the cache is saved (below).
      - name: Mark the build's start
        run: touch "$RUNNER_TEMP/build-start"
      # Linux runs the real bubblewrap sandbox tests, and builds the
      # desktop app against the system's GTK and WebKitGTK.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # gVisor runs skill scripts on Linux; pinned release and checksum.
      - name: Install gVisor (runsc)
        if: runner.os == 'Linux'
        env:
          GVISOR_RELEASE: "20260921.0"
          GVISOR_SHA512: 7c899979bed334f0987888c41e545cede8e1f7e67a257978c8de244c3867e32bc30d08491e9af36720273c502acd01d8d86c9844ebcbe125790c43fe6bdf563e
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gvisor.tar.bz2 "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  gvisor.tar.bz2" | sha512sum -c -
          mkdir -p gvisor && tar -xjf gvisor.tar.bz2 -C gvisor
          echo "RUNSC_PATH=$RUNNER_TEMP/gvisor/runsc" >> "$GITHUB_ENV"
      # gofmt, and BUILD files as Gazelle writes them. (vet and staticcheck
      # run in every compile: nogo.)
      - name: Formatting and license headers
        run: tools/check_format.sh
      # Every test, the Go ones with the race detector: Go, the page's
      # vitest and type check, the proto lint.
      - name: Tests
        if: runner.os != 'Linux'
        run: bazel test --config=race //...
      # On Linux, where the sandbox and gVisor tests also run, the same
      # tests run instrumented: the coverage of apps/ and pkg/ goes into the
      # job summary, and the job fails below tools/coverage/floor.txt.
      # docs.yml publishes the report on the site. Xvfb gives Export as
      # PDF's printing tests a display (its socket mounted into the sandbox).
      - name: Tests, with coverage
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -f "$RUNNER_TEMP/Xauthority" tools/coverage.sh --config=race \
            --sandbox_add_mount_pair=/tmp/.X11-unix -- --markdown="$GITHUB_STEP_SUMMARY"
      - name: Upload the coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: docs/data/coverage.json
      # Export as PDF prints with WebKitGTK, which needs a display: Xvfb's,
      # its socket mounted into the test's sandbox. It must not skip.
      - name: Print to PDF with WebKitGTK
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -f "$RUNNER_TEMP/Xauthority" bazel test //apps/desktop/internal/printpdf:printpdf_test \
            --nocache_test_results --sandbox_add_mount_pair=/tmp/.X11-unix \
            --test_output=all --test_arg=-test.v | tee print.txt
          if grep -q -- '--- SKIP' print.txt; then exit 1; fi
      - name: Sandbox enforcement must not be skipped
        run: |
          bazel test //pkg/engine/tools:tools_test --nocache_test_results --test_output=all \
            --test_arg=-test.v --test_arg=-test.run=TestOSSandboxEnforcement | tee out.txt
          if grep -q -- '--- SKIP' out.txt; then exit 1; fi
      # Skill scripts' environments for real (BL-SK-06): Python packages
      # (uv), npm packages for TypeScript (Node 22), a uv-managed Python the
      # system doesn't have. They need the network, so they're opt-in
      # elsewhere; here they must not skip.
      - name: Set up Node
        if: runner.os == 'Linux'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Set up uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Script environments
        if: runner.os == 'Linux'
        run: |
          bazel test //pkg/engine/tools:tools_test --nocache_test_results --test_output=all \
            --test_env=PATH="$PATH" --test_env=BLITZ_PYENV_TESTS=1 --test_env=BLITZ_UV_PYTHON=3.13 \
            --test_arg=-test.v --test_arg=-test.run='InstallsPackages|TypeScript|RequiresPython' | tee envs.txt
          if grep -q -- '--- SKIP' envs.txt; then exit 1; fi
      - name: gVisor script sandbox must not be skipped
        if: runner.os == 'Linux'
        run: |
          bazel test //pkg/engine/tools:tools_test --nocache_test_results --test_output=all \
            --test_arg=-test.v --test_arg=-test.run=TestGVisor | tee gv.txt
          if grep -q -- '--- SKIP' gv.txt; then exit 1; fi
      # A sandboxed command's start-up on Linux, once the first command has
      # scanned a 50,000-entry workspace for blocked paths: at most 20 ms
      # (BL-SH-01).
      - name: Sandbox start-up stays fast
        if: runner.os == 'Linux'
        run: |
          bazel test //pkg/engine/tools:tools_test --nocache_test_results --test_output=all \
            --test_arg=-test.run='^$' --test_arg=-test.bench=BenchmarkBlockedScan \
            --test_arg=-test.benchtime=20x | tee bench.txt
          awk '/BenchmarkBlockedScan\/warm/ { found = 1; ms = $3 / 1e6; print "warm scan:", ms, "ms"; if (ms > 20) bad = 1 }
               END { if (!found) { print "no warm scan result"; exit 1 } if (bad) exit 1 }' bench.txt
      # Apps depend on pkg/ only; front ends never on the engine.
      - name: Dependency rules
        run: bazel run //tools:check_deps
      # THIRD_PARTY_NOTICES matches what the programs link, and every
      # license in it is one Blitz accepts.
      - name: Third-party notices
        run: tools/third_party_notices.sh --check
      # Every spec is indexed and every repository path it names exists.
      - name: Specs
        run: bazel run //tools/specs
      # .github/CODEOWNERS is generated from OWNERS.txt.
      - name: Code owners
        run: bazel run //tools/codeowners -- --check
      # Fails only on a vulnerability the code can reach. The scan needs the
      # symbol table to see which packages are linked: without it, every
      # advisory in a required module counts (GO-2026-5932, all of x/crypto
      # for its unused openpgp package), so it scans unstripped builds.
      - name: govulncheck
        run: |
          bazel build --strip=never //apps/cli:blitz //apps/service:blitzd
          for t in //apps/cli:blitz //apps/service:blitzd; do
            bazel run @org_golang_x_vuln//cmd/govulncheck -- -mode=binary "$PWD/$(bazel cquery --strip=never --output=files "$t")"
          done
      # The API protos: formatting, and no breaking change against the
      # previous commit, unless its message declares "Breaking-API: <why>".
      - name: Protos
        if: runner.os == 'Linux'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bazel run //tools:buf -- format --exit-code -d
          if git log -1 --format=%B "$GITHUB_SHA" | grep -q '^Breaking-API:'; then
            echo "::notice::API break declared: $(git log -1 --format=%B "$GITHUB_SHA" | grep '^Breaking-API:')"
          elif git cat-file -e "$BASE:proto/blitz/v1" 2>/dev/null || git cat-file -e "$BASE:api/blitz/v1" 2>/dev/null; then
            bazel run //tools:buf -- breaking --against ".git#ref=$BASE"
          fi
      # The release archives, which the reproducible job compares.
      - name: Release archives
        run: bazel build //release:archives
      - name: Archive checksums
        run: |
          for f in $(bazel cquery --output=files //release:archives); do
            shasum -a 256 "$f" | awk -v n="$(basename "$f")" '{print $1, n}'
          done > sums-${{ runner.os }}.txt
      - name: Upload the checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sums-${{ runner.os }}
          path: sums-${{ runner.os }}.txt
      # Otherwise the disk cache only grows: every entry any earlier run
      # wrote is restored and saved again (it reached 4.6 GB on macOS).
      # Only after a whole run, so that everything the build needs was
      # touched.
      - name: Keep only this run's disk cache entries
        if: success()
        run: |
          du -sh ~/.cache/bazel-disk
          find ~/.cache/bazel-disk -type f ! -newer "$RUNNER_TEMP/build-start" -delete
          du -sh ~/.cache/bazel-disk
      # setup-bazel saves its caches after the job, compressing them on the
      # runner's disk, which the build has all but filled on Linux. The
      # output tree isn't cached; removing it makes room.
      - name: Make room to save the caches
        if: always() && runner.os == 'Linux'
        run: bazel clean

  # The release archives, built on Linux and on macOS, must come out byte
  # for byte identical: the build may not depend on the machine.
  reproducible:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sums-*
          merge-multiple: true
      - name: Linux and macOS built the same archives
        run: diff sums-Linux.txt sums-macOS.txt

  # A cache is never updated, only saved again under a new key, and GitHub
  # keeps the superseded ones for a week: on main, keep only the newest
  # setup-bazel cache of each kind (OS, workflow, disk or repository),
  # after a push or a run started by hand.
  prune-caches:
    needs: build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          declare -A newest
          gh cache list --ref refs/heads/main --key setup-bazel- --sort created_at --order desc --limit 100 \
            --json id,key,sizeInBytes --jq '.[] | "\(.id) \(.sizeInBytes) \(.key)"' |
            while read -r id size key; do
              kind="${key%-*}" # the key without its hash
              if [ -n "${newest[$kind]:-}" ]; then
                echo "deleting $key ($((size / 1000000)) MB)"
                gh cache delete "$id"
              else
                newest[$kind]=1
              fi
            done
